name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version consistency
        shell: pwsh
        run: |
          # 版本号分布在多处（运行时取 Cargo.toml，安装包取 tauri.conf.json），
          # 任一处漏改就会出现「装着 0.3.6 却提示 0.3.7」这类更新异常。
          # 这里只做校验，不改动发布行为。
          function Get-Ver($path, $pattern) {
            $m = Select-String -Path $path -Pattern $pattern | Select-Object -First 1
            if (-not $m) { throw "无法从 $path 解析版本号" }
            return $m.Matches[0].Groups[1].Value
          }
          $cargo = Get-Ver 'src-tauri/Cargo.toml'      '^version = "([^"]+)"'
          $conf  = Get-Ver 'src-tauri/tauri.conf.json' '"version": "([^"]+)"'
          $iss   = Get-Ver 'installer.iss'             'MyAppVersion "([^"]+)"'
          $pkg   = (Get-Content -Path 'package.json' -Raw | ConvertFrom-Json).version
          # Cargo.lock 需要跨行匹配，单独用 regex（Select-String 是按行的）
          $lockRaw = Get-Content -Path 'src-tauri/Cargo.lock' -Raw
          $lock = [regex]::Match($lockRaw, 'name = "seahi-serial"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (-not $lock) { throw '无法从 src-tauri/Cargo.lock 解析 seahi-serial 版本号' }
          Write-Host "cargo=$cargo conf=$conf iss=$iss pkg=$pkg lock=$lock"
          foreach ($v in @($conf, $iss, $pkg, $lock)) {
            if ($v -ne $cargo) { throw "版本号不一致：Cargo.toml=$cargo 但 conf/iss/pkg/lock 中存在 $v" }
          }
          # tag 构建时：tag 必须与版本号一致（手动触发是分支名，跳过该检查）
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$cargo") { throw "tag=$tag 与版本号 v$cargo 不一致" }
            Write-Host "tag 校验通过：$tag"
          } else {
            Write-Host "非 tag 触发（${{ github.ref }}），跳过 tag 校验"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $all = Get-Content -Path "RELEASE_NOTES.md" -Raw
          # 只提取当前版本段落（"## <tag>" 到下一个 "## v" 或文件末尾），不含历史版本
          $pattern = '(?s)##\s*' + [regex]::Escape($tag) + '\s*(.*?)(?=\n##\s*v|\z)'
          $m = [regex]::Match($all, $pattern)
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { $all }
          $body = $body -replace '\{VERSION\}', $tag
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo "$body" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        # 三套都要过才继续构建：后端单测（含真实回环端口的 MCP 端到端）、
        # 前端无头断言（含 BLE / 内存上限 / MCP 控件注册表与日志中心）、
        # npm 安装器自测（临时目录 + 自带探活服务，不碰真实客户端配置）。
        # 任一套失败就中断，避免带着回归发版。
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "后端单测失败" }
          node .walkthrough/gen_ble_preview.js
          if ($LASTEXITCODE -ne 0) { throw "前端断言失败" }
          node npm/seahi-serial-mcp/test/self-test.js
          if ($LASTEXITCODE -ne 0) { throw "npm 安装器自测失败" }
          Write-Host "三套测试全部通过"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "${{ steps.notes.outputs.body }}"
          releaseDraft: false
          prerelease: false
          args: "--bundles msi"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download platform-tools (ADB)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\platform-tools.zip"
          $dest = "$env:GITHUB_WORKSPACE\platform-tools"
          Write-Host "Downloading latest platform-tools..."
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP" -Force
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Move-Item -Path "$env:TEMP\platform-tools" -Destination $dest
          Write-Host "platform-tools staged at $dest"

      - name: Download Chinese language pack
        continue-on-error: true
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (!(Test-Path $langDir)) { New-Item -ItemType Directory -Path $langDir -Force }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"

      - name: Build Inno Setup installer
        run: iscc installer.iss

      - name: Upload Inno Setup installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: installer/Seahi-Serial-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
