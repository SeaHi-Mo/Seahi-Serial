name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # cosign keyless（GitHub OIDC）签名需要；删掉这一行签名步骤会失败
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version consistency
        shell: pwsh
        run: |
          # 版本号分布在多处（运行时取 Cargo.toml，安装包取 tauri.conf.json），
          # 任一处漏改就会出现「装着 0.3.6 却提示 0.3.7」这类更新异常。
          # 这里只做校验，不改动发布行为。
          function Get-Ver($path, $pattern) {
            $m = Select-String -Path $path -Pattern $pattern | Select-Object -First 1
            if (-not $m) { throw "无法从 $path 解析版本号" }
            return $m.Matches[0].Groups[1].Value
          }
          $cargo = Get-Ver 'src-tauri/Cargo.toml'      '^version = "([^"]+)"'
          $conf  = Get-Ver 'src-tauri/tauri.conf.json' '"version": "([^"]+)"'
          $iss   = Get-Ver 'installer.iss'             'MyAppVersion "([^"]+)"'
          $pkg   = (Get-Content -Path 'package.json' -Raw | ConvertFrom-Json).version
          # Cargo.lock 需要跨行匹配，单独用 regex（Select-String 是按行的）
          $lockRaw = Get-Content -Path 'src-tauri/Cargo.lock' -Raw
          $lock = [regex]::Match($lockRaw, 'name = "seahi-serial"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (-not $lock) { throw '无法从 src-tauri/Cargo.lock 解析 seahi-serial 版本号' }
          Write-Host "cargo=$cargo conf=$conf iss=$iss pkg=$pkg lock=$lock"
          foreach ($v in @($conf, $iss, $pkg, $lock)) {
            if ($v -ne $cargo) { throw "版本号不一致：Cargo.toml=$cargo 但 conf/iss/pkg/lock 中存在 $v" }
          }
          # 发布说明必须**只包含当前版本**：历史版本不要留在文件里（否则 GitHub Release 页面
          # 会变成一堆旧版本说明；v0.5.19 就是这么发出去的 —— 见 doc/CODE_REVIEW_FULL_2026-09.md 之后的复盘）。
          $notes = Get-Content -Path 'RELEASE_NOTES.md' -Raw
          $heads = [regex]::Matches($notes, '(?m)^##\s+(v[0-9]+\.[0-9]+\.[0-9]+)\s*$')
          if ($heads.Count -ne 1) {
            throw "RELEASE_NOTES.md 必须只包含一个版本段落（当前 $($heads.Count) 个）：$([string]::Join(', ', ($heads | ForEach-Object { $_.Groups[1].Value })))"
          }
          if ($heads[0].Groups[1].Value -ne "v$cargo") {
            throw "RELEASE_NOTES.md 版本段落 $($heads[0].Groups[1].Value) 与 Cargo.toml v$cargo 不一致"
          }
          Write-Host "发布说明版本校验通过：$($heads[0].Groups[1].Value)"
          # tag 构建时：tag 必须与版本号一致（手动触发是分支名，跳过该检查）
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$cargo") { throw "tag=$tag 与版本号 v$cargo 不一致" }
            Write-Host "tag 校验通过：$tag"
          } else {
            Write-Host "非 tag 触发（${{ github.ref }}），跳过 tag 校验"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $all = Get-Content -Path "RELEASE_NOTES.md" -Raw
          # 只提取当前版本段落（"## <tag>" 到下一个 "## v" 或文件末尾），不含历史版本
          $pattern = '(?s)##\s*' + [regex]::Escape($tag) + '\s*(.*?)(?=\n##\s*v|\z)'
          $m = [regex]::Match($all, $pattern)
          # 缺当前版本段落时**直接失败**：绝不能退回"$all"（那会把历史版本说明整段发到 Release 页面）
          if (-not $m.Success) {
            throw "RELEASE_NOTES.md 缺少当前版本段落：## $tag（发布说明必须包含且只包含当前版本）"
          }
          $body = $m.Groups[1].Value.Trim()
          $body = $body -replace '\{VERSION\}', $tag
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo "$body" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        # 三套都要过才继续构建：后端单测（含真实回环端口的 MCP 端到端）、
        # 前端无头断言（含 BLE / 内存上限 / MCP 控件注册表与日志中心）、
        # npm 安装器自测（临时目录 + 自带探活服务，不碰真实客户端配置）。
        # 任一套失败就中断，避免带着回归发版。
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "后端单测失败" }
          node .walkthrough/gen_ble_preview.js
          if ($LASTEXITCODE -ne 0) { throw "前端断言失败" }
          node npm/seahi-serial-mcp/test/self-test.js
          if ($LASTEXITCODE -ne 0) { throw "npm 安装器自测失败" }
          Write-Host "三套测试全部通过"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "${{ steps.notes.outputs.body }}"
          releaseDraft: false
          prerelease: false
          args: "--bundles msi"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download platform-tools (ADB)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\platform-tools.zip"
          $dest = "$env:GITHUB_WORKSPACE\platform-tools"
          Write-Host "Downloading latest platform-tools..."
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP" -Force
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Move-Item -Path "$env:TEMP\platform-tools" -Destination $dest
          Write-Host "platform-tools staged at $dest"

      - name: Download Chinese language pack
        continue-on-error: true
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (!(Test-Path $langDir)) { New-Item -ItemType Directory -Path $langDir -Force }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"

      - name: Build Inno Setup installer
        run: iscc installer.iss

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SHA256SUMS and sign with cosign (keyless)
        shell: pwsh
        run: |
          # 发布资产 = MSI（tauri-action 已上传）+ Inno Setup 安装包（下面这步上传）。
          # 只签 SHA256SUMS.txt：用户先用 cosign 验它，再用其中的 SHA-256 核对安装包，
          # 这样签名文件只有三个、校验链路也短。
          $files = @()
          $files += Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path 'installer/Seahi-Serial-Setup-*.exe' -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) { throw '找不到发布产物（MSI / Inno Setup 安装包）' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$h  $($f.Name)"
            "$h  $($f.Name)"
          }
          Set-Content -Path 'SHA256SUMS.txt' -Value $lines -Encoding ascii
          # keyless 签名：证书由 Fulcio 按 GitHub OIDC 身份临时签发，写入 Rekor 透明日志。
          # cosign v3 用 bundle（签名 + 证书 + 透明日志证明打包成一个文件），不再输出 .sig/.pem。
          cosign sign-blob --yes --bundle 'SHA256SUMS.txt.sigstore.json' 'SHA256SUMS.txt'
          Get-ChildItem SHA256SUMS.txt* | Select-Object Name, Length

      - name: Upload Inno Setup installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            installer/Seahi-Serial-Setup-*.exe
            SHA256SUMS.txt
            SHA256SUMS.txt.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
