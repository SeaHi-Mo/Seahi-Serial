name: Docs

# ⚠️ 站点**部署**由 Cloudflare Pages 的 Git 集成负责（`main` 推送自动构建，配置见 doc/DEPLOY_CLOUDFLARE.md）。
# 这个 workflow 只做**构建校验**：文档改坏了在 Actions 里就能看到，不必等 Cloudflare 那边失败。
# 不要再往这里加 `wrangler pages deploy` —— Direct Upload 和 Git 集成是两种项目，混着用会报
# "project is a git project"，而且两套部署会互相覆盖（谁后跑谁生效）。
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'website/**'
      - 'doc/MCP_TOOLS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          # 打 tag 时用 tag 名；其他情况退回仓库当前版本号，别让站点上出现 "dev"。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: website
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: npm run build
