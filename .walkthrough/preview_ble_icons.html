<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BLE 面板 — 渲染预览</title>
<style>
:root {
    --bg: #1c1e22;
    --editor-bg: #1c1e22;
    --toolbar-bg: #22252a;
    --input-bg: #2e3138;
    --border: #2e3138;
    --border-h: #3a3e46;
    --text: #b8bcc4;
    --text-b: #dce0e8;
    --text-d: #6b7280;
    --link: #6a9fd8;
    --btn-p: #4a7ab5;
    --btn-ph: #5888c0;
    --btn-pa: #3c6aa5;
    --split-line: #4a7ab5;
    --surface-1: #262930;
    --surface-2: #22252a;
    --surface-3: #1c1e22;
    --text-soft: #8b919a;
    --text-muted: #5a6070;
    --text-placeholder: #454b56;
    --accent-focus: #4a7ab5;
    --accent-green: #5a9e6e;
    --accent-red: #c45c5c;
    --accent-orange: #c08040;
    --accent-contrast: #2a4878;
    --send-bubble-bg: #1e3050;
    --send-bubble-text: #dce0e8;
    --mapped-bg: rgba(106,149,184,0.06);
    --mapped-border: rgba(106,149,184,0.2);
    --wsl-dist-border: rgba(106,149,184,0.3);
    --wsl-dist-bg: rgba(106,149,184,0.08);
    --wsl-dist-stop-bg: rgba(192,128,64,0.1);
    --wsl-dist-start-bg: rgba(74,122,181,0.1);
    --font-ui: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "Cascadia Code", "JetBrains Mono", "Fira Code", "Consolas", monospace;
}

.ble-body { flex:1; display:flex; min-height:0; }
.ble-left, .ble-pf-left {
    flex:0 0 400px; min-width:320px; max-width:46%;
    display:flex; flex-direction:column;
    border-right:1px solid var(--border); background:var(--editor-bg);
}
.ble-left-head { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--toolbar-bg); flex-shrink:0; min-height:44px; }
.ble-left-title { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text-b); white-space:nowrap; min-width:0; }
.ble-left-title svg { color:var(--link); }
.ble-devList { flex:1; min-height:0; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.ble-right { flex:1; min-width:0; display:flex; flex-direction:column; }
.ble-monArea { display:none; flex:0 0 380px; min-width:280px; max-width:46%; overflow:hidden; }
.ble-monArea.active { display:flex; }
.ble-mon-resize { width:5px; cursor:col-resize; background:var(--border);
                  flex-shrink:0; position:relative; z-index:10; }
.ble-mon-resize:hover, .ble-mon-resize.dragging { background:var(--split-line); }
.ble-dev-card { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); cursor:pointer; transition: background .15s, border-color .15s, color .15s; }
.ble-dev-card:hover { border-color:var(--border-h); }
.ble-dev-card.active { border-color:var(--accent-focus); background:var(--accent-focus); }
.ble-dev-card.active .ble-dev-name { color:#fff; }
.ble-dev-card.active .ble-dev-sub { color:rgba(255,255,255,.85); }
.ble-dev-main { flex:1; min-width:0; }
.ble-dev-name { font-size:13px; font-weight:500; color:var(--text); display:flex; align-items:baseline; min-width:0; }
.ble-dev-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ble-dev-tag { flex-shrink:0; margin-left:3px; font-size:12px; font-weight:400; color:var(--text-d); }
.ble-dev-card.active .ble-dev-tag { color:rgba(255,255,255,.75); }
.ble-dev-conn { flex-shrink:0; margin-left:10px; font-size:12px; font-weight:500; color:var(--accent-green); }
.ble-dev-card.active .ble-dev-conn { color:rgba(255,255,255,.9); }
.ble-dev-icon { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; opacity:.75; }
.ble-dev-icon svg { height:22px; width:auto; display:block; }
.ble-dev-card.active .ble-dev-icon { color:#fff; opacity:.95; }
.ble-dev-sub { font-size:11px; color:var(--text-d); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.ble-dev-rssi { font-size:11px; font-family:var(--font-mono); flex-shrink:0; }
.ble-dev-rssi-bar { width:34px; height:5px; border-radius:3px; background:var(--border); overflow:hidden; flex-shrink:0; }
.ble-dev-rssi-bar > span { display:block; height:100%; border-radius:3px; }
.ble-empty { margin:auto; text-align:center; color:var(--text-d); font-size:13px; line-height:2; }
.ble-empty b { color:var(--text-b); }
.ble-err { margin:auto; text-align:center; color:var(--accent-red); font-size:13px; background:rgba(196,92,92,.12); border:1px solid var(--accent-red); padding:10px 14px; border-radius:8px; }
.ble-filter-row { display:flex; align-items:center; padding:0 12px 6px; flex-shrink:0; background:var(--toolbar-bg); border-bottom:1px solid var(--border); }
.ble-filter-toggle { display:inline-flex; align-items:center; gap:4px; padding:3px 6px; border-radius:4px; cursor:pointer; user-select:none; font-size:11px; color:var(--text-d); border:1px solid transparent; flex-shrink:0; }
.ble-filter-toggle:hover { color:var(--text-b); background:var(--input-bg); }
.ble-filter-toggle.expanded { color:var(--accent-focus); }
.ble-filter-toggle .ble-svc-caret { font-size:9px; width:9px; flex-shrink:0; transition: transform .15s; }
.ble-filter-toggle.expanded .ble-svc-caret { transform:rotate(90deg); }
.ble-filter-count { color:var(--text-d); font-size:11px; font-family:var(--font-mono); }
.ble-filter-body { padding:8px 12px; border-bottom:1px solid var(--border); background:var(--editor-bg); flex-shrink:0; }
.ble-filter-input { width:100%; box-sizing:border-box; height:28px; padding:0 8px; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text); font-size:12px; outline:none; }
.ble-filter-input:focus { border-color:var(--accent-focus); }
.ble-filter-hint { font-size:10px; color:var(--text-d); margin-top:4px; }
.ble-scan-secs { margin-left:6px; flex-shrink:0; height:28px; box-sizing:border-box; padding:0 4px;
                 border:1px solid var(--border); border-radius:5px; background:var(--input-bg);
                 color:var(--text-b); font-size:11px; font-family:inherit; cursor:pointer; outline:none; }
.ble-scan-secs:focus { border-color:var(--accent-focus); }
.ble-direct-row { display:flex; align-items:center; gap:6px; padding:0 12px 8px; flex-shrink:0;
                  background:var(--toolbar-bg); border-bottom:1px solid var(--border); }
.ble-direct-input { flex:1; min-width:0; height:26px; box-sizing:border-box; padding:0 8px;
                    border:1px solid var(--border); border-radius:5px; background:var(--input-bg);
                    color:var(--text); font-size:11px; font-family:var(--font-mono); outline:none; }
.ble-direct-input:focus { border-color:var(--accent-focus); }
.ble-direct-btn { flex-shrink:0; height:26px; padding:0 10px; border:1px solid var(--border); border-radius:5px;
                  background:var(--input-bg); color:var(--text-b); font-size:11px; font-family:inherit; cursor:pointer; }
.ble-direct-btn:hover { border-color:var(--accent-focus); color:var(--accent-focus); }
.ble-direct-btn:disabled { opacity:.5; cursor:not-allowed; }
.ble-detail { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
.ble-detail-empty { margin:auto; color:var(--text-d); font-size:13px; }
.ble-detail-head { display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--border); flex-shrink:0; min-height:44px; }
.ble-detail-name { font-size:15px; font-weight:600; color:var(--text-b); }
.ble-detail-meta { font-size:12px; color:var(--text-d); font-family:var(--font-mono); }
.ble-connect-btn { margin-left:auto; }
.ble-connect-btn.connected { background:var(--accent-focus); border-color:var(--accent-focus); color:#fff; }
.ble-detail-sec { padding:14px 18px; border-bottom:1px solid var(--border); overflow-y:auto; }
.ble-sec-title { font-size:11px; font-weight:600; color:var(--text-d); margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em; }
.ble-svc { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px; border:1px solid var(--border); margin-bottom:6px; background:var(--input-bg); cursor:pointer; transition: border-color .15s; }
.ble-svc:hover { border-color:var(--border-h); }
.ble-svc.expanded { border-color:var(--accent-focus); }
.ble-svc-caret { font-size:10px; color:var(--text-d); width:12px; flex-shrink:0; transition: transform .15s; }
.ble-svc.expanded .ble-svc-caret { transform:rotate(90deg); }
.ble-svc-attr { font-size:9px; font-weight:700; color:var(--text-d); border:1px solid var(--border); border-radius:4px; padding:0 4px; flex-shrink:0; line-height:14px; letter-spacing:.02em; text-align:center; min-width:18px; }
.ble-svc-uuid { font-family:var(--font-mono); font-size:12px; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ble-svc-type { margin-left:auto; flex-shrink:0; font-size:11px; color:var(--text-d); white-space:nowrap; }
.ble-charGroup { padding:4px 0 8px 22px; display:flex; flex-direction:column; gap:4px; }
.ble-char { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; background:var(--editor-bg); border:1px solid var(--border); }
.ble-char-uuid { font-family:var(--font-mono); font-size:12px; color:var(--text); flex:0 0 auto; width:38ch; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ble-char-name { font-size:11px; color:var(--text-d); margin-left:6px; flex-shrink:0; white-space:nowrap; }
.ble-char-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:auto; }
.ble-ch-action { display:inline-flex; align-items:center; justify-content:center; color:var(--text-d); cursor:not-allowed; transition: color .15s; }
.ble-ch-action svg { width:18px; height:18px; }
.ble-ch-action.ready { cursor:pointer; }
.ble-ch-action.ready:hover { color:var(--link); }
.ble-ch-action.on { color:var(--accent-focus); cursor:pointer; }
.ble-ch-action.on:hover { color:var(--link); }
.ble-char-tag { font-size:10px; color:var(--text-d); margin-left:auto; flex-shrink:0; }
.ble-char-descs { display:flex; flex-wrap:wrap; gap:5px; padding:0 10px 2px 18px; }
.ble-desc { display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono);
            font-size:10px; color:var(--text-d); background:var(--input-bg);
            border:1px solid var(--border); border-radius:4px; padding:1px 6px; white-space:nowrap; }
.ble-desc em { font-style:normal; opacity:.75; }
.ble-desc:hover { color:var(--text); }
.ble-desc-act { display:inline-flex; align-items:center; justify-content:center;
                margin-left:2px; cursor:pointer; color:var(--text-d); }
.ble-desc-act svg { width:13px; height:13px; display:block; }
.ble-desc-act:hover { color:var(--link); }
.ble-adv { display:flex; flex-direction:column; gap:6px; }
.ble-adv-sec { padding-bottom:10px; }
.ble-adv-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.ble-adv-toggle .ble-svc-caret { font-size:10px; color:var(--text-d); width:12px; flex-shrink:0; transition: transform .15s; }
.ble-adv-toggle.expanded .ble-svc-caret { transform:rotate(90deg); }
.ble-adv-count { margin-left:auto; color:var(--text-d); font-size:11px; font-family:var(--font-mono); flex-shrink:0; }
.ble-adv-body { margin-top:8px; }
.ble-adv-raw { font-family:var(--font-mono); font-size:11px; line-height:1.6; color:var(--text); background:var(--editor-bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:4px 6px; }
.ble-adv-seg { display:flex; flex-direction:column; align-items:center; }
.ble-adv-seg-label { font-style:normal; color:var(--text-d); font-size:10px; margin-bottom:3px; }
.ble-adv-seg-hex { white-space:nowrap; }
.ble-adv-sep { align-self:flex-end; color:var(--text-d); opacity:.5; padding-bottom:2px; }
.ble-adv-brief { margin-top:8px; display:grid; grid-template-columns:repeat(2, max-content minmax(0,1fr)); gap:6px 20px; align-items:baseline; }
.ble-adv-row { display:flex; gap:10px; align-items:baseline; font-size:12px; }
.ble-adv-k { color:var(--text-d); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto; width:118px; }
.ble-adv-v { color:var(--text); font-family:var(--font-mono); overflow-wrap:anywhere; word-break:normal; flex:1; min-width:0; }
.ble-adv-empty { color:var(--text-d); font-size:12px; }
.ble-log-sec { flex:1; min-height:0; display:flex; flex-direction:column; }
.ble-log-title { display:flex; align-items:baseline; }
.ble-log-clear { margin-left:auto; font-size:11px; font-weight:400; color:var(--text-d); cursor:pointer; letter-spacing:0; text-transform:none; }
.ble-log-clear:hover { color:var(--accent-focus); }
.ble-log { flex:1; min-height:0; overflow-y:auto; font-family:var(--font-mono); font-size:12px; line-height:1.7; color:var(--text); background:var(--editor-bg); border:1px solid var(--border); border-radius:6px; padding:10px; white-space:pre-wrap; word-break:break-all; }
.ble-log-dim { color:var(--text-d); }
.ble-empty.scanning b { color:var(--accent-focus); }
.ble-mode-seg { display:flex; border-bottom:1px solid var(--border); background:var(--toolbar-bg); flex-shrink:0; }
.ble-mode-btn { flex:1; border:0; background:transparent; color:var(--text-d); font-size:12px; padding:8px 6px; cursor:pointer; font-family:inherit; }
.ble-mode-btn + .ble-mode-btn { border-left:1px solid var(--border); }
.ble-mode-btn:hover { color:var(--text-b); background:var(--input-bg); }
.ble-mode-btn.active { background:var(--accent-focus); color:#fff; }
.ble-mode-btn.active:hover { background:var(--accent-focus); color:#fff; }
.ble-pf-left .ble-mode-seg { position:sticky; top:0; z-index:3; }
.ble-periph { flex:1; display:none; min-height:0; }
.ble-periph.active { display:flex; }
.ble-pf-left { overflow-y:auto; }
.ble-pf-right { flex:1; min-width:0; display:flex; flex-direction:column; padding:12px 16px; gap:8px; overflow:hidden; }
.ble-pf-sec { padding:12px 14px; border-bottom:1px solid var(--border); }
.ble-pf-label { font-size:11px; font-weight:600; color:var(--text-d); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.ble-pf-label .ble-pf-badge { margin-left:auto; }
.ble-pf-input, .ble-pf-select { width:100%; box-sizing:border-box; height:28px; padding:0 8px; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text); font-size:12px; font-family:var(--font-mono); outline:none; }
.ble-pf-select { font-family:inherit; cursor:pointer; }
.ble-pf-input:focus, .ble-pf-select:focus { border-color:var(--accent-focus); }
.ble-pf-hint { font-size:10px; color:var(--text-d); margin-top:5px; line-height:1.5; }
.ble-pf-warnline { font-size:10px; color:var(--accent-orange); margin-top:5px; line-height:1.5; }
.ble-pf-warnline:empty { display:none; }
.ble-pf-row { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.ble-pf-check { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text-b); cursor:pointer; user-select:none; }
.ble-pf-char { border:1px solid var(--border); border-radius:6px; background:var(--input-bg); padding:8px; margin-bottom:8px; }
.ble-pf-char-head { display:flex; align-items:center; gap:8px; }
.ble-pf-char-head .ble-pf-input { flex:1; min-width:0; }
.ble-pf-del { flex-shrink:0; border:0; background:transparent; color:var(--text-d); cursor:pointer; font-size:14px; line-height:1; padding:3px 5px; border-radius:4px; font-family:inherit; }
.ble-pf-del:hover { color:var(--accent-red); background:rgba(196,92,92,.12); }
.ble-pf-props { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.ble-pf-prop { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--border); background:var(--editor-bg); color:var(--text-d); cursor:pointer; user-select:none; }
.ble-pf-prop:hover { color:var(--text-b); }
.ble-pf-prop.on { background:var(--accent-focus); border-color:var(--accent-focus); color:#fff; }
.ble-pf-value { margin-top:7px; }
.ble-pf-btn { border-radius:5px; font-size:13px; padding:7px 16px; cursor:pointer; background:var(--input-bg); color:var(--text-b); border:1px solid var(--border); font-family:inherit; }
.ble-pf-btn:hover { border-color:var(--border-h); }
.ble-pf-btn.primary { background:var(--accent-focus); color:#fff; border-color:transparent; }
.ble-pf-btn.danger { background:var(--accent-red); color:#fff; border-color:transparent; }
.ble-pf-btn:disabled { opacity:.5; cursor:not-allowed; }
.ble-pf-badge { font-size:11px; font-family:var(--font-mono); padding:2px 8px; border-radius:10px; border:1px solid var(--border); color:var(--text-d); white-space:nowrap; }
.ble-pf-badge.on { color:var(--accent-green); border-color:var(--accent-green); }
.ble-pf-badge.off { color:var(--accent-red); border-color:var(--accent-red); }
.ble-pf-warn { font-size:11px; color:var(--accent-red); background:rgba(196,92,92,.12); border:1px solid var(--accent-red); border-radius:6px; padding:6px 9px; margin-top:9px; line-height:1.55; }
.ble-pf-chars { display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:44%; flex-shrink:0; }
.ble-pf-empty { color:var(--text-d); font-size:12px; padding:4px 0; }
.ble-pf-add { width:100%; margin-top:2px; }
.ble-pf-pending { display:flex; align-items:center; gap:8px; margin-top:8px; padding:6px 9px;
                  border:1px solid var(--accent-orange); border-radius:6px; background:rgba(214,140,66,.10); flex-shrink:0; }
.ble-pf-pending-txt { flex:1; min-width:0; font-size:11px; font-family:var(--font-mono); color:var(--text-b);
                      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ble-pf-pending .ble-pf-btn { padding:4px 10px; font-size:12px; }
.ble-pf-sub { color:var(--text-d); font-size:11px; font-family:var(--font-mono); font-weight:400; }
.ble-modal-mask { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.45);
                  display:none; align-items:center; justify-content:center; }
.ble-modal-mask.show { display:flex; }
.ble-modal { position:relative; display:flex; flex-direction:column;
             width:490px; min-width:320px; min-height:180px; max-width:calc(100vw - 40px); max-height:calc(100vh - 40px);
             background:var(--editor-bg);
             border:1px solid var(--border); border-radius:10px; overflow:hidden;
             box-shadow:0 12px 32px rgba(0,0,0,.45);
             /* 整个弹窗可拖动调整大小（原生能力；需 overflow 非 visible，上面已满足）。
                拖过的尺寸会作为内联样式留在元素上，同一次运行内再次打开仍保持。 */
             resize:both; }
.ble-modal-grip { position:absolute; right:2px; bottom:2px; font-size:11px; line-height:1;
                  color:var(--text-d); opacity:.6; pointer-events:none; user-select:none; }
.ble-modal-head { display:flex; align-items:center; gap:10px; padding:11px 14px;
                  background:var(--toolbar-bg); border-bottom:1px solid var(--border); }
.ble-modal-title { font-size:13px; font-weight:600; color:var(--text); flex-shrink:0; }
.ble-modal-body { padding:14px; flex:1; min-height:0; display:flex; }
.ble-modal-row { display:flex; align-items:stretch; gap:8px; flex:1; min-height:0; }
.ble-pair-modal { width:380px; min-width:320px; resize:none; }
.ble-pair-dev { font-family:var(--font-mono); font-size:12px; color:var(--text-d); margin-bottom:8px; }
.ble-pair-text { font-size:13px; color:var(--text); line-height:1.6; }
.ble-pair-pin { font-family:var(--font-mono); font-size:22px; letter-spacing:3px; color:var(--accent-focus);
                text-align:center; margin:10px 0 4px; }
.ble-pair-input { display:block; width:100%; margin-top:8px; box-sizing:border-box; }
.ble-pair-hint { font-size:11px; color:var(--text-d); margin-top:8px; }
.ble-modal-row .ble-write-opts { align-self:flex-start; }
.ble-write-opts { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
.ble-write-row { display:flex; align-items:center; gap:6px; }
.ble-write-label { font-size:11px; color:var(--text-d); flex-shrink:0; width:22px; text-align:right; }
.ble-write-opts .send-as,
.ble-write-opts .sel { width:68px; box-sizing:border-box; justify-content:space-between;
                       height:24px; padding:0 6px 0 8px;
                       background:var(--input-bg); border-radius:4px; color:var(--text); }

function bleRssiColor(rssi, isActive) {
    if (isActive) return '#fff';
    return rssi >= -55 ? 'var(--accent-green)' : (rssi >= -75 ? 'var(--accent-orange)' : 'var(--accent-red)');
}

function renderBleDeviceList() {
    var list = document.getElementById('ble-devList');
    if (!list) return;
    list.innerHTML = '';
    var shown = _bleDevices.slice();
    if (_bleFilterText) {
        shown = shown.filter(function(d) {
            var n = (d.name || '').toLowerCase();
            var a = (d.address || '').toLowerCase();
            return n.indexOf(_bleFilterText) >= 0 || a.indexOf(_bleFilterText) >= 0;
        });
    }
    // 按信号强度 RSSI 从强到弱排序（越大越强，如 -31 > -78）
    shown.sort(function(a, b) { return (b.rssi || -999) - (a.rssi || -999); });
    var countEl = document.getElementById('ble-filterCount');
    if (countEl) countEl.textContent = _bleFilterText ? ('匹配 ' + shown.length + '/' + _bleDevices.length) : '';
    if (!_bleDevices.length) {
        // 扫描中与未扫描要分开提示，否则"开始扫描后一片'未发现设备'"会让人以为扫描没生效
        // 适配器数量也写出来：多适配器时这是"为什么能搜到更多设备"的答案
        var adapterNote = _bleAdapterCount > 1 ? ('<br><span>' + _bleAdapterCount + ' 个蓝牙适配器同时在扫</span>') : '';
        list.innerHTML = _bleScanning
            ? '<div class="ble-empty scanning"><b>正在扫描…</b><br><span>正在搜索周边 BLE 设备（' + bleScanSecsLabel() + '后自动停止）</span>' + adapterNote + '</div>'
            : '<div class="ble-empty"><b>未发现蓝牙设备</b><br><span>点击「开始扫描」搜索周边 BLE 设备；设备不广播时可用上方「按 MAC 直连」</span></div>';
        return;
    }
    if (!shown.length) {
        list.innerHTML = '<div class="ble-empty">无匹配设备</div>';
        return;
    }
    shown.forEach(function(dev) {
        var isActive = (dev.address === _bleSelected);
        var card = document.createElement('div');
        card.className = 'ble-dev-card' + (isActive ? ' active' : '') + (dev.connected ? ' connected' : '');
        card.setAttribute('data-addr', dev.address);   // 供 RSSI 定点刷新定位卡片
        // RSSI 颜色与信号条强度（选中态用白色，避免蓝底上彩色不友好）
        // 已连接但不再广播的设备没有 RSSI（null）：显示「—」，不能显示成 null dBm / 满格信号条
        var hasRssi = (typeof dev.rssi === 'number');
        var rssiColor = hasRssi ? bleRssiColor(dev.rssi, isActive) : 'var(--text-d)';
        var pct = hasRssi ? Math.max(0, Math.min(100, Math.round((dev.rssi + 100) / 90 * 100))) : 0;
        // 设备类型图标 + 名称后缀提示（由后端依据广播特征判定：apple / ibeacon / pc / mesh / ble）
        var dtKey = BLE_DEV_ICONS[dev.deviceType] ? dev.deviceType : 'ble';
        var dtIcon = BLE_DEV_ICONS[dtKey];
        var dtMeta = BLE_DEV_TYPE_META[dtKey];
        var dtTitle = dtMeta.title;
        // 灰色后缀：仅 iBeacon / Mesh 这类「需要显式点明」的类型带 tag
        var dtTag = dtMeta.tag ? '<span class="ble-dev-tag">(' + dtMeta.tag + ')</span>' : '';
        // 已连接提示：用文字而非改图标颜色，避免与设备类型混淆
        var connTag = dev.connected ? '<span class="ble-dev-conn" title="BLE 已连接">已连接</span>' : '';
        card.innerHTML =
            '<span class="ble-dev-icon" title="' + dtTitle + '">' + dtIcon + '</span>' +
            '<div class="ble-dev-main">' +
                '<div class="ble-dev-name">' +
                    '<span class="ble-dev-text">' + escapeHtml(dev.name || '未知设备') + '</span>' + dtTag + connTag +
                '</div>' +
                '<div class="ble-dev-sub">' + dev.address + '</div>' +
            '</div>' +
            '<div class="ble-dev-rssi-bar"><span style="width:' + pct + '%;background:' + rssiColor + '"></span></div>' +
            '<div class="ble-dev-rssi" style="color:' + rssiColor + '">' + (hasRssi ? dev.rssi + ' dBm' : '—') + '</div>';
        card.addEventListener('click', function() {
            // 切换设备即清空日志与写入窗口：它们只属于「当前设备本次会话」
            if (dev.address !== _bleSelected) { clearBleLog(); closeBleWriteModal(); }
            _bleSelected = dev.address;
            scheduleConfigSave();   // 选中的设备地址随用户配置保留
            renderBleDeviceList();
            renderBleDetail();
        });
        list.appendChild(card);
    });
}

function shortUuid(u) {
    if (!u) return '';
    var s = String(u).toUpperCase();
    var m16 = /^0000([0-9A-F]{4})-0000-1000-8000-00805F9B34FB$/.exec(s);
    if (m16) return m16[1];
    var m32 = /^([0-9A-F]{8})-0000-1000-8000-00805F9B34FB$/.exec(s);
    if (m32) return m32[1];
    return s;
}

function advRow(k, v) {
    return '<span class="ble-adv-k" title="' + escapeHtml(k) + '">' + escapeHtml(k) + '</span>' +
           '<span class="ble-adv-v">' + escapeHtml(v) + '</span>';
}

function hexToLe(hexStr) {
    var parts = hexStr.trim().split(/\s+/).filter(function(b){ return b !== ''; });
    var bytes = parts.map(function(b){ return parseInt(b, 16); });
    if (!bytes.length || bytes.some(function(b){ return isNaN(b); })) return '0x' + parts.join('');
    var v = 0, mul = 1;
    for (var i = 0; i < bytes.length; i++) { v += bytes[i] * mul; mul *= 256; }
    return '0x' + v.toString(16).toUpperCase().padStart(bytes.length * 2, '0');
}

function bleDataVal(hexStr) {
    var bytes = hexStr.trim().split(/\s+/);
    if (bytes.length <= 4) return hexToLe(hexStr);
    return '0x' + bytes.join('');
}

function parseBleAdv(hexStr) {
    var bytes = hexStr.trim().split(/\s+/);
    var segs = [];
    var i = 0;
    while (i < bytes.length) {
        var len = parseInt(bytes[i], 16);
        if (isNaN(len) || len <= 0 || i + 1 + len > bytes.length) break;
        var type = parseInt(bytes[i + 1], 16);
        segs.push({ label: advTypeLabel(type), hex: bytes.slice(i, i + 1 + len).join(' ') });
        i += 1 + len;
    }
    return segs;
}

function advTypeLabel(t) {
    switch (t) {
        case 0x01: return 'Flags';
        case 0x02: return '服务UUID(16bit·不完整)';
        case 0x03: return '服务UUID(16bit)';
        case 0x04: return '服务UUID(32bit·不完整)';
        case 0x05: return '服务UUID(32bit)';
        case 0x06: return '服务UUID(128bit·不完整)';
        case 0x07: return '服务UUID(128bit)';
        case 0x08: return '广播名(简)';
        case 0x09: return '广播名';
        case 0x0A: return '发射功率';
        case 0x0D: return '设备类别';
        case 0x0E: return '配对Hash C-192';
        case 0x0F: return '配对Randomizer R-192';
        case 0x10: return 'Device ID';
        case 0x11: return 'SM TK Value';
        case 0x12: return 'SM OOB Flags';
        case 0x14: return '服务请求UUID(16bit)';
        case 0x15: return '服务请求UUID(32bit)';
        case 0x16: return '服务数据(16bit)';
        case 0x17: return 'Public Target Address';
        case 0x18: return 'Random Target Address';
        case 0x19: return '外观';
        case 0x1A: return '广播间隔';
        case 0x1B: return 'LE 设备地址';
        case 0x1C: return 'LE Role';
        case 0x1D: return '配对Hash C-256';
        case 0x1E: return '配对Randomizer R-256';
        case 0x1F: return '服务请求UUID(128bit)';
        case 0x20: return '服务数据(32bit)';
        case 0x21: return '服务数据(128bit)';
        case 0x22: return 'LE SC Confirmation';
        case 0x23: return 'LE SC Random';
        case 0x24: return 'URI';
        case 0x25: return '室内定位';
        case 0x26: return '传输发现数据';
        case 0x27: return 'LE 支持特性';
        case 0x28: return '信道图更新';
        case 0x29: return 'PB-ADV';
        case 0x2A: return 'Mesh Message';
        case 0x2B: return 'Mesh Beacon';
        case 0x2C: return 'BIGInfo';
        case 0x2D: return 'Broadcast_Code';
        case 0x2E: return 'Resolvable Set ID';
        case 0x2F: return '广播间隔(16bit UUID)';
        case 0x30: return '广播间隔(32bit UUID)';
        case 0x31: return '广播间隔(128bit UUID)';
        case 0x32: return '广播名(加密)';
        case 0x33: return '加密广播数据';
        case 0x34: return 'PA 响应时序';
        case 0x3D: return '3D 信息';
        case 0xFF: return '厂商数据';
        default: return '0x' + ('0' + t.toString(16)).slice(-2).toUpperCase();
    }
}

function renderBleAdv(dev) {
    if (!dev.adv) return '<div class="ble-adv-empty">' + (dev.connected ? '已连接：设备已停止广播，无广播数据' : '无广播数据') + '</div>';
    var a = dev.adv;
    var html = '';
    if (a.raw) {
        var segHtml = parseBleAdv(a.raw).map(function(s) {
            return '<span class="ble-adv-seg"><em class="ble-adv-seg-label">' + s.label + '</em><span class="ble-adv-seg-hex">' + s.hex.replace(/ /g,'') + '</span></span>';
        }).join('<span class="ble-adv-sep">|</span>');
        if (segHtml) html += '<div class="ble-adv-raw">' + segHtml + '</div>';
    }
    var brief = [];
    if (a.adName) brief.push(advRow('广播名', a.adName));
    if (a.svcs && a.svcs.length) brief.push(advRow('广播服务', a.svcs.map(function(s){ return '0x' + shortUuid(s); }).join(' | ')));
    if (a.appearance != null) brief.push(advRow('外观', '0x' + a.appearance.toString(16).toUpperCase()));
    if (a.txPower != null) brief.push(advRow('发射功率', a.txPower + ' dBm'));
    if (a.manufacturerData && a.manufacturerData.length)
        brief.push(a.manufacturerData.map(function(m){ return advRow('厂商数据(0x' + m.id.toString(16).toUpperCase() + ')', bleDataVal(m.hex)); }).join(''));
    if (a.serviceData && a.serviceData.length)
        brief.push(a.serviceData.map(function(s){ return advRow('服务数据(0x' + shortUuid(s.uuid) + ')', bleDataVal(s.hex)); }).join(''));
    if (brief.length) html += '<div class="ble-adv-brief">' + brief.join('') + '</div>';
    return html;
}
