<!-- at-suite：一个节点 = 一串线性指令。画布负责触发与分流，这里负责录入与判定。 -->
<script type="text/html" data-template-name="at-suite">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
    <input type="text" id="node-input-name" placeholder="指令集名（冒烟 / 出厂 / 回归）">
  </div>
  <div class="form-row">
    <label for="node-input-port"><i class="fa fa-plug"></i> 串口</label>
    <input type="text" id="node-input-port" placeholder="COM5">
    <input type="text" id="node-input-baud" style="width:90px" placeholder="115200">
    <select id="node-input-eol" style="width:130px">
      <option value="crlf">CRLF</option>
      <option value="cr">CR</option>
      <option value="lf">LF</option>
      <option value="none">不加行尾</option>
    </select>
  </div>
  <div class="form-row" style="margin-top:10px">
    <label style="width:auto">指令表</label>
  </div>
  <div class="form-row" style="display:block">
    <table id="at-steps" style="width:100%;font-size:12px;border-collapse:collapse">
      <thead>
        <tr style="text-align:left;color:#888">
          <th style="width:28px">☑</th>
          <th style="width:110px">名称</th>
          <th>指令</th>
          <th>期望</th>
          <th style="width:96px">匹配</th>
          <th style="width:78px">超时ms</th>
          <th style="width:78px">失败</th>
          <th style="width:54px">重试</th>
          <th style="width:26px"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="at-add" class="red-ui-button red-ui-button-small" style="margin-top:6px">+ 新增一条</button>
  </div>
  <div class="form-row" style="margin-top:8px">
    <label for="node-input-verbose">逐条输出</label>
    <input type="checkbox" id="node-input-verbose" style="display:inline-block;width:auto;vertical-align:top">
    <span style="color:#888;font-size:12px">勾选时每跑完一条就发一次，进度条/操作员面板靠它</span>
  </div>
</script>

<script type="text/html" data-help-name="at-suite">
  <p>按顺序发指令，每条等到期望的回话再发下一条；等不到就按「失败」策略处理。</p>
  <h3>指令表</h3>
  <ul>
    <li><b>☑</b> 取消勾选的条目不执行</li>
    <li><b>期望</b> 留空 = 只等「超时」那么久，不判定</li>
    <li><b>匹配</b> 包含（忽略大小写）/ 正则 / 不出现</li>
    <li><b>失败</b> 中止（默认）/ 重试 / 继续</li>
  </ul>
  <h3>输出</h3>
  <p>输出 1：汇总（<code>pass</code>/<code>results</code>）；勾选「逐条输出」时先逐条发、最后一条是汇总。</p>
  <p>输出 2：失败明细。</p>
  <p>另附 <code>msg.report</code>（HTML 表），可直接喂 ui_template 或写文件。</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("at-suite", {
    category: "AT 测试",
    color: "#3F6E5A",
    defaults: {
      name: { value: "" },
      port: { value: "COM5" },
      baud: { value: "115200" },
      eol: { value: "crlf" },
      verbose: { value: true },
      steps: { value: [] }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["逐条/汇总", "失败明细"],
    icon: "font-awesome/fa-list-ol",
    label: function () {
      return this.name || "AT 指令集";
    },

    oneditprepare: function () {
      var node = this;
      var tbody = $("#at-steps tbody");
      var seed = (node.steps && node.steps.length) ? node.steps : [];

      function cell(inner) { return $("<td>").append(inner); }

      function addRow(s) {
        s = s || { on: true, name: "", cmd: "", expect: "OK", mode: "contains", timeout: 3000, fail: "abort", retry: 3 };
        var tr = $("<tr>");

        var cb = $('<input type="checkbox">').prop("checked", s.on !== false).attr("data-k", "on");
        tr.append(cell(cb));

        var name = $('<input type="text" style="width:100%">').val(s.name || "").attr("data-k", "name");
        tr.append(cell(name));

        var cmd = $('<input type="text" style="width:100%;font-family:monospace">').val(s.cmd || "").attr("data-k", "cmd");
        tr.append(cell(cmd));

        var exp = $('<input type="text" style="width:100%;font-family:monospace">').val(s.expect == null ? "" : s.expect).attr("data-k", "expect");
        tr.append(cell(exp));

        var mode = $('<select style="width:100%" data-k="mode">')
          .append('<option value="contains">包含</option>')
          .append('<option value="regex">正则</option>')
          .append('<option value="absent">不出现</option>')
          .val(s.mode || "contains");
        tr.append(cell(mode));

        var tmo = $('<input type="number" min="50" step="100" style="width:100%">').val(s.timeout || 3000).attr("data-k", "timeout");
        tr.append(cell(tmo));

        var fail = $('<select style="width:100%" data-k="fail">')
          .append('<option value="abort">中止</option>')
          .append('<option value="retry">重试</option>')
          .append('<option value="continue">继续</option>')
          .val(s.fail || "abort");
        tr.append(cell(fail));

        var retry = $('<input type="number" min="1" step="1" style="width:100%">').val(s.retry || 3).attr("data-k", "retry");
        tr.append(cell(retry));

        var del = $('<button class="red-ui-button red-ui-button-small" title="删除">×</button>')
          .on("click", function (e) { e.preventDefault(); tr.remove(); });
        tr.append(cell(del));

        tbody.append(tr);
      }

      seed.forEach(addRow);
      if (!seed.length) addRow();

      $("#at-add").on("click", function (e) { e.preventDefault(); addRow(); });
    },

    oneditsave: function () {
      var steps = [];
      $("#at-steps tbody tr").each(function () {
        var $tr = $(this);
        var cmd = $tr.find('[data-k="cmd"]').val();
        var expect = $tr.find('[data-k="expect"]').val();
        if (!cmd && !expect) return;              // 整行空的丢掉
        steps.push({
          on: $tr.find('[data-k="on"]').prop("checked"),
          name: $tr.find('[data-k="name"]').val() || "",
          cmd: cmd || "",
          expect: expect || "",
          mode: $tr.find('[data-k="mode"]').val() || "contains",
          timeout: parseInt($tr.find('[data-k="timeout"]').val(), 10) || 3000,
          fail: $tr.find('[data-k="fail"]').val() || "abort",
          retry: parseInt($tr.find('[data-k="retry"]').val(), 10) || 3
        });
      });
      this.steps = steps;
    }
  });
</script>
