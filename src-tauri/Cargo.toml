[package]
name = "seahi-serial"
version = "0.4.1"
description = "Seahi 串口调试器"
authors = ["Seahi"]
edition = "2021"

[[bin]]
name = "seahi-serial"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
sentry = ["dep:sentry"]

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "3.3"
winapi = { version = "0.3", features = ["setupapi", "guiddef"] }
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Dwm"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
crossbeam-channel = "0.5"
portable-pty = "0.8"
regex = "1"
sentry = { version = "0.34", optional = true }
chrono = "0.4"
btleplug = "0.13"
# 只用到 tokio::time::timeout（给 BLE connect 加显式超时）。
# 版本与 tauri 内部一致，不会多编译一份。
tokio = { version = "1", features = ["time"] }
# BLE 配对与 BLE 从机（GATT Server）走 WinRT（btleplug 是 central-only，都不提供）。
# 版本与 features 对齐 vendor/btleplug，避免再编译一份 windows crate。
# GenericAttributeProfile = 从机的 GattServiceProvider/GattLocalCharacteristic；
# Storage_Streams = 特征值的 IBuffer 与 DataReader/DataWriter 互转；
# Radios = 从机启动前探测"蓝牙是不是开着 / 支不支持外设角色"（BluetoothAdapter + Radio）。
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
# windows 0.62 起 WinRT 异步类型（IAsyncOperation）在独立 crate 里
windows-future = "0.3"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[patch.crates-io]
btleplug = { path = "vendor/btleplug" }
