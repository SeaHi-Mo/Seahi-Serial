[package]
name = "seahi-serial"
version = "0.4.0"
description = "Seahi 串口调试器"
authors = ["Seahi"]
edition = "2021"

[[bin]]
name = "seahi-serial"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
sentry = ["dep:sentry"]

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "3.3"
winapi = { version = "0.3", features = ["setupapi", "guiddef"] }
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Dwm"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
crossbeam-channel = "0.5"
portable-pty = "0.8"
regex = "1"
sentry = { version = "0.34", optional = true }
chrono = "0.4"
btleplug = "0.13"
# BLE 配对走 WinRT（btleplug 不提供配对接口）。版本与 features 对齐 vendor/btleplug，
# 避免再编译一份 windows crate。仅用到枚举/配对相关命名空间。
windows = { version = "0.62", features = ["Devices_Enumeration", "Devices_Bluetooth", "Foundation", "Foundation_Collections"] }
# windows 0.62 起 WinRT 异步类型（IAsyncOperation）在独立 crate 里
windows-future = "0.3"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[patch.crates-io]
btleplug = { path = "vendor/btleplug" }
