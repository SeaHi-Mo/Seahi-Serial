[package]
name = "seahi-serial"
version = "0.5.10"
description = "Seahi 串口调试器"
authors = ["Seahi"]
edition = "2021"

[[bin]]
name = "seahi-serial"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
sentry = ["dep:sentry"]

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "3.3"
winapi = { version = "0.3", features = ["setupapi", "guiddef"] }
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Globalization"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
crossbeam-channel = "0.5"
portable-pty = "0.8"
regex = "1"
sentry = { version = "0.34", optional = true }
chrono = "0.4"
btleplug = "0.13"
# 原来只用到 tokio::time::timeout（给 BLE connect 加显式超时）；
# MCP 的 SSE 服务器需要 net（监听/连接）、io-util（读写）、sync（mpsc/oneshot）、rt（spawn）。
# 版本与 tauri 内部一致，不会多编译一份。刻意不开 macros（避免再拉 tokio-macros）。
tokio = { version = "1", features = ["time", "rt", "net", "sync", "io-util"] }
# BLE 配对走 WinRT（btleplug 是 central-only，不提供系统配对框）。
# 版本与 features 对齐 vendor/btleplug，避免再编译一份 windows crate。
# ⚠️ 原从机方向（GATT Server）已于 2026-09 删除，随之去掉三个只它用到的 feature
# （GenericAttributeProfile / Storage_Streams / Radios）与 `windows-future` 依赖 ——
# 别再加回来：那套代码已经不在了（要重开这个方向先解决"广播起不来"，见 doc/BLE_PERIPHERAL.md）。
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Devices_Bluetooth",
    "Foundation",
    "Foundation_Collections",
] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

# ===== MCP 服务器（SSE）=====
# 原计划用 axum（见 doc/MCP_DESIGN.md §3.3），但本机 cargo 无法联网下载新 crate，
# 而 axum 不在本地缓存中；hyper 一族早已由 reqwest 带入依赖树且已在缓存里，
# 所以改用 hyper 直接实现：路由与 SSE 分帧自己写，chunked/keep-alive/请求解析交给 hyper。
# 版本刻意不写死到 patch，交给 Cargo.lock 里已有的版本（不会引入第二份）。
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[patch.crates-io]
btleplug = { path = "vendor/btleplug" }
