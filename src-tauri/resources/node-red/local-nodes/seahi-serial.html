<!-- seahi-serial：宿主串口 ↔ Node-RED 的两个节点（serial in / serial out） -->

<script type="text/html" data-template-name="serial out">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
    <input type="text" id="node-input-name" placeholder="发送">
  </div>
  <div class="form-row">
    <label for="node-input-monitor"><i class="fa fa-plug"></i> 监视器</label>
    <input type="text" id="node-input-monitor" placeholder="main">
  </div>
  <div class="form-row">
    <label for="node-input-eol">行尾</label>
    <select id="node-input-eol">
      <option value="crlf">CRLF</option>
      <option value="cr">CR</option>
      <option value="lf">LF</option>
      <option value="none">不加</option>
    </select>
    <label for="node-input-asHex" style="width:auto;margin-left:8px">HEX</label>
    <input type="checkbox" id="node-input-asHex" style="display:inline-block;width:auto;vertical-align:top">
  </div>
</script>

<script type="text/html" data-help-name="serial out">
  <p>把 <code>msg.payload</code> 写进宿主程序里**已经打开**的那个串口。</p>
  <p>⚠️ 它不自己开串口：COM 口由宿主独占（监视器、DTR/RTS、WSL 映射都在用）。
     这里填的「监视器」是宿主里那个分栏的 id，默认 <code>main</code> 就是第一个分栏。</p>
  <h3>参数</h3>
  <ul>
    <li><b>行尾</b>：文本模式下追加在内容后面。设备不认行尾就永远不回话，这是最常见的坑。</li>
    <li><b>HEX</b>：勾上表示 payload 本身就是十六进制串（<code>4154</code>），会按字节解析后发送。</li>
  </ul>
  <h3>输出</h3>
  <p>成功后原样往下游传，另附 <code>msg.sent</code> = 实际写入的字节数。失败会走 catch。</p>
</script>

<script type="text/html" data-template-name="serial in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
    <input type="text" id="node-input-name" placeholder="接收">
  </div>
  <div class="form-row">
    <label for="node-input-monitor"><i class="fa fa-plug"></i> 监视器</label>
    <input type="text" id="node-input-monitor" placeholder="main">
  </div>
  <div class="form-row">
    <label for="node-input-pollMs">轮询 ms</label>
    <input type="number" id="node-input-pollMs" min="20" step="20" style="width:90px" placeholder="100">
  </div>
</script>

<script type="text/html" data-help-name="serial in">
  <p>把宿主那个串口**收到的数据**变成消息：<code>msg.payload</code> 是 Buffer（与 Node-RED 的串口节点一致）。</p>
  <p>数据来自宿主程序的读线程 —— 它与监视器各读各的，不会互相抢。</p>
  <h3>怎么用</h3>
  <ul>
    <li>要按内容分支：后面接 <code>switch</code>，条件写 <code>msg.payload</code> 的字符串形式（或先接 <code>function</code> 转成字符串）</li>
    <li>要按行处理：接 <code>function</code> 做行缓冲，或直接在 <code>switch</code> 里用正则</li>
    <li>轮询间隔越小延迟越低，但空闲时的开销也越大；默认 100ms 对 AT 指令足够</li>
  </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('serial out', {
        category: '串口',
        color: '#b8c8b8',
        defaults: {
            name: { value: '' },
            monitor: { value: 'main' },
            eol: { value: 'crlf' },
            asHex: { value: false }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-arrow-right',
        label: function () { return this.name || 'serial out'; }
    });

    RED.nodes.registerType('serial in', {
        category: '串口',
        color: '#b8c8b8',
        defaults: {
            name: { value: '' },
            monitor: { value: 'main' },
            pollMs: { value: 100 }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-arrow-left',
        label: function () { return this.name || 'serial in'; }
    });
</script>
