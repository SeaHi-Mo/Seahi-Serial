<script type="text/html" data-help-name="serial txd">
  <p>把 <code>msg.payload</code> 写进宿主程序里**已经打开**的那个串口。</p>
  <p>⚠️ 它不自己开串口：COM 口由宿主独占（监视器、DTR/RTS、WSL 映射都在用）。
     「端口」下拉列出宿主里当前**已经打开**的串口（每项就是 <code>COM17 · 115200</code> 这样的实际端口；
     <code>extra-N</code> 是额外分栏）；端口有增减时点「刷新」重新读取。
     已保存但当前没打开的分栏会标「当前未打开」，配置不会被悄悄改掉。</p>
  <h3>参数</h3>
  <ul>
    <li><b>格式</b>：
      <ul>
        <li><code>文本</code>（默认）：payload 按 UTF-8 编码，并在末尾追加「行尾」。</li>
        <li><code>HEX</code>：payload 本身是十六进制串（<code>4154</code>，空格会被忽略），按字节发送，
             <b>不追加行尾</b>。</li>
      </ul>
    </li>
    <li><b>行尾</b>：只在文本模式下生效。设备不认行尾就永远不回话，这是最常见的坑。</li>
  </ul>
  <h3>输出</h3>
  <p>成功后原样往下游传，另附 <code>msg.sent</code> = 实际写入的字节数。失败会走 catch。</p>
</script>

<script type="text/html" data-help-name="serial rxd">
  <p>把宿主那个串口**收到的数据**变成消息。数据来自宿主程序的读线程 ——
     它与监视器各读各的，不会互相抢。</p>
  <p>「端口」下拉列出宿主里当前**已经打开**的串口（显示为 <code>COM17 · 115200</code>）；插拔端口后点「刷新」重新读取。</p>
  <h3>参数</h3>
  <ul>
    <li><b>格式</b>：
      <ul>
        <li><code>文本</code>（默认）：<code>msg.payload</code> 是按 UTF-8 解码的字符串。
            跨数据块被切断的半个汉字会留到下一块再拼，不会变成乱码。</li>
        <li><code>HEX</code>：<code>msg.payload</code> 是小写十六进制串（<code>4f4b0d0a</code>），无分隔符。</li>
        <li><code>Buffer</code>：<code>msg.payload</code> 是原始字节（与 Node-RED 官方串口节点一致），
            适合二进制协议。</li>
      </ul>
    </li>
    <li><b>轮询 ms</b>：宿主侧按这个间隔取一次数据，默认 100；越小延迟越低，空闲开销越大。</li>
  </ul>
  <p>无论选哪种格式，消息上都有 <code>msg.raw</code> = 本次的原始 Buffer，
     需要按字节核对（CRC、二进制头）时直接用它。</p>
  <h3>怎么用</h3>
  <ul>
    <li>文本模式下要按行处理：接 <code>function</code> 做行缓冲，或直接在 <code>switch</code> 里用正则。</li>
    <li>HEX 模式适合把原始帧转给别的协议解析节点，也可以直接喂回 <code>serial txd</code> 的 HEX 模式。</li>
    <li><b>同一个监视器只放一个 <code>serial rxd</code></b>：宿主的接收队列取走即清，两个节点会互相分走数据。</li>
  </ul>
</script>

<script type="text/html" data-help-name="cmd list">
  <p>发送「快捷指令」面板里选中的那一条。内容不写死在节点里：运行期按 key 去宿主那份列表里现查，
     所以在面板里改了指令，流程不用重新拖节点也跟着变。</p>
  <h3>参数</h3>
  <ul>
    <li><b>端口</b>：从宿主当前**已经打开**的串口里选（显示为 <code>COM17 · 115200</code>）。</li>
    <li><b>指令</b>：宿主「快捷指令」列表里的条目，按组分组显示。列表为空时这里会提示。</li>
    <li><b>行尾</b>：文本模式下追加；该条指令若标了 HEX，则按字节发送、不加行尾。</li>
  </ul>
  <h3>输出</h3>
  <p>成功后原样往下游传，另附 <code>msg.sent</code>（字节数）、<code>msg.command</code>（实际发送的文本）；
     若这条指令已经不在列表里，会按保存时的文本发送并置 <code>msg.stale=true</code>。</p>
</script>

<script type="text/html" data-help-name="serial request">
  <p>发一条命令，然后收一段窗口，最后输出一条结果。顺序固定为
     <b>清空旧数据 → 写串口 → 收窗口</b>，所以这次收到的回复一定属于这次发出去的命令。</p>
  <p>⚠️ 它不自己开串口（与 serial rxd / serial txd 一样走宿主桥）。「端口」下拉列出当前已打开的串口，新节点默认选中第一个已打开的端口。</p>
  <h3>输入</h3>
  <p><code>msg.payload</code> 是要发的命令。文本模式下会追加「行尾」；HEX 模式下按十六进制解析，不追加行尾。</p>
  <h3>结果分支（一个条件一个连接点）</h3>
  <p>与 switch 同样的用法：列表里每个条件对应一个输出口，按从上到下的顺序匹配，**命中哪个就从哪个口出去**。
     默认两条：<code>OK</code> 与 <code>ERROR</code>（都是「包含」）。点「添加条件」会增加一行，同时增加一个连接点。</p>
  <ul>
    <li><b>包含</b> / <b>等于</b> / <b>正则</b>：按已收到的整段文本匹配；「等于」会先 <code>trim()</code>。</li>
    <li><b>未匹配/超时</b>：兜底条件，只有前面所有文本条件都没命中时才走它；不需要填内容。</li>
  </ul>
  <p>⚠️ 没有配置兜底条件时，未匹配/超时的结果会被丢弃（节点状态标黄并 <code>node.warn</code> 说明），
     不会静默假装成功。</p>
  <h3>收口条件（谁先满足谁结束）</h3>
  <ul>
    <li>命中任一结果分支 → 立即收口</li>
    <li>收到过字节后，连续「静默 ms」没有新数据 → 收口（走兜底口）</li>
    <li>从发出命令起超过「最长 ms」 → 强制收口（走兜底口，<code>timedOut=true</code>）</li>
  </ul>
  <h3>输出</h3>
  <ul>
    <li><code>msg.payload</code>：收到的内容（按「回复」格式转成文本 / HEX / Buffer）</li>
    <li><code>msg.raw</code>：原始 Buffer；<code>msg.cmd</code>：这次发的命令；<code>msg.bytes</code>：收到多少字节</li>
    <li><code>msg.matched</code>：命中的条件内容；<code>msg.matchedIndex</code>：第几个条件（0 起）；
        <code>msg.matchedType</code>：条件类型（<code>cont</code> / <code>eq</code> / <code>regex</code>）</li>
    <li><code>msg.timedOut</code>：到最长 ms 还没命中；<code>msg.reason</code>：<code>rule</code> / <code>timeout</code> / <code>quiet</code></li>
  </ul>
  <p>⚠️ 同一个监视器上**不要再放 serial rxd**：桥的接收队列是单消费者，两边会互相分走数据。
     需要持续监控时，用 serial rxd 的流程，不要和本节点共用分栏。</p>
  <p>⚠️ 设备回显（ATE1）会把命令原样回显，可能提前命中标记 —— 建议 <code>ATE0</code>，
     或把标记写成只在回复里出现的特征（如 <code>^OK$</code> 配合多行模式不合适，优先用设备侧关回显）。</p>
</script>

<script type="text/javascript">
    /* 「端口」下拉：列出宿主里**当前真的打开着**的串口。
       用户 2026-11 的要求：界面上看到的是 COM17 这种**端口**，不是 main/extra-1 这种监视器 id ——
       监视器是宿主内部的实现细节，摆给用户只会让人问"我该选哪个"。
       ⚠️ 但 option 的 **value 仍然是监视器 id**：桥是按 id 取数据/写数据的（端口名会变、id 不会）。
       Node-RED 编辑器和宿主不是同一个 origin、拿不到桥令牌，所以由侧车代问一次：
       /seahi-serial/monitors（见 seahi-serial.js 的 registerAdminRoutes）。 */
    var seahiMonitorText = {};   // id -> 显示文本（标签与状态都用它，别再露出 id）


    /* 编辑器加载时就把 id → 端口名 缓存起来，**不用等用户打开某个节点对话框**：
       节点卡片上的标签要立刻显示 COM17，而不是 main/分栏 1（用户 2026-11 的要求）。
       取到之后重绘一次画布，让已存在的节点标签跟着更新。 */
    function seahiPrimeMonitors() {
        $.getJSON('seahi-serial/monitors').done(function (list) {
            (list || []).forEach(function (m) {
                if (m && m.id) seahiMonitorText[m.id] = seahiMonitorLabel(m);
            });
            try { if (typeof RED !== 'undefined' && RED.view && RED.view.redraw) RED.view.redraw(true); } catch (e) { /* 编辑器还没就绪就算了 */ }
        });
    }
    // 延后一拍：编辑器初始化时 RED 的 base URL 才就绪，过早请求会 404
    setTimeout(seahiPrimeMonitors, 0);
    function seahiMonitorLabel(m) {
        var info = [];
        if (m.port) info.push(m.port);
        if (m.baud) info.push(m.baud + ' bps');
        if (info.length) return info.join(' · ');          // COM17 · 115200
        return m.id === 'main' ? '主分栏（端口未打开）' : '分栏 ' + m.id + '（端口未打开）';
    }

    function seahiMonitorTextOf(id) {
        return seahiMonitorText[id] || (id === 'main' ? '主分栏' : id);
    }

    /* saved 为空 = 新节点：默认选中**第一个已打开的端口**（用户 2026-11 要求） */
    function seahiFillMonitorSelect($select, saved) {
        var current = saved || '';
        $select.empty().append($('<option>').val(current).text('读取中…'));
        $select.val(current);
        $.getJSON('seahi-serial/monitors')
            .done(function (list) {
                list = list || [];
                var opts = [];
                var found = false;
                seahiMonitorText = {};
                list.forEach(function (m) {
                    if (!m || !m.id) return;
                    seahiMonitorText[m.id] = seahiMonitorLabel(m);
                    if (m.id === current) found = true;
                    opts.push($('<option>').val(m.id).text(seahiMonitorLabel(m)));
                });
                if (!current && list.length) {
                    // 新节点：默认第一个已打开的端口
                    current = list[0].id;
                    found = true;
                } else if (!found) {
                    /* 已保存的那个分栏现在没打开：保留它并说明，别让一次打开对话框就把配置改成别的口 */
                    if (list.length) {
                        opts.unshift($('<option>').val(current).text(seahiMonitorTextOf(current) + '（该端口当前未打开）'));
                    } else {
                        // 一个串口都没开：当**提示**处理，不是"一个叫这个名字的选项"。
                        // 文案不带括号、整条置灰（见 seahiSyncSelectTone）——用户 2026-11 要求。
                        // value 仍然保留原来的分栏 id：这样用户不动这一项就保存，配置不会被清成空。
                        opts.unshift($('<option>').val(current || '').text('当前没有已打开的串口').attr('data-empty', '1'));
                    }
                }
                $select.empty().append(opts).val(current);
                seahiSyncSelectTone($select);
            })
            .fail(function () {
                /* 侧车还是旧版 / 桥断了：保留原值，并提示可以刷新，而不是给一个空下拉 */
                $select.empty()
                    .append($('<option>').val(current).text(current ? seahiMonitorTextOf(current) + '（读取失败，保留原值）' : '读取失败，保留原值'))
                    .val(current);
                seahiSyncSelectTone($select);
            });
    }

    /* 「没有可用端口 / 读取失败」这类占位项是**提示**，不是选项：
       文字不带括号、整条置灰（用户 2026-11 的要求）。<select> 的选项没法单独上色，
       所以置灰落在 select 自身的颜色上；选了真实端口就把颜色还原。 */
    function seahiSyncSelectTone($select) {
        if (!$select || !$select.length) return;
        var $opt = $select.find('option:selected');
        // 判据是"选中的是不是占位项"，不是"值空不空"：占位项的 value 可能仍是保存下来的分栏 id
        var isEmpty = $opt.attr('data-empty') === '1' || !$select.val();
        $select.css('color', isEmpty ? 'var(--red-ui-secondary-text-color-muted, #9aa0a6)' : '');
        $select.find('option[data-empty="1"]').css('color', 'var(--red-ui-secondary-color-focus, #9aa0a6)');
    }

    /* 「指令」下拉：宿主「快捷指令」列表的快照（/seahi-serial/quickcmds），按组分 optgroup。
       ⚠️ value 存的是 key（宿主生成的稳定标识），不是指令文本 —— 文本改了以后节点要能跟着变。 */
    function seahiFillCmdSelect($select, savedKey, savedText) {
        $select.empty().append($('<option>').val('').text('读取中…'));
        $.getJSON('seahi-serial/quickcmds')
            .done(function (list) {
                list = list || [];
                if (!list.length) {
                    $select.empty().append(
                        $('<option>').val('').text('快捷指令列表是空的').attr('data-empty', '1'));
                    return;
                }
                const groups = [];
                const byName = {};
                list.forEach(function (c) {
                    const g = c.group || '默认';
                    if (!byName[g]) { byName[g] = []; groups.push(g); }
                    byName[g].push(c);
                });
                groups.forEach(function (g) {
                    const $og = $('<optgroup>').attr('label', g);
                    byName[g].forEach(function (c) {
                        $og.append($('<option>').val(c.key).text(c.value));
                    });
                    $select.append($og);
                });
                /* 已保存的 key 不在列表里（这条被删了）→ 退回按文本找；再找不到就选第一条，
                   但要保留原文本给运行期兜底（见 oneditsave 与节点的 stale 分支）。 */
                let val = '';
                if (savedKey && list.some(function (c) { return c.key === savedKey; })) {
                    val = savedKey;
                } else if (savedText) {
                    const hit = list.filter(function (c) { return c.value === savedText; })[0];
                    if (hit) val = hit.key;
                }
                if (!val) val = list[0].key;
                $select.val(val);
            })
            .fail(function () {
                $select.empty().append(
                    $('<option>').val(savedKey || '').text('读取失败，保留原值').attr('data-empty', '1'));
            });
    }

    function seahiBindCmdSelect(savedKey, savedText) {
        const $select = $('#node-input-cmdKey');
        seahiFillCmdSelect($select, savedKey, savedText);
        $('#node-input-cmd-refresh').off('click.seahi').on('click.seahi', function (e) {
            e.preventDefault();
            seahiFillCmdSelect($select, $select.val(), savedText);
        });
    }
    function seahiBindMonitorSelect(saved) {
        var $select = $('#node-input-monitor');
        seahiFillMonitorSelect($select, saved);
        $select.off('change.seahi').on('change.seahi', function () { seahiSyncSelectTone($select); });
        $('#node-input-monitor-refresh').off('click.seahi').on('click.seahi', function (e) {
            e.preventDefault();
            seahiFillMonitorSelect($select, $select.val());
        });
    }

    /* ===== serial request 的结果分支编辑器（一个条件一个输出口，像 switch 那样） ===== */
    var SEAHI_RULE_TYPES = [
        ['cont', '包含'],
        ['eq', '等于'],
        ['regex', '正则'],
        ['timeout', '未匹配/超时']
    ];

    function seahiRuleTypeLabel(t) {
        for (var i = 0; i < SEAHI_RULE_TYPES.length; i++) {
            if (SEAHI_RULE_TYPES[i][0] === t) return SEAHI_RULE_TYPES[i][1];
        }
        return '包含';
    }

    function seahiRuleRow(rule) {
        var t = rule && rule.t ? rule.t : 'cont';
        var $li = $('<li>').css({ display: 'flex', gap: '6px', alignItems: 'center', marginBottom: '4px' });
        var $type = $('<select>').css({ width: '112px' });
        SEAHI_RULE_TYPES.forEach(function (opt) {
            $type.append($('<option>').val(opt[0]).text(opt[1]));
        });
        $type.val(t);
        var $val = $('<input type="text">').css({ flex: '1', minWidth: '80px' })
            .attr('placeholder', '要匹配的内容').val((rule && rule.v) || '');
        function syncDisabled() {
            if ($type.val() === 'timeout') $val.prop('disabled', true).attr('placeholder', '（不需要内容）');
            else $val.prop('disabled', false).attr('placeholder', '要匹配的内容');
        }
        $type.on('change', syncDisabled);
        syncDisabled();
        var $up = $('<button type="button" class="red-ui-button red-ui-button-small">↑</button>');
        var $down = $('<button type="button" class="red-ui-button red-ui-button-small">↓</button>');
        var $del = $('<button type="button" class="red-ui-button red-ui-button-small">✕</button>');
        $up.on('click', function (e) {
            e.preventDefault();
            var $prev = $li.prev();
            if ($prev.length) { $li.insertBefore($prev); seahiSyncRuleOutputs(); }
        });
        $down.on('click', function (e) {
            e.preventDefault();
            var $next = $li.next();
            if ($next.length) { $li.insertAfter($next); seahiSyncRuleOutputs(); }
        });
        $del.on('click', function (e) {
            e.preventDefault();
            if ($('#node-input-rules').children().length <= 1) return;  // 至少留一条
            $li.remove();
            seahiSyncRuleOutputs();
        });
        $li.append($type).append($val).append($up).append($down).append($del);
        $li.data('seahi-rule', true);
        return $li;
    }

    /* 规则条数 = 输出口数：隐藏的 node-input-outputs 用**数字**形式（Node-RED 两种都认） */
    function seahiSyncRuleOutputs() {
        var n = $('#node-input-rules').children().length;
        $('#node-input-outputs').val(n);
    }

    function seahiRenderRules(rules) {
        var $ol = $('#node-input-rules');
        $ol.empty();
        (rules && rules.length ? rules : [{ t: 'cont', v: 'OK' }, { t: 'cont', v: 'ERROR' }]).forEach(function (r) {
            $ol.append(seahiRuleRow(r));
        });
        seahiSyncRuleOutputs();
    }

    function seahiReadRules() {
        var rules = [];
        $('#node-input-rules').children().each(function () {
            var $li = $(this);
            var t = $li.find('select').val();
            var v = $li.find('input[type=text]').val();
            rules.push({ t: t, v: t === 'timeout' ? '' : String(v == null ? '' : v) });
        });
        return rules.length ? rules : [{ t: 'cont', v: 'OK' }];
    }

    RED.nodes.registerType('serial txd', {
        category: '串口',
        color: '#b8c8b8',
        defaults: {
            name: { value: '' },
            monitor: { value: '' },   // 空 = 未选：对话框打开时默认选中第一个已打开的端口（用户 2026-11）
            eol: { value: 'crlf' },
            /* '' = 老流程没这个字段：构造函数按 asHex 回退，编辑器打开时再补成 text/hex */
            format: { value: '' },
            asHex: { value: false }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-arrow-right',
        label: function () { return this.name || 'serial txd'; },
        oneditprepare: function () {
            seahiBindMonitorSelect(this.monitor);
            $('#node-input-format').val(this.format || (this.asHex === true ? 'hex' : 'text'));
        }
    });

    RED.nodes.registerType('serial rxd', {
        category: '串口',
        color: '#b8c8b8',
        defaults: {
            name: { value: '' },
            monitor: { value: '' },   // 空 = 未选：对话框打开时默认选中第一个已打开的端口（用户 2026-11）
            format: { value: '' },
            pollMs: { value: 100 }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-arrow-left',
        label: function () { return this.name || 'serial rxd'; },
        oneditprepare: function () {
            seahiBindMonitorSelect(this.monitor);
            $('#node-input-format').val(this.format || 'text');
        }
    });

    RED.nodes.registerType('serial request', {
        category: '串口',
        color: '#c8b8b8',
        defaults: {
            name: { value: '' },
            monitor: { value: '' },   // 空 = 未选：对话框打开时默认选中第一个已打开的端口（用户 2026-11）
            sendFormat: { value: 'text' },
            eol: { value: 'crlf' },
            recvFormat: { value: 'text' },
            timeoutMs: { value: 1000 },
            quietMs: { value: 80 },
            rules: { value: [{ t: 'cont', v: 'OK' }, { t: 'cont', v: 'ERROR' }] },
            outputs: { value: 2 }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function (index) {
            var r = this.rules && this.rules[index];
            if (!r) return '';
            if (r.t === 'timeout') return '未匹配/超时';
            return seahiRuleTypeLabel(r.t) + ' ' + r.v;
        },
        icon: 'font-awesome/fa-exchange',
        label: function () { return this.name || 'serial request'; },
        oneditprepare: function () {
            seahiBindMonitorSelect(this.monitor);
            seahiRenderRules(this.rules);
            $('#node-input-add-rule').off('click.seahi').on('click.seahi', function (e) {
                e.preventDefault();
                $('#node-input-rules').append(seahiRuleRow({ t: 'cont', v: '' }));
                seahiSyncRuleOutputs();
            });
        },
        oneditsave: function () {
            this.rules = seahiReadRules();
            this.outputs = this.rules.length;
            $('#node-input-outputs').val(this.rules.length);
        }
    });

    RED.nodes.registerType('cmd list', {
        category: '串口',
        color: '#c8c0a8',
        defaults: {
            name: { value: '' },
            monitor: { value: '' },
            cmdKey: { value: '' },
            cmdText: { value: '' },
            eol: { value: 'crlf' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-list-ul',
        label: function () { return this.name || 'cmd list'; },
        oneditprepare: function () {
            seahiBindMonitorSelect(this.monitor);
            seahiBindCmdSelect(this.cmdKey, this.cmdText);
            $('#node-input-eol').val(this.eol || 'crlf');
        },
        oneditsave: function () {
            // 文本一起存下来：列表里这条以后被删了，还能按旧内容发送（状态条会标 stale）
            this.cmdText = $('#node-input-cmdKey option:selected').text() || '';
        }
    });</script>
