/* ===== ADB 设备与会话（对接 Rust adb_devices/adb_shell） ===== */
var _adbSessions = 0;
var _adbDevTimer = null; // ADB 面板打开期间的设备列表自动刷新定时器（ADB/USB 设备不在 COM 口通知范围内，需轮询）
// 根据 adb 设备状态返回状态点颜色
function adbDotColor(state) {
    var st = (state || '').toLowerCase();
    if (st === 'device') return 'var(--accent-green)';
    if (st === 'offline') return 'var(--accent-orange)';
    if (st === 'unauthorized') return 'var(--accent-red)';
    if (st === 'no' || st === 'no-permissions' || st === 'no_permissions') return 'var(--accent-red)';
    if (st === 'recovery' || st === 'sideload' || st === 'bootloader' || st === 'connecting' || st === 'authorizing') return 'var(--accent-orange)';
    if (st === 'error' || st === 'failed' || st === 'unknown') return 'var(--accent-red)';
    return 'var(--accent-orange)';
}

function refreshAdbDevices() {
    console.log('[ADB] 刷新设备列表');
    var list = document.getElementById('adb-deviceList');
    if (!list) return;
    invoke('adb_devices').then(function(devices) {
        // 回填 TAB 补全用的设备序列号：此前 _adbSerials 恒为空，
        // 导致 `adb -s <TAB>` 没有任何候选（钩子早就留好了，只是没人填）
        _adbSerials = pickAdbSerials(devices);
        if (!Array.isArray(devices) || devices.length === 0) {
            list.innerHTML = '<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-d);">未检测到 ADB 设备</span>';
            return;
        }
        // 有设备：移除占位/空状态等非卡片残留，避免与设备卡并存（上次从空到有设备时不刷新出提示）
        for (var n = list.children.length - 1; n >= 0; n--) {
            if (!list.children[n].classList || !list.children[n].classList.contains('adb-dev-card')) list.removeChild(list.children[n]);
        }
        var activeSerial = getActiveAdbSerial(); // 高亮与当前会话关联
        // 建立 serial -> 已有卡片映射，做增量更新
        var existing = {};
        var curCards = list.querySelectorAll('.adb-dev-card');
        for (var i = 0; i < curCards.length; i++) existing[curCards[i].getAttribute('data-serial')] = curCards[i];
        var seen = {};
        devices.forEach(function(d) {
            var dotColor = adbDotColor(d.state);
            var label = d.model ? d.model : d.serial;
            var card = existing[d.serial];
            if (!card) {
                card = document.createElement('div');
                card.className = 'adb-dev-card';
                card.setAttribute('data-serial', d.serial);
                card.style.cssText = 'display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-1);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:var(--font-mono);font-size:12px;color:var(--text);';
                card.innerHTML = '<span class="adb-dot" style="width:8px;height:8px;border-radius:50%;flex-shrink:0;"></span><span class="adb-name"></span>';
                (function(serial){ card.addEventListener('click', function(){
                    var cards = list.querySelectorAll('.adb-dev-card');
                    for (var k=0;k<cards.length;k++) cards[k].classList.remove('active');
                    card.classList.add('active');
                    openAdbSession(serial);
                });})(d.serial);
                list.appendChild(card);
            }
            card.querySelector('.adb-dot').style.background = dotColor;
            card.querySelector('.adb-name').textContent = label;
            if (d.serial === activeSerial) card.classList.add('active'); else card.classList.remove('active');
            seen[d.serial] = true;
        });
        // 移除已不在列表中的设备卡
        Object.keys(existing).forEach(function(serial) {
            var c = existing[serial];
            if (!seen[serial] && c && c.parentNode) c.parentNode.removeChild(c);
        });
    }).catch(function(e) {
        console.warn('[ADB] 获取设备列表失败:', e);
        list.innerHTML = '<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-d);">未检测到 ADB 设备（请检查 adb 是否已安装）</span>';
    });

}
// 让后端 PTY 尺寸与前端 xterm 实际容器尺寸保持一致。
// 修复：后端以往固定 40x120，前端容器尺寸不同且从未同步，
// 导致 busybox 按 40x120 的光标寻址/多列布局在前端渲染错位（乱码/重复/空白）。
function syncAdbTermSize(el) {
    if (!el) return;
    var term = el._adbTerm;
    if (!term) return;
    var box = term.element && term.element.parentElement;
    if (!box) return;
    // 面板隐藏（display:none）时容器尺寸为 0，此时跳过：
    // 否则会把终端/PTY 缩成 2x2，压碎缓冲区与 shell 布局（导致 "回到界面状态被清空/只剩提示符碎片"）。
    if (box.offsetParent === null) return;
    var boxW = box.clientWidth, boxH = box.clientHeight;
    if (!boxW || !boxH) return;
    var cw = 0, ch = 0;
    try {
        var d = term._core && term._core._renderService && term._core._renderService.dimensions;
        if (d && d.css && d.css.cell && d.css.cell.width > 0) {
            cw = d.css.cell.width; ch = d.css.cell.height;
        }
    } catch (_) {}
    if (cw <= 0 || ch <= 0) {
        try {
            var probe = document.createElement('span');
            probe.textContent = '0'.repeat(200);
            probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;font-family:' +
                getComputedStyle(box).fontFamily + ';font-size:' + getComputedStyle(box).fontSize + ';';
            box.appendChild(probe);
            cw = probe.offsetWidth / 200;
            ch = parseFloat(getComputedStyle(box).lineHeight) || 16;
            probe.remove();
        } catch (_) { return; }
    }
    var cols = Math.max(2, Math.floor(boxW / cw));
    var rows = Math.max(2, Math.floor(boxH / ch));
    if (cols !== term.cols || rows !== term.rows) {
        term.resize(cols, rows);
    }
    console.log('[ADB] term size cols=' + cols + ' rows=' + rows + ' (实际 ' + term.cols + 'x' + term.rows + ')');
    if (el._adbPtyId) {
        invoke('adb_shell_resize', { sessionId: el._adbPtyId, cols: cols, rows: rows }).catch(function(e) {
            console.warn('[ADB] resize PTY 失败:', e);
        });
    }
}

// 当前正在显示的 ADB 会话元素（多会话：所有会话常驻，仅一个显示）
// 当前打开的 ADB 会话对应的设备序列号（单会话模型，最多一个）
function getActiveAdbSerial() {
    var area = document.getElementById('adb-sessionArea');
    if (!area) return null;
    var el = area.querySelector('[id^="adb-session-"]');
    return el ? (el._adbSerial || null) : null;
}

function openAdbSession(serial) {
    console.log('[ADB] 打开调试会话:', serial);
    var area = document.getElementById('adb-sessionArea');
    if (!area) return;
    // 已在打开/已连接的同一设备，忽略重复点击（避免重复连接）
    var cur = area.querySelector('[id^="adb-session-"]');
    if (cur && cur._adbSerial === serial) { if (cur._adbTerm) cur._adbTerm.focus(); return; }
    // 单会话切换：关闭并移除已有会话窗口
    var exist = area.querySelectorAll('[id^="adb-session-"]');
    for (var x = 0; x < exist.length; x++) closeAdbSession(exist[x].id);
    _adbSessions++;
    var sid = 'adb-session-' + _adbSessions;
    var el = document.createElement('div');
    el.id = sid;
    el.style.cssText = 'margin:0;flex:1;min-height:0;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;background:var(--surface-1);overflow:hidden;';
    el.innerHTML = '<div id="' + sid + '-termBox" style="flex:1;min-height:0;background:var(--editor-bg);"></div>';
    // 清空占位提示并设置纵向 flex 布局
    area.style.display = 'flex';
    area.style.flexDirection = 'column';
    area.style.padding = '0';
    var ph = area.querySelector('.no-scrollbar');
    if (ph && ph.parentNode === area && ph.children.length === 0) area.removeChild(ph);
    area.appendChild(el);
    // 会话状态
    el._adbSerial = serial;
    el._adbPtyId = null;
    el._adbReadTimer = null;
    el._adbTerm = null;
    // 创建 xterm 终端
    if (typeof Terminal === 'undefined') {
        el.innerHTML = '<div style="color:var(--accent-red);padding:12px;font-family:var(--font-mono);font-size:12px;">xterm.js 未加载</div>';
        return;
    }
    var term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: '"Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace',
        theme: { background: '#1c1e22', foreground: '#dce0e8', cursor: '#dce0e8' },
        scrollback: 1000,
    });
    term.open(el.querySelector('#' + sid + '-termBox'));
    term.writeln('');  // 留空行
    el._adbTerm = term;
    syncAdbTermSize(el);
    term.onResize(function() { syncAdbTermSize(el); });
    var tBox = el.querySelector('#' + sid + '-termBox');
    if (window.ResizeObserver) {
        el._adbResizeObserver = new ResizeObserver(function() { syncAdbTermSize(el); });
        el._adbResizeObserver.observe(tBox);
    }
    term.onData(function(data) {
        if (el._adbPtyId) {
            invoke('adb_shell_write', { sessionId: el._adbPtyId, data: data }).catch(function(err) {
                console.warn('[ADB] 写PTY失败:', err);
            });
        }
        if (el._adbTerm) el._adbTerm.scrollToBottom();
    });
    // 建立 PTY shell 会话
    invoke('adb_open_shell', { serial: serial }).then(function(pid) {
        // 若会话在打开期间已被关闭（如快速切换设备），立即回收刚建立的 PTY，避免孤儿连接
        if (el._adbClosed) { invoke('adb_shell_close', { sessionId: pid }).catch(function() {}); if (el._adbTerm) { try { el._adbTerm.dispose(); } catch(_) {} } return; }
        console.log('[ADB] PTY会话建立 pid=', pid);
        el._adbPtyId = pid;
        el._adbInited = true;
        // 会话建立后立刻把当前容器尺寸推给后端 PTY，并启动高频轮询
        syncAdbTermSize(el);
        setAdbPollRate(el, 120);
        term.focus();
    }).catch(function(e) {
        console.error('[ADB] 打开PTY会话失败:', e);
        term.writeln('\x1b[31m连接设备失败: ' + e + '\x1b[0m');
    });
}

// 设置某个 ADB 会话的轮询频率（ms）。用 setInterval 复用 _adbReadTimer。
function setAdbPollRate(el, ms) {
    if (!el) return;
    if (el._adbReadTimer) { clearInterval(el._adbReadTimer); el._adbReadTimer = null; }
    el._adbReadTimer = setInterval(function() { adbPtyPoll(el); }, ms);
}

// 根据面板显隐统一调整所有 ADB 会话的轮询频率：可见 120ms，隐藏降频到 2000ms，
// 避免离开 ADB 界面后仍以 8 次/秒空轮询后端 adb_shell_read（浪费 IPC/CPU）。
function setAllAdbPollRate(ms) {
    var area = document.getElementById('adb-sessionArea');
    if (!area) return;
    var els = area.querySelectorAll('[id^="adb-session-"]');
    for (var i = 0; i < els.length; i++) setAdbPollRate(els[i], ms);
}

// 读取 PTY 输出并写入 xterm（xterm 原生解析 ANSI/光标/多列）
function adbPtyPoll(el) {
    if (!el._adbPtyId) return;
    var term = el._adbTerm;
    if (!term) return;
    invoke('adb_shell_read', { sessionId: el._adbPtyId }).then(function(bytes) {
        if (bytes && bytes.length) {
            term.write(new Uint8Array(bytes));
            term.scrollToBottom();
        }
    }).catch(function() {});
}

function closeAdbSession(sid) {
    var el = document.getElementById(sid);
    if (el) {
        el._adbClosed = true; // 标记已关闭：若 adb_open_shell 尚未 resolve，回调里据此回收 PTY
        if (el._adbReadTimer) { clearInterval(el._adbReadTimer); el._adbReadTimer = null; }
        if (el._adbResizeObserver) { try { el._adbResizeObserver.disconnect(); } catch(_) {} el._adbResizeObserver = null; }
        if (el._adbTerm) { try { el._adbTerm.dispose(); } catch(_) {} }
        if (el._adbPtyId) {
            invoke('adb_shell_close', { sessionId: el._adbPtyId }).catch(function() {});
        }
        if (el.parentNode) el.parentNode.removeChild(el);
    }
}

// WSL 发行版启动/关闭，操作后延迟刷新 UI
function wslDistAction(cmd, dist) {
    // 找到被点击的按钮，显示加载动画
    var btn = window.event && window.event.target;
    if (btn && btn.tagName === 'BUTTON') {
        btn.disabled = true;
        btn._origText = btn.textContent;
        btn.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:wsl-spin .6s linear infinite;vertical-align:middle;"></span>';
    }
    invoke(cmd, {dist: dist}).then(function() {
        // 操作完成后延迟刷新，等待 WSL 状态稳定
        setTimeout(function() {
            document.querySelectorAll('[id$="-wslDistroList"]').forEach(function(el) {
                var mid = el.id.replace('-wslDistroList', '');
                var fn = el.closest('.monitor-pane');
                if (fn) {
                    invokeTimeout('get_wsl_distributions', null, 6000).then(function(distros) {
                        renderWslDistroCards(mid, distros);
                    }).catch(function(e) { console.warn('[WSL] 获取发行版失败:', e); });
                    invoke('check_wsl_status').then(function(dists) {
                        _wslRunning = dists && dists.length > 0;
                        setWslMonitorEnabled(_wslRunning);
                        renderWslDeviceList(mid);
                    }).catch(function(e) { console.warn('[WSL] 检查 WSL 状态失败:', e); });
                }
            });
        }, 1500);
    }).catch(function(e) {
        console.error('[WSL] 操作失败:', cmd, dist, e);
        if (btn) {
            btn.disabled = false;
            btn.textContent = btn._origText || dist;
        }
    });
}

// WSL设备数据
var _wslDevices = [];
var _wslBusy = {}; // { busid: true } 正在操作中的设备
var _wslRefreshing = false; // 单飞：避免取消映射后多路重扫并发挤压（E9）
var _wslSelectedBusid = null; // 选中的设备行
var _wslAutoMap = {}; // { vidpid: portName } 开启自动映射的设备（按 VID:PID 匹配，而非 busid）
var _wslAutoFailCount = {}; // { vidpid: n } 自动映射连续失败次数（>=3 暂停重试）
var _wslAutoMapTimer = null;
var _wslAutoMapRunning = false; // autoMapCheck 重入保护：定时器与设备变更事件可能并发触发
var _wslSavedConfig = null; // 缓存从配置文件加载的 WSL 监视器配置，防止主监视器保存时丢失
var _wslStatusUnlisten = null; // WSL 状态事件监听取消函数
var _wslRunning = false; // WSL 是否正在运行
var _wslUptimeTimer = null;
var _wslDevListTimer = null; // WSL 面板打开期间的设备列表轮询
var _wslDistroBasetime = {};

function wslFormatUptime(totalSeconds) {
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = Math.floor(totalSeconds % 60);
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function startWslUptimeTicker(mid) {
    if (_wslUptimeTimer) { clearInterval(_wslUptimeTimer); _wslUptimeTimer = null; }
    if (Object.keys(_wslDistroBasetime).length === 0) return;
    _wslUptimeTimer = setInterval(function() {
        var now = Date.now();
        Object.keys(_wslDistroBasetime).forEach(function(name) {
            var bt = _wslDistroBasetime[name];
            if (!bt) return;
            var elapsed = Math.floor((now - bt.anchorMs) / 1000);
            var total = bt.baseSeconds + elapsed;
            var el = document.getElementById('uptime-' + mid + '-' + name);
            if (el) el.textContent = wslFormatUptime(total);
        });
    }, 1000);
}

function stopWslUptimeTicker() {
    if (_wslUptimeTimer) { clearInterval(_wslUptimeTimer); _wslUptimeTimer = null; }
    _wslDistroBasetime = {};
}

function sortWslDevices() {
    _wslDevices.sort(function(a, b) {
        return (a.busid || '').localeCompare(b.busid || '', undefined, { numeric: true, sensitivity: 'base' });
    });
}

// 带超时的 invoke：后端命令挂起（如 UAC 弹窗未确认）时前端不会永久等待
function invokeTimeout(cmd, args, ms) {
    ms = ms || 8000;
    var timer = null;
    return Promise.race([
        invoke(cmd, args),
        new Promise(function(_, reject) {
            timer = setTimeout(function() { reject(new Error(cmd + ' 执行超时')); }, ms);
        })
    ]).finally(function() {
        // 竞态结束（无论胜负）都清除超时定时器，避免高频调用堆积悬空 timer
        if (timer) clearTimeout(timer);
    });
}

async function loadWslDevices(mid) {
    console.log('[WSL] 加载设备列表');
    var container = document.getElementById(mid + '-wslDeviceList');
    if (!container) {
        console.error('[WSL] 未找到设备列表容器');
        return;
    }
    // 单飞：取消映射后多路重扫会同时触发，避免并发挤压 + 全量 DOM 重建（E9）
    if (_wslRefreshing) return;
    _wslRefreshing = true;
    
    try {
        var devices = await invokeTimeout('list_wsl_devices', null, 15000);
        
        // 保留正在操作中的设备（防止取消映射后设备消失）
        var newBusids = {};
        devices.forEach(function(d) { newBusids[d.busid] = true; });
        _wslDevices.forEach(function(d) {
            if (_wslBusy[d.busid] && !newBusids[d.busid]) {
                devices.push(d);
            }
        });
        
        _wslDevices = devices;
        sortWslDevices();
        
        console.log('[WSL] 设备列表:', _wslDevices);
        renderWslDeviceList(mid);
    } catch (e) {
        console.error('[WSL] 加载设备列表失败:', e);
        // 错误文本可能含 usbipd/WSL 命令输出 → 用 textContent，不要拼进 innerHTML
        container.innerHTML = '<div style="color:var(--accent-red);text-align:center;padding:20px;"></div>';
        container.firstChild.textContent = '加载失败: ' + e;
        reportError(e, 'loadWslDevices');
    } finally {
        _wslRefreshing = false;
    }
}

var _wslNameHeaderMargin = null;
// 测量"设备名称"标题需要右移的量：让 端口↔设备名称 的标题间距 = BUSID↔端口 的标题间距
function wslNameHeaderMargin() {
    if (_wslNameHeaderMargin !== null) return _wslNameHeaderMargin;
    try {
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;display:flex;align-items:center;gap:14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;';
        probe.innerHTML = '<span style="width:64px;flex-shrink:0;text-align:center;">BUSID</span>' +
                          '<span style="min-width:140px;flex-shrink:0;text-align:center;">端口</span>' +
                          '<span>设备名称</span>';
        document.body.appendChild(probe);
        var s = probe.querySelectorAll('span');
        var gapAB = s[1].getBoundingClientRect().left - s[0].getBoundingClientRect().right;
        var gapBC = s[2].getBoundingClientRect().left - s[1].getBoundingClientRect().right;
        probe.remove();
        _wslNameHeaderMargin = Math.max(0, Math.round(gapAB - gapBC));
    } catch (_) {
        _wslNameHeaderMargin = 0;
    }
    return _wslNameHeaderMargin;
}

function renderWslDeviceList(mid) {
    var container = document.getElementById(mid + '-wslDeviceList');
    if (!container) return;

    // "设备名称"标题需要右移的量：使它与"端口"的标题间距 = BUSID↔端口 的标题间距
    var nameMargin = wslNameHeaderMargin();
    
    if (_wslDevices.length === 0) {

        html += '<input type="checkbox" name="wsl-map" class="wsl-checkbox" ' + (isMapped ? 'checked' : '') + ' ' + (mapDisabled ? 'disabled' : '') + ' onchange="toggleWslMapping(\'' + mid + '\', ' + idx + ', this.checked)">';

// 行选中（点击交互控件时不触发）
// 说明：自动映射开关是 <label class="wsl-auto-toggle">（内含滑块 <span>），映射复选框是
// 裸 <input class="wsl-checkbox">。点击这些控件时，事件会冒泡到行级 onclick，
// 若在此处重新 render 整行列表会重建 DOM，干扰 checkbox 的 change 事件，
// 使 toggleAutoMap 不触发/不稳定，导致开关显示状态无法切换、自动映射无法开启。
// 故除 input/button 外，也须匹配 label（覆盖开关 label 及其内滑块 span）。
function selectWslRow(busid, ev) {
    if (ev && ev.target && ev.target.closest('input,button,label')) return;
    _wslSelectedBusid = (_wslSelectedBusid === busid) ? null : busid;
    renderWslDeviceList('main');
}

// 连接状态：绿=空闲 黄=占用/使用中 红=错误
function wslDeviceStatus(device) {
    var mapped = device.status === 'mapped';
    if (mapped && !device.wslPath) return { cls: 'err', tip: '已映射但 WSL 侧未找到设备路径' };
    if (device.port && device.port !== '-' && findPortOwner(device.port, 'wsl')) return { cls: 'busy', tip: 'Windows 端口被其他监视器占用' };
    if (mapped && device.wslPath && wslPathInUse(device.wslPath)) return { cls: 'busy', tip: 'WSL 端口正被监视器使用中' };
    return { cls: 'free', tip: mapped ? '已映射 · 空闲' : '空闲可用' };
}
function wslPathInUse(path) {
    if (!path) return false;
    return Object.keys(monitors).some(function(k) {
        var m = monitors[k];
        return m && m.isWsl && m.isConnected && m.portName === path;
    });
}

// 映射设备若需管理员权限，弹出独立的授权确认窗口（Promise<boolean>）
function showWslMapApproval(device, distro) {
    return new Promise(function(resolve) {
        var old = document.getElementById('wsl-map-approval-overlay');
        if (old) old.remove();
        var overlay = document.createElement('div');
        overlay.id = 'wsl-map-approval-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;';
        // 目标设备：端口号（设备名）。无端口时仅显示设备名或 BUSID。
        var portText = (device.port && device.port !== '-') ? escapeHtml(device.port) : '';
        var nameText = escapeHtml((device.name || '').trim());
        var deviceLabel = portText ? (portText + '（' + nameText + '）') : (nameText || escapeHtml(device.busid || ''));
        overlay.innerHTML =
            '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;width:380px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,0.5);overflow:hidden;">' +
                '<div style="background:var(--toolbar-bg);border-bottom:1px solid var(--border);padding:12px 16px;font-size:14px;font-weight:600;color:var(--text-b);">授权确认</div>' +
                '<div style="padding:16px 20px 6px;font-size:13px;color:var(--text);line-height:1.6;">' +
                    '<div style="margin-bottom:10px;">将设备映射到 WSL 需要<b style="color:var(--accent-orange);font-weight:600;">管理员权限授权</b>。</div>' +
                    '<div style="font-size:15px;font-weight:600;color:var(--text-b);">' + deviceLabel + '</div>' +
                '</div>' +
                '<div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 16px;border-top:1px solid var(--border);">' +
                    '<button id="wsl-map-approval-cancel" style="padding:6px 14px;border-radius:4px;border:1px solid var(--border);background:var(--surface-1);color:var(--text);font-size:12px;cursor:pointer;">取消</button>' +
                    '<button id="wsl-map-approval-ok" style="padding:6px 14px;border-radius:4px;border:1px solid var(--btn-p);background:var(--btn-p);color:#fff;font-size:12px;cursor:pointer;font-weight:600;">授权并映射</button>' +
                '</div>' +
            '</div>';
        document.body.appendChild(overlay);
        var settled = false;
        function settle(val) {
            if (settled) return;
            settled = true;
            clearTimeout(autoTimer);
            if (overlay && overlay.parentNode) overlay.remove();
            resolve(val);
        }
        var autoTimer = setTimeout(function() { settle(false); }, 60000);
        overlay.querySelector('#wsl-map-approval-ok').onclick = function() { settle(true); };
        overlay.querySelector('#wsl-map-approval-cancel').onclick = function() { settle(false); };
        overlay.addEventListener('click', function(ev) { if (ev.target === overlay) settle(false); });
    });
}

async function toggleWslMapping(mid, idx, checked) {
    if (!_wslRunning) return;
    var device = _wslDevices[idx];
    if (!device || _wslBusy[device.busid]) return;
    
    _wslBusy[device.busid] = true;
    renderWslDeviceList(mid);
    
    var attachId = device.hasCom ? device.port : device.busid;
    
    try {
        if (checked) {
            // 两阶段映射：先探测是否需要管理员权限；需要时弹出独立授权窗口，确认后才提权执行
            var res = await invokeTimeout('attach_port_to_wsl', { portName: attachId, distro: _wslTargetDist || null, authorized: false }, 60000);
            if (res && res.needsApproval) {
                var approved = await showWslMapApproval(device, _wslTargetDist || '');
                if (!approved) { return; }
                res = await invokeTimeout('attach_port_to_wsl', { portName: attachId, distro: _wslTargetDist || null, authorized: true }, 60000);
            }
            device.status = 'mapped';
            showToast((res && res.message) || '设备已映射到 WSL', 'success');
        } else {
            // 如果 WSL 监视器正在使用该设备的 WSL 端口，先关闭连接释放资源
            // forEach 不等待 async 回调，需收集 Promise 后统一 await，避免断开与 detach 竞态
            await Promise.all(getWslMonitorIds().map(function(wmid) {
                if (monitors[wmid] && monitors[wmid].isConnected) {
                    var wslPath = device.wslPath || '';
                    var portName = monitors[wmid].portName || '';
                    if (wslPath && portName && (portName === wslPath || portName.indexOf(wslPath) !== -1 || wslPath.indexOf(portName) !== -1)) {
                        appendOutput(wmid, 'sys', '取消映射：正在关闭 WSL 串口连接...');
                        return disconnectWslPort(wmid);
                    }
                }
                return Promise.resolve();
            }));
            await invokeTimeout('detach_port_from_wsl', { busid: device.busid }, 60000);
            device.status = 'unmapped';
        }
    } catch (e) { console.error('[WSL] 映射/断开失败:', e); showToast('操作失败: ' + e, 'error'); reportError(e, 'toggleWslMapping'); }
    finally {
        // 无论成功/失败/取消授权都释放 busy，避免该设备行永久禁用
        delete _wslBusy[device.busid];
        renderWslDeviceList(mid);
    }
    
    // 映射/断开后自动刷新所有 WSL 监视器的端口列表（授权取消的 early return 不会跑到这里）
    setTimeout(function() { getWslMonitorIds().forEach(function(wmid) { refreshWslMonPorts(wmid); }); }, 1000);
    // 后台静默刷新：合并最新数据并解析 WSL 路径（tty 节点出现有延迟，自动重试）
    retryResolveWslPaths(mid, 0);
}

// 拉取最新 WSL 设备列表并合并到当前列表（保留 wslPath），完成后重新渲染
async function refreshWslDeviceListData(mid) {
    // 单飞：与 loadWslDevices 共用锁，避免取消映射后多路重扫并发（E9）
    if (_wslRefreshing) return;
    _wslRefreshing = true;
    try {
        var fresh = await invokeTimeout('list_wsl_devices', null, 15000);
        var freshMap = {};
        fresh.forEach(function(d) { freshMap[d.busid] = d; });
        // 保留现有设备，用 fresh 数据更新状态
        _wslDevices.forEach(function(d) {
            if (freshMap[d.busid]) {
                d.status = freshMap[d.busid].status;
                d.port = freshMap[d.busid].port;
                d.name = freshMap[d.busid].name;
                if (freshMap[d.busid].wslPath) d.wslPath = freshMap[d.busid].wslPath;
            }
        });
        // 添加 fresh 中新出现的设备
        var existBusids = {};
        _wslDevices.forEach(function(d) { existBusids[d.busid] = true; });
        fresh.forEach(function(d) {
            if (!existBusids[d.busid]) _wslDevices.push(d);
        });
        sortWslDevices();
        renderWslDeviceList(mid);
    } catch (e) {
        console.error('[WSL] 刷新设备列表失败:', e);
        reportError(e, 'refreshWslDeviceListData');
    } finally {
        _wslRefreshing = false;
    }
}

// 已映射设备若尚未解析出 WSL 路径，轮询重试（最多 4 次，间隔 1s）
function retryResolveWslPaths(mid, attempt) {
    if (attempt >= 4) return;
    setTimeout(function() {
        refreshWslDeviceListData(mid).then(function() {
            var unresolved = _wslDevices.some(function(d) { return d.status === 'mapped' && !d.wslPath; });
            if (unresolved) retryResolveWslPaths(mid, attempt + 1);
        }).catch(function() {});
    }, 1000);
}

/* ===== 自动映射 ===== */
function toggleAutoMap(vidpid, portName, on) {
    // 允许随时配置自动映射（即使当前未识别到 WSL 运行）；真正的自动映射由 autoMapCheck
    // 依据后端 list_wsl_devices 返回的 wsl_running 来决定是否执行，无需读这里的 _wslRunning。
    if (on) {
        _wslAutoMap[vidpid] = portName;
        delete _wslAutoFailCount[vidpid];
    } else {
        delete _wslAutoMap[vidpid];
        delete _wslAutoFailCount[vidpid];
    }
    scheduleConfigSave();
    updateAutoMapPolling();
    // 刷新当前显示的设备列表（WSL 设备区为共享单实例，固定使用 'main' 前缀）
    renderWslDeviceList('main');
}

function updateAutoMapPolling() {
    var hasAny = Object.keys(_wslAutoMap).length > 0;
    if (hasAny && !_wslAutoMapTimer) {
        // 后台自动映射降频到 15s（原 5s）；快速响应改由 device-changed 事件触发（见事件监听）
        _wslAutoMapTimer = setInterval(autoMapCheck, 15000);
    } else if (!hasAny && _wslAutoMapTimer) {
        clearInterval(_wslAutoMapTimer);
        _wslAutoMapTimer = null;
    }
}

async function autoMapCheck() {
    if (Object.keys(_wslAutoMap).length === 0) return;
    if (_wslAutoMapRunning) return; // 已在执行，避免并发重复映射
    _wslAutoMapRunning = true;
    try {
        var devices = await invokeTimeout('list_wsl_devices', null, 15000);
        // 收集需要映射的设备，并发执行
        var tasks = [];
        for (var i = 0; i < devices.length; i++) {
            var d = devices[i];
            // 连续失败 3 次后暂停该设备（防 UAC 弹窗轰炸），成功或用户重开自动映射时重置
            if (d.vidpid && _wslAutoMap[d.vidpid] && d.status !== 'mapped' && !_wslBusy[d.busid] && !((_wslAutoFailCount[d.vidpid] || 0) >= 3)) {
                _wslBusy[d.busid] = true;
                var autoAttachId = d.hasCom ? d.port : d.busid;
                (function(device, attachId) {
                    tasks.push(
                        invokeTimeout('attach_port_to_wsl', { portName: attachId, distro: _wslTargetDist || null, authorized: true }, 60000)
                            .then(function(result) {
                                device.status = 'mapped';
                                delete _wslAutoFailCount[device.vidpid];
                            })
                            .catch(function(e) {
                                console.error('[WSL] 自动映射失败:', e);
                                _wslAutoFailCount[device.vidpid] = (_wslAutoFailCount[device.vidpid] || 0) + 1;
                                if (_wslAutoFailCount[device.vidpid] === 3) {
                                    showToast('自动映射连续失败 3 次，已暂停该设备 (' + (device.name || device.busid) + ')，请检查 WSL 状态', 'error');
                                }
                            })
                            .finally(function() {
                                delete _wslBusy[device.busid];
                            })
                    );
                })(d, autoAttachId);
            }
        }
        if (tasks.length > 0) {
            await Promise.all(tasks);
        }
        // 如果 WSL 页面打开，刷新列表（WSL 设备区为共享单实例，固定使用 'main' 前缀）
        var listEl = document.getElementById('main-wslDeviceList');
        if (listEl) {
            if (listEl) {
                // 合并状态，保留 _wslBusy 状态
                var freshMap = {};
                devices.forEach(function(d) { freshMap[d.busid] = d; });
                _wslDevices.forEach(function(d) {
                    if (freshMap[d.busid]) {
                        d.status = freshMap[d.busid].status;
                        d.port = freshMap[d.busid].port;
                        d.name = freshMap[d.busid].name;
                    }
                });
                var existBusids = {};
                _wslDevices.forEach(function(d) { existBusids[d.busid] = true; });
                devices.forEach(function(d) {
                    if (!existBusids[d.busid]) _wslDevices.push(d);
                });
                sortWslDevices();
                renderWslDeviceList('main');
            }
        }
        // 自动映射完成后也刷新 WSL 串口端口列表
        if (tasks.length > 0) {
            setTimeout(function() { refreshWslMonPorts(); }, 1500);
        }
    } catch (e) {
        // 静默失败，下次轮询重试；但接入上报以便诊断自动映射为何失效
        console.error('[WSL] 自动映射检查异常:', e);
        reportError(e, 'autoMapCheck');
    } finally {
        _wslAutoMapRunning = false;
    }
}

        if (el && el.id === 'adbToggleBtn') {
            var ap = document.getElementById('adb-pane');
            text = (ap && ap.style.display === 'flex') ? '返回到串口调试器' : 'ADB 调试';
        }
        if (el && el.id === 'bleToggleBtn') {
            var bp = document.getElementById('ble-pane');
            text = (bp && bp.style.display === 'flex') ? '返回到串口调试器' : '蓝牙调试';
        }
        el.setAttribute('data-title', text);
        el.removeAttribute('title');
        tip.textContent = text;
        tip.classList.add('show');
        var r = el.getBoundingClientRect();
        var tw = tip.offsetWidth;
        var left = r.left + r.width / 2 - tw / 2;
        // 水平边界检测：防止 tooltip 超出屏幕
        if (left < 4) left = 4;
        else if (left + tw > window.innerWidth - 4) left = window.innerWidth - tw - 4;
        tip.style.left = left + 'px';
        // 下拉触发器（.sel 等）提示显示在上方，避免遮挡下拉菜单
        if (el.classList.contains('sel') || el.classList.contains('baud-wrap') || el.classList.contains('send-as') || el.classList.contains('qcmd-trigger')) {
            tip.style.top = r.top - tip.offsetHeight - 6 + 'px';
        } else {
            tip.style.top = r.bottom + 6 + 'px';
        }
    });
    document.addEventListener('mouseout', function(e) {
        var el = e.target.closest('[data-title]');
        if (el) { el.title = el.getAttribute('data-title'); el.removeAttribute('data-title'); }
        tip.classList.remove('show');
    });
})();

document.addEventListener('DOMContentLoaded', function() {
    try {
        // 加载应用信息（版本号 + commit hash），设置到 tooltip
        invoke('get_app_info').then(function(info) {
            var wrap = document.getElementById('appInfoWrap');
            if (wrap) wrap.title = 'Seahi Serial v' + info.version + ' (' + info.commit + ')';
        }).catch(function() {});

        // 主面板创建成功后隐藏启动兜底页（createMonitorPane 抛错则进入 catch 显示错误）
        createMonitorPane('main', '主监视器', false);
        var bootBox = document.getElementById('bootError');
        if (bootBox) bootBox.style.display = 'none';

        setInterval(function() { if (!monitors.main || !monitors.main.isConnected) refreshPorts('main'); }, 10000);

        // 加载并恢复用户上次的配置
        loadAndApplyConfig();

        // 延迟检查更新，避免与端口加载竞争网络和 CPU 资源
        setTimeout(checkForUpdate, 2000);
        // 每 10 分钟轮询一次更新，运行中也能发现新版本
        setInterval(checkForUpdate, 10 * 60 * 1000);

        // 监听设备变更事件，自动刷新端口列表（防抖 150ms）
        if (window.__TAURI__ && window.__TAURI__.event) {
            var _deviceChangeTimer = null;
            window.__TAURI__.event.listen('device-changed', function() {
                console.log('[device-changed] event received at', Date.now());
                if (_deviceChangeTimer) clearTimeout(_deviceChangeTimer);
                _deviceChangeTimer = setTimeout(function() {
                    _deviceChangeTimer = null;
                    console.log('[device-changed] refreshing ports at', Date.now());
                    document.querySelectorAll('.monitor-pane').forEach(function(pane) {
                        var mid = pane.id.replace('pane-', '');
                        if (!monitors[mid] || monitors[mid].isConnected) return;
                        // 区分 WSL / Windows 监视器：WSL 监视器刷新 WSL 设备列表，Windows 监视器刷新 COM 列表。
                        // 此前统一用 refreshPorts，会导致授权期间（设备变更事件）把 WSL 监视器端口填成 Windows COM 列表
                        if (monitors[mid].isWsl) {
                            refreshWslMonPorts(mid);
                        } else {
                            refreshPorts(mid, true);
                        }
                    });
                    // WSL 自动映射：拔插事件到来立即检查一次（配合后台 15s 降频轮询，插拔仍能快速响应）
                    if (_wslAutoMapTimer) autoMapCheck();
                    // ADB 面板打开时，设备变更事件也刷新一次 ADB 设备列表（即时响应）
                    var adbPane = document.getElementById('adb-pane');
                    if (adbPane && adbPane.style.display === 'flex' && typeof refreshAdbDevices === 'function') {
                        refreshAdbDevices();
                    }
                    // WSL 页面打开时也刷新设备列表
                    var wslList = document.querySelector('[id$="-wslDeviceList"]');
                    if (wslList) {
                        var wslMid = wslList.id.replace('-wslDeviceList', '');
                        loadWslDevices(wslMid);
                    }
                }, 150);
            });
            // 安装更新前强制保存配置（process::exit 会跳过 beforeunload）
            window.__TAURI__.event.listen('save-before-exit', function() {
                if (_saveConfigTimer) { clearTimeout(_saveConfigTimer); _saveConfigTimer = null; }
                Object.keys(monitors).forEach(function(mid) { logCacheEnd(mid); }); // 退出前 flush 并结束所有会话缓存
                var cfg = collectConfig();
                invoke('save_config', { configJson: JSON.stringify(cfg) }).catch(function(e) { console.warn('退出前保存配置失败:', e); reportError(e, 'save-before-exit'); });
            });
        }

        // 监听窗口大小变化，缓存并保存到配置（防抖 500ms）
        function refreshWindowSizeCache() {
            invoke('get_window_size').then(function(size) {
                _cachedWindowSize = size;
            }).catch(function() {});
        }
        refreshWindowSizeCache();
        var _resizeTimer = null;
        window.addEventListener('resize', function() {
            refreshWindowSizeCache();
            if (_resizeTimer) clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function() {
                _resizeTimer = null;
                scheduleConfigSave();
            }, 500);
        });

        // 首次使用引导
        if (!localStorage.getItem('onboarding_done')) {
            setTimeout(showOnboarding, 600);
        }

        // 窗口关闭前强制保存配置，防止未提交的编辑丢失
        window.addEventListener('beforeunload', function() {
            if (_saveConfigTimer) { clearTimeout(_saveConfigTimer); _saveConfigTimer = null; }
            Object.keys(monitors).forEach(function(mid) { logCacheEnd(mid); }); // 关闭前 flush 并结束所有会话缓存
            var cfg = collectConfig();
            invoke('save_config', { configJson: JSON.stringify(cfg) }).catch(function(e) { console.warn('关闭前保存配置失败:', e); reportError(e, 'beforeunload'); });
        });
    } catch (err) {
        console.error('初始化失败:', err);
        if (document.getElementById('pane-main')) {
            // 主面板已创建，仅部分功能失败：提示但不遮屏
            try { showToast('部分功能初始化失败: ' + err, 'error'); } catch (_) {}
        } else {
            showFatalError('界面初始化失败', err);
        }
    }
});

// 初始化看门狗：主面板未在 8 秒内创建成功则显示兜底页，避免无提示黑屏
setTimeout(function() {
    try {
        if (!document.getElementById('pane-main')) {
            var d = document.getElementById('bootErrorDetail');
            // 若 catch 已经显示了具体错误信息，不覆盖为笼统的超时提示
            if (!d || !d.textContent) {
                showFatalError('界面初始化超时', '主监视器面板未在 8 秒内创建完成，请点击下方按钮重新加载。');
            }
        }
    } catch (_) {}
}, 8000);

/* ===== 首次使用引导 ===== */
var _onboardSteps = [
    {
        target: '.global-bar',
        pos: 'bottom',
        title: '1 / 9 — 全局操作栏',
        desc: '左侧可打开额外监视器和 WSL 端口映射；右侧可切换主题风格、提交反馈，以及深浅色模式。'
    },
    {

        pos: 'bottom',
        title: '2 / 9 — 选择串口',
        desc: '点击下拉选择串口设备。插拔设备后会自动刷新列表。'
    },
    {
        target: '#main-baudWrap',
        pos: 'bottom',
        title: '3 / 9 — 设置波特率',
        desc: '输入或从下拉选择波特率，默认 115200。'
    },
    {
        target: '#main-btnStart',
        pos: 'bottom',

        desc: '确认串口和波特率无误后，点击「开始监控」连接串口。'
    },
    {
        target: '#main-ibtnGroup',
        pos: 'bottom',

    },
    {

    },
    {
        target: '#main-btnQcmd',
        pos: 'top',
        title: '7 / 9 — 快捷指令',
        desc: '点击展开快速指令面板，可添加常用指令一键发送，支持自定义标签。'
    },
    {
        target: '#main-btnAdv',
        pos: 'bottom',

        desc: '点击齿轮图标展开：数据位、停止位、校验位、DTR/RTS 控制、日志保存。'
    },
    {
        target: '.global-bar',
        pos: 'bottom',

        desc: '以上就是核心功能。点击「跳过」或此处外部区域可随时关闭引导。'
    }
];
var _onboardIdx = 0;

function showOnboarding() {
    _onboardIdx = 0;
    _onboardPrevTarget = null;
    var overlay = document.getElementById('onboarding-overlay');
    var nav = document.getElementById('onboard-nav');
    var dotsEl = document.getElementById('onboard-dots');
    dotsEl.innerHTML = '';
    _onboardSteps.forEach(function(_, i) {
        var d = document.createElement('span');
        d.className = 'onboard-dot' + (i === 0 ? ' active' : '');
        dotsEl.appendChild(d);
    });
    overlay.classList.add('show');
    nav.style.display = 'flex';
    overlay.onclick = function(e) {
        if (e.target === overlay) closeOnboarding();
    };
    goStep(0);
}

var _onboardPrevTarget = null;

function goStep(idx) {
    _onboardIdx = idx;
    var step = _onboardSteps[idx];
    // 清除上一个目标的高亮
    if (_onboardPrevTarget) {
        _onboardPrevTarget.style.boxShadow = '';
        _onboardPrevTarget.style.position = '';
        _onboardPrevTarget.style.zIndex = '';
        _onboardPrevTarget.style.borderRadius = '';
    }
    var el = document.querySelector(step.target);
    if (!el) { nextStep(); return; }
    _onboardPrevTarget = el;
    var rect = el.getBoundingClientRect();
    var card = document.getElementById('onboard-step');
    var title = document.getElementById('onboard-title');
    var desc = document.getElementById('onboard-desc');
    var arrow = document.getElementById('onboard-arrow');
    var nextBtn = document.getElementById('onboard-next');
    title.textContent = step.title;
    desc.textContent = step.desc;
    nextBtn.textContent = idx === _onboardSteps.length - 1 ? '开始使用' : '下一步';
    // 聚光灯：给目标元素加 box-shadow（更深更亮）
    el.style.boxShadow = '0 0 0 4px var(--accent-focus, #4a7ab5), 0 0 24px 4px rgba(74,122,181,0.5), 0 0 0 9999px rgba(0,0,0,0.65)';
    el.style.position = 'relative';
    el.style.zIndex = '10001';
    el.style.borderRadius = '4px';
    // 先渲染内容，再测量卡片实际尺寸
    card.classList.remove('anim-in');
    card.style.top = '-9999px';
    card.style.left = '-9999px';
    card.style.visibility = 'hidden';
    card.style.display = '';
    arrow.className = 'onboard-arrow';
    arrow.style.left = '0px';
    var gap = 14;
    if (step.pos === 'bottom') {
        arrow.classList.add('top');
    } else {
        arrow.classList.add('bottom');
    }
    // 测量卡片实际尺寸
    var cardW = card.offsetWidth;
    var cardH = card.offsetHeight;
    // 目标元素水平中心点（或右侧对齐点）
    var targetCX = step.arrowAlign === 'right'
        ? rect.left + rect.width - 15
        : rect.left + rect.width / 2;
    // 理想卡片位置：水平居中对齐目标中心
    var idealLeft = targetCX - cardW / 2;
    var idealTop;
    if (step.pos === 'bottom') {
        idealTop = rect.bottom + gap;
    } else {
        idealTop = rect.top - gap - cardH;
    }
    // 边界 clamp（底部预留导航栏空间 ~80px）
    var vpW = window.innerWidth;
    var vpH = window.innerHeight;
    var navReserved = 80;
    var clampedLeft = Math.max(12, Math.min(idealLeft, vpW - cardW - 12));
    var clampedTop = Math.max(12, Math.min(idealTop, vpH - cardH - navReserved));
    // 箭头在卡片内的 X 偏移 = 目标中心点 - 卡片左边界，限制在卡片范围内
    var arrowX = targetCX - clampedLeft;
    arrowX = Math.max(16, Math.min(arrowX, cardW - 16));
    arrow.style.left = arrowX + 'px';
    // 应用位置
    card.style.visibility = '';
    card.style.top = clampedTop + 'px';
    card.style.left = clampedLeft + 'px';
    void card.offsetWidth;
    card.classList.add('anim-in');
    // 更新步骤指示点
    var dots = document.querySelectorAll('.onboard-dot');
    dots.forEach(function(d, i) { d.classList.toggle('active', i === idx); });
}

function nextStep() {
    if (_onboardIdx < _onboardSteps.length - 1) {
        goStep(_onboardIdx + 1);
    } else {
        closeOnboarding();
    }
}

function closeOnboarding() {
    var overlay = document.getElementById('onboarding-overlay');
    var nav = document.getElementById('onboard-nav');
    if (!overlay.classList.contains('show')) return;
    overlay.classList.remove('show');
    overlay.onclick = null;
    nav.style.display = 'none';
    nav.onclick = null;
    localStorage.setItem('onboarding_done', '1');
    // 清除当前目标的高亮
    if (_onboardPrevTarget) {
        _onboardPrevTarget.style.boxShadow = '';
        _onboardPrevTarget.style.position = '';
        _onboardPrevTarget.style.zIndex = '';
        _onboardPrevTarget.style.borderRadius = '';
        _onboardPrevTarget = null;
    }
}
