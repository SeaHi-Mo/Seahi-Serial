// 取输入框内最后一个空白分隔的 token 起点下标（用于补全/替换）
function termTokenStart(value) {
    var s = value.length;
    while (s > 0 && !/\s/.test(value[s - 1]) && value[s - 1] !== '\n') s--;
    return s;
}

// ===== 通用/内置命令（基础补全词库） =====
var GENERIC_CMDS = ['help','?','version','ver','reset','reboot','info','status','get','set','ls','dir','exit','quit','start','scan','wifi','ota','cd','pwd','cat','echo','date','ps','top','df','mount','ifconfig','ip','ping','clear','cls','type','del','copy','mkdir','rm','mv','cp','sed','grep','find','which','su','cmd'];

// ===== ADB 命令树（上下文命令补全） =====
var ADB_GLOBAL_OPTS = ['-s','-d','-e','-t','-L','--help','--version'];
var ADB_SUBCMDS = ['connect','disconnect','devices','get-state','get-serialno','install','install-multiple','uninstall','shell','push','pull','sync','logcat','forward','reverse','reboot','sideload','root','unroot','remount','usb','tcpip','wait-for-device','start-server','kill-server','bugreport','screencap','screenrecord','version','help'];
var ADB_SHELL_CMDS = ['ls','cat','cd','pwd','mkdir','rm','rmdir','cp','mv','chmod','chown','touch','echo','date','ps','top','df','du','mount','umount','getprop','setprop','pm','am','dumpsys','input','settings','wm','screencap','screenrecord','logcat','reboot','ifconfig','ip','netstat','ping','id','whoami','uname','env','tar','gzip','find','grep','sed','awk','which','su','cmd'];
var ADB_SUB_OPTS = {
    install: ['--help','-r','-t','-s','-g','-d','--no-streaming','--streaming'],
    'install-multiple': ['--help','-r','-t','-s','-g','-d'],
    uninstall: ['--help','-k','--user'],
    shell: ['--help','-T','-x'],
    logcat: ['--help','-v','-b','-f','-s','--pid'],
    push: ['--help','--sync','-n'],
    pull: ['--help','-a'],
    forward: ['--help','--no-rebind','-tcp','-local','-dev','-remote'],
    reverse: ['--help','--no-rebind','-tcp','-local','-dev','-remote'],
    reboot: ['--help','bootloader','recovery','sideload','sideload-auto-reboot','fastboot'],
    connect: ['--help'],
    disconnect: ['--help'],
    devices: ['--help','-l'],
    'get-state': ['--help'],
    'get-serialno': ['--help']
};
// 已知设备序列号（由 ADB 设备列表回填，用于 `adb -s <TAB>` 的设备补全）
var _adbSerials = [];

// 从 adb_devices 的返回中取出可用于补全的序列号（纯函数，便于无头断言）
function pickAdbSerials(devices) {
    if (!Array.isArray(devices)) return [];
    var out = [];
    devices.forEach(function(d) {
        var s = (d && d.serial) ? String(d.serial) : '';
        if (s && out.indexOf(s) < 0) out.push(s);
    });
    return out;
}

// 根据「已输入的前缀 token」推断补全上下文（首词是 adb 时走命令树）
function getAdbContextCandidates(toks) {
    var i = 1;                                    // 跳过 'adb'
    // 1) 消费全局取值选项及其值（-s/-t/-L/-p <值>）
    while (i < toks.length && (toks[i] === '-s' || toks[i] === '-t' || toks[i] === '-L' || toks[i] === '-p')) {
        if (i === toks.length - 1) return _adbSerials.slice();   // 正在补该选项的值（设备序列号）
        i += 2;
    }
    // 2) 消费布尔型全局选项（-d -e --help --version ...）
    var afterBool = false;
    while (i < toks.length && toks[i].charAt(0) === '-') {
        afterBool = true;
        i += 1;
    }
    if (i >= toks.length) {
        // 正在补「首个子命令」这一位：已给过布尔选项只补子命令，否则全局选项 + 子命令
        return afterBool ? ADB_SUBCMDS : ADB_GLOBAL_OPTS.concat(ADB_SUBCMDS);
    }
    var sub = toks[i];
    if (sub === 'shell') return ADB_SHELL_CMDS;   // adb shell <Tab> → 设备内命令
    if (toks.length - 1 === i) {                  // 正在补该子命令的参数/选项
        var opts = (ADB_SUB_OPTS[sub] || []).slice();
        if (sub === 'install' || sub === 'install-multiple' || sub === 'push' || sub === 'pull' || sub === 'sideload') {
            opts = opts.concat(['./', '../', '/sdcard/', '/data/local/tmp/', '<path>']);
        }
        if (sub === 'connect' || sub === 'disconnect') opts = opts.concat(['<ip:port>']);
        return opts;
    }
    // 更深层级：多为选项/路径，回退到该子命令的选项表
    return ADB_SUB_OPTS[sub] || [];
}

// 补全候选：首词是 adb → 走命令树（上下文感知）；否则 通用命令 + 历史 + 快捷指令
function getTermCompletionCandidates(mid, value, tokenStart) {
    var before = (value.slice(0, tokenStart) || '').trim();
    var toks = before ? before.split(/\s+/) : [];
    if (toks.length && toks[0].toLowerCase() === 'adb') {
        return getAdbContextCandidates(toks);
    }
    var set = [];
    var seen = {};
    function add(s) {
        s = String(s == null ? '' : s).trim();
        if (s && s.indexOf(' ') === -1 && !seen[s]) { seen[s] = 1; set.push(s); }
    }
    var m = monitors[mid];
    if (m) {
        (m.sendHistory || []).forEach(add);
        (m.quickCmds || []).forEach(function(c) {
            if (c) { add(c.label); add(c.value); }
        });
    }
    GENERIC_CMDS.forEach(add);
    return set;
}

// 求字符串列表的最长公共前缀
function commonPrefix(list) {
    var p = list[0] || '';
    for (var i = 1; i < list.length; i++) {
        var s = list[i];
        var j = 0;
        while (j < p.length && j < s.length && p.charCodeAt(j) === s.charCodeAt(j)) j++;
        p = p.slice(0, j);
        if (!p) break;
    }
    return p;
}

// TAB 补全主逻辑：只有唯一候选时直接补全；多候选先补到公共前缀，再次 Tab 循环
function completeTermTab(mid) {
    var m = monitors[mid];
    var input = document.getElementById(mid + '-termInput');
    if (!m || !input) return;
    var value = input.value;
    var start = termTokenStart(value);
    var token = value.slice(start);
    var prefix = value.slice(0, start);

    var st = m._termComp;
    if (!st || st.token !== token) {
        var candidates = getTermCompletionCandidates(mid, value, start);
        var matches = candidates.filter(function(c) {
            return c !== token && c.toLowerCase().indexOf(token.toLowerCase()) === 0;
        });
        st = { token: token, matches: matches, index: -1 };
        m._termComp = st;
    }

    if (st.matches.length === 0) {
        // 无本地匹配：给出提示，不做其它改动
        showTermHint(mid, '无匹配命令: ' + (token || '(空)'));
        return;
    }
    if (st.matches.length === 1) {
        input.value = prefix + st.matches[0];
        input.setSelectionRange(input.value.length, input.value.length);
        m._termComp = null;
        hideTermComp(mid);
        return;
    }
    // 多匹配：先尝试补到公共前缀，后续 Tab 在候选中循环
    if (st.index < 0) {
        var lcp = commonPrefix(st.matches);
        if (lcp.length > token.length) {
            input.value = prefix + lcp;
            input.setSelectionRange(input.value.length, input.value.length);
            showTermComp(mid, st.matches, -1);
            return;
        }
        st.index = 0;
    } else {
        st.index = (st.index + 1) % st.matches.length;
    }
    input.value = prefix + st.matches[st.index];
    input.setSelectionRange(input.value.length, input.value.length);
    showTermComp(mid, st.matches, st.index);
}

// 显示补全候选弹层（selIdx 高亮当前选中项，-1 表示未选中）
function showTermComp(mid, items, selIdx) {
    var comp = document.getElementById(mid + '-termComp');
    if (!comp) return;
    var m = monitors[mid];
    if (m && m._termHintTimer) { clearTimeout(m._termHintTimer); m._termHintTimer = null; }
    comp.innerHTML = '';
    var frag = document.createDocumentFragment();
    items.forEach(function(it, idx) {
        var div = document.createElement('div');
        div.className = 'term-comp-item' + (idx === selIdx ? ' selected' : '');
        div.textContent = it;
        div.addEventListener('mousedown', function(e) {
            e.preventDefault();
            var input = document.getElementById(mid + '-termInput');
            var mm = monitors[mid];
            if (input && mm) {
                var v = input.value;
                var s = termTokenStart(v);
                input.value = v.slice(0, s) + it;
                input.setSelectionRange(input.value.length, input.value.length);
                mm._termComp = null;
                input.focus();
            }
            hideTermComp(mid);
        });
        frag.appendChild(div);
    });
    comp.appendChild(frag);
    comp.classList.add('open');
}

function hideTermComp(mid) {
    var comp = document.getElementById(mid + '-termComp');
    if (comp) comp.classList.remove('open');
}

// 无匹配时的短暂提示（约 1.6s 后自动关闭）
function showTermHint(mid, text) {
    var comp = document.getElementById(mid + '-termComp');
    if (!comp) return;
    comp.innerHTML = '<div class="term-comp-item term-comp-more">' + escapeHtml(text) + '</div>';
    comp.classList.add('open');
    var m = monitors[mid];
    if (m) {
        if (m._termHintTimer) clearTimeout(m._termHintTimer);
        m._termHintTimer = setTimeout(function() { hideTermComp(mid); }, 1600);
    }
}


function toggleTerminalMode(btn, mid) {
    btn.classList.toggle('on');
    var output = document.getElementById(mid + '-output');
    var sendBar = document.querySelector('#pane-' + mid + ' .send-bar');
    var termCur = document.getElementById(mid + '-termCurrent');
    var termInput = document.getElementById(mid + '-termInput');
    if (output) {
        if (btn.classList.contains('on')) {
            output.style.cursor = 'text';
            // 终端模式：关闭输出区 contenteditable（不让浏览器往输出区插入文本），
            // 显示终端当前行（提示符+输入框，内联跟随设备提示符），输入由输入框负责（继承系统输入法）。
            output.contentEditable = 'false';
            if (sendBar) sendBar.style.display = 'none';
            if (termCur) termCur.classList.add('show');
            setTermPrompt(mid, ''); // 提示符由设备输出决定，先清空
            if (monitors[mid]) closeRecvPartial(monitors[mid]); // 清空普通模式残留行，避免污染
            if (termInput) { termInput.value = ''; termInput.focus(); }
            // 记录当前行元素，供 appendOutput 把设备输出插入到它之前（当前行始终在末尾）
            _terminalBuffers[mid] = termCur ? { lineEl: termCur } : true;
            var scrollBtn = document.getElementById(mid + '-btnScroll');
            if (scrollBtn && scrollBtn.classList.contains('on')) requestScroll(output);
        } else {
            output.style.cursor = 'default';
            // 恢复日志编辑
            output.contentEditable = 'true';
            if (sendBar) sendBar.style.display = '';
            if (termCur) termCur.classList.remove('show');
            if (termInput) termInput.value = '';
            // 清除终端模式的接收行缓冲（提示符），避免普通模式错误合并残留数据
            if (monitors[mid]) closeRecvPartial(monitors[mid]);
            // 关闭补全弹层并重置补全状态
            hideTermComp(mid);
            if (monitors[mid]) { monitors[mid]._termComp = null; if (monitors[mid]._termHintTimer) clearTimeout(monitors[mid]._termHintTimer); }
            delete _terminalBuffers[mid];
        }
    }
    scheduleConfigSave();
}

/* ===== DTR/RTS 实时切换（防抖 100ms，避免连续点击导致 IPC 拥堵卡死） ===== */
var _dtrRtsTimers = {};
function toggleDTR(mid, level) {
    if (!monitors[mid] || !monitors[mid].isConnected) return;
    var key = mid + '_dtr';
    if (_dtrRtsTimers[key]) clearTimeout(_dtrRtsTimers[key]);
    _dtrRtsTimers[key] = setTimeout(function() {
        delete _dtrRtsTimers[key];
        invoke('set_dtr', { monitorId: mid, level: level }).catch(function(e) { appendOutput(mid, 'err', 'DTR 失败: ' + e); });
    }, 100);
}
function toggleRTS(mid, level) {
    if (!monitors[mid] || !monitors[mid].isConnected) return;
    var key = mid + '_rts';
    if (_dtrRtsTimers[key]) clearTimeout(_dtrRtsTimers[key]);
    _dtrRtsTimers[key] = setTimeout(function() {
        delete _dtrRtsTimers[key];
        invoke('set_rts', { monitorId: mid, level: level }).catch(function(e) { appendOutput(mid, 'err', 'RTS 失败: ' + e); });
    }, 100);
}

/* ===== 端口锁定 ===== */
// 检查指定端口是否已被其他监视器占用
function findPortOwner(portName, excludeMid) {
    if (!portName) return null;
    for (var k in monitors) {
        if (k === excludeMid) continue;
        if (monitors[k] && monitors[k].isConnected && monitors[k].portName === portName) return k;
    }
    return null;
}
// 刷新所有监视器的端口列表（更新占用状态）
function refreshAllPorts() {
    Object.keys(monitors).forEach(function(mid) {
        if (monitors[mid] && monitors[mid].isWsl) {
            refreshWslMonPorts(mid);
        } else if (!monitors[mid].isConnected) {
            refreshPorts(mid, true);
        }
    });
}

/* ===== 连接管理 ===== */
async function toggleConnection(mid) {
    if (monitors[mid] && monitors[mid].isConnected) await disconnectPort(mid);
    else await connectPort(mid);
}

async function connectPort(mid, silent) {
    var name = document.getElementById(mid + '-portSelect').getAttribute('data-val') || '';
    if (!name) { if (!silent) appendOutput(mid, 'err', '请先选择端口'); return; }
    // 端口锁定检查
    var owner = findPortOwner(name, mid);
    if (owner) {
        if (!silent) showToast('端口 ' + name + ' 已被监视器 ' + owner + ' 占用', 'error');
        return;
    }
    var btn = document.getElementById(mid + '-btnStart');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span style="font-size:11px;">⏳</span> 连接中...'; }
    var baud = parseInt(document.getElementById(mid + '-baudRate').value) || 115200;
    var dataBits = parseInt((document.getElementById(mid + '-dataBits').getAttribute('data-val'))) || 8;
    var stopBits = parseInt((document.getElementById(mid + '-stopBits').getAttribute('data-val'))) || 1;
    var parity = document.getElementById(mid + '-parity').getAttribute('data-val') || 'none';
    var dtr = document.getElementById(mid + '-chkDTR').checked;
    var rts = document.getElementById(mid + '-chkRTS').checked;
    try {
        await invoke('open_port', { monitorId:mid, portName:name, baudRate:baud, dataBits:dataBits, stopBits:stopBits, parity:parity, dtr:dtr, rts:rts });
        monitors[mid].isConnected = true;
        monitors[mid].portName = name;
        monitors[mid]._manuallyDisconnected = false;
        resetRecvStream(mid); // 新数据流：不继承上一次连接的未结束行
        logCacheStart(mid, name); // 打开串口：标记本次会话，有收发内容时自动缓存
        updateMonitorUI(mid, true);
        startReading(mid);
        // 同步行尾设置到后台线程
        var leEl = document.getElementById(mid + '-lineEnding');
        var leVal = leEl ? (leEl.getAttribute('data-val') || 'crlf') : 'crlf';
        invoke('update_workflow_line_ending', { monitorId: mid, lineEnding: leVal }).catch(function() {});
        refreshAllPorts();
        renderWslDeviceList('main'); // 及时刷新 WSL 设备状态点（端口占用）
    } catch (e) {
        monitors[mid].isConnected = false;
        stopReading(mid);
        if (btn) { btn.disabled = false; }
        updateMonitorUI(mid, false);
        if (!silent) showToast('连接失败: ' + e, 'error');
        reportError(e, 'connectPort');
    }
}

async function disconnectPort(mid) {
    var btn = document.getElementById(mid + '-btnStart');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span style="font-size:11px;">⏳</span> 断开中...'; }
    // 先停止轮询，防止 in-flight 的 timer 回调触发重连
    stopReading(mid);
    monitors[mid]._manuallyDisconnected = true;
    monitors[mid]._reconnectPending = false; // 取消残留的自动重连重试
    try {
        await invoke('close_port', { monitorId: mid });
    } catch (e) {
        showToast('断开失败: ' + e, 'error');
        reportError(e, 'disconnectPort');
    }
    monitors[mid].isConnected = false;
    monitors[mid].portName = '';
    logCacheEnd(mid); // 结束本次会话缓存
    updateMonitorUI(mid, false);
    refreshAllPorts();
    renderWslDeviceList('main'); // 及时刷新 WSL 设备状态点（端口释放）
}

function updateMonitorUI(mid, connected, waiting) {
    var m = monitors[mid];
    var btn = document.getElementById(mid + '-btnStart');
    var sendBtn = document.getElementById(mid + '-btnSend');
    var ps = document.getElementById(mid + '-portSelect');
    if (connected) {
        btn.innerHTML = '<span style="font-size:11px;">&#9632;</span> 停止监控';
        btn.className = 'btn-main stop';
        btn.disabled = false;
        sendBtn.disabled = false;
        ps.disabled = true;
    } else if (waiting) {
        btn.innerHTML = '<span style="font-size:11px;">&#9654;</span> 等待接入';
        btn.className = 'btn-main start waiting';
        btn.disabled = true;
        sendBtn.disabled = true;
        ps.disabled = true;
    } else {
        btn.innerHTML = '<span style="font-size:11px;">&#9654;</span> 开始监控';
        btn.className = 'btn-main start';
        btn.disabled = false;
        sendBtn.disabled = true;
        ps.disabled = false;
    }
    updateQcmdSendBtns(mid, connected);
}

// ===== 自动化工作流 =====

async function checkWorkflowMatches(mid, rawBytes) {
    if (!monitors[mid] || !monitors[mid].workflows || monitors[mid].workflows.length === 0) return;
    try {
        var matched = await invoke('check_workflow_matches', {
            monitorId: mid,
            data: Array.from(rawBytes),
        });
        if (matched && matched.length > 0) {
            matched.forEach(function(rule) {
                // 只有运行中的规则才显示发送内容
                var wf = (monitors[mid].workflows || []).find(function(r) { return r.id === rule.id; });
                if (wf && wf._running) {
                    var sentText = rule.sent || '';
                    appendOutput(mid, 'send', '[Auto] ' + sentText);
                }
            });
        }
    } catch (e) {
        console.warn('Workflow check failed:', e);
    }
}

function startReading(mid) {
    stopReading(mid);
    var reading = false;
    monitors[mid].readTimer = setInterval(async function() {
        if (reading || !monitors[mid] || !monitors[mid].isConnected) { if (!monitors[mid] || !monitors[mid].isConnected) stopReading(mid); return; }
        reading = true;
        try {
            var data = await invokeTimeout('read_data', { monitorId: mid }, 3000);
            if (data && data.length > 0) {
                // 渲染异常只记录日志，避免误触发断开/重连逻辑导致界面异常（#13）
                try {
                    var frag = document.createDocumentFragment();
                    var vm = document.getElementById(mid + '-viewMode');
                    var isHex = vm && vm.getAttribute('data-val') === 'hex';
                    if (isHex) {
                        var hexStr = bytesToHex(new Uint8Array(data));
                        var chunkSize = 192;
                        for (var i = 0; i < hexStr.length; i += chunkSize) {
                            var chunk = hexStr.substring(i, i + chunkSize);
                            appendOutput(mid, 'recv', (i === 0 ? 'HEX: ' : '     ') + chunk, { hex: true, fragment: frag });
                        }
                    } else {
                        // 文本模式：合并未结束行，只有真正的 \r\n 才换行
                        appendRecvText(mid, decodeRecv(mid, data), frag);
                    }
                    flushBatch(mid, frag);
                } catch (e) {
                    console.warn('[recv] 数据显示异常:', e);
                }
            }
            // 读取工作流触发事件（无工作流规则时跳过，减少每 tick 的 IPC）
            if (monitors[mid] && (monitors[mid].workflows || []).length > 0) {
                var wfEvents = await invokeTimeout('read_workflow_events', { monitorId: mid }, 3000);
                for (var j = 0; j < wfEvents.length; j++) {
                    appendOutput(mid, 'send', wfEvents[j]);
                }
            }
        } catch (e) {
            // 手动断开或正在重连时不触发自动重连
            if (monitors[mid] && (monitors[mid]._manuallyDisconnected || monitors[mid]._reconnecting)) {
                monitors[mid].isConnected = false;
                stopReading(mid);
                updateMonitorUI(mid, false);
                return;
            }
            var reconnectBtn = document.getElementById(mid + '-btnAutoReconnect');
            if (reconnectBtn && reconnectBtn.classList.contains('on')) {
                try {
                    await invoke('close_port', { monitorId: mid });
                } catch (_) {}
                // await 期间用户可能已经关掉这个监视器（closeMonitor 会 delete monitors[mid]）
                if (!monitors[mid]) return;
                monitors[mid].isConnected = false;
                stopReading(mid);
                updateMonitorUI(mid, false, true);
                var savedPort = monitors[mid].portName;
                appendOutput(mid, 'sys', '连接断开，正在自动重连...');
                reconnectPort(mid, savedPort, 1);
            } else {
                monitors[mid].isConnected = false;
                stopReading(mid);
                logCacheEnd(mid); // 连接断开且无自动重连：结束会话缓存
                updateMonitorUI(mid, false);
                refreshPorts(mid, true);
            }
        } finally {
            reading = false;
        }
    }, 25);
}

async function reconnectPort(mid, portName, attempt) {
    if (monitors[mid]) monitors[mid]._reconnectPending = true;
    if (!portName || attempt > 10) {
        if (attempt > 10) {
            appendOutput(mid, 'err', '重连失败，已达到最大重试次数');
            updateMonitorUI(mid, false, false);
            logCacheEnd(mid); // 重连最终失败：结束会话缓存
        }
        if (monitors[mid]) monitors[mid]._reconnectPending = false;
        return;
    }
    await refreshPorts(mid, true);
    var sel = document.getElementById(mid + '-portSelect');
    if (sel && [...sel.querySelectorAll('.sel-opt')].some(function(o) { return o.getAttribute('data-val') === portName; })) {
        // 显式设置下拉框为目标端口，防止 refreshPorts 将其重置为第一个端口
        var matchEl = sel.parentElement.querySelector('.sel-drop .sel-opt[data-val="' + portName + '"]');
        if (matchEl) {
            sel.querySelector('.sel-text').textContent = matchEl.textContent;
            sel.setAttribute('data-val', portName);
            sel.parentElement.querySelectorAll('.sel-opt').forEach(function(o) { o.classList.remove('active'); });
            matchEl.classList.add('active');
        }
        await connectPort(mid, true);
        if (monitors[mid].isConnected) {
            if (monitors[mid]) monitors[mid]._reconnectPending = false;
            return;
        }
    }
    var delay = Math.min(2000 * attempt, 20000);
    appendOutput(mid, 'sys', '重连失败，' + Math.round(delay/1000) + '秒后重试 (' + attempt + '/10)...');
    setTimeout(function() {
        // 用户已切换端口或手动断开时，中止残留重试
        if (!monitors[mid] || !monitors[mid]._reconnectPending) return;
        reconnectPort(mid, portName, attempt + 1);
    }, delay);
}
function stopReading(mid) {
    if (monitors[mid] && monitors[mid].readTimer) { clearInterval(monitors[mid].readTimer); monitors[mid].readTimer = null; }
}

/* ===== 额外监视器 ===== */
function addMonitor() {
    // 上下文感知：蓝牙页面下创建「嵌入右侧的串口监视器」（最多一个）
    var blePane = document.getElementById('ble-pane');
    if (blePane && blePane.style.display !== 'none' && blePane._initialized) {
        addBleMonitor();
        return;
    }
    // 上下文感知：WSL 页面下创建 WSL 监视器
    var wslPane = document.getElementById('wsl-pane');
    if (wslPane && wslPane.style.display !== 'none') {
        addWslMonitor();
        return;
    }
    extraCount++;
    createMonitorPane('extra-' + extraCount, '监视器 ' + (extraCount + 1), true);
    // 复制当前主监视器的用户配置到新监视器（波特率、滚动、行号、快捷指令等，深拷贝互不干扰）
    copyMonitorConfig('main', 'extra-' + extraCount);
    // 自动扩展窗口宽度以容纳新监视器
    var panes = document.querySelectorAll('#paneContainer .monitor-pane');
    var minWidth = panes.length * 524;
    invoke('get_window_size').then(function(size) {
        // 后端 get_window_size 返回 Result<(u32,u32)>，经 serde 序列化为数组 [width, height]
        var w = Array.isArray(size) ? size[0] : size.width;
        var h = Array.isArray(size) ? size[1] : size.height;
        if (w < minWidth) {
            invoke('set_window_size', { width: minWidth, height: h });
        }
    }).catch(function() {});
    scheduleConfigSave();
}

// 拖拽后的宽度（纯函数，便于无头断言）：
// 监视器在最右侧 → 向左拖（curX < startX）变宽；夹取到 [280, 视口 46%]
function clampBleMonWidth(startW, startX, curX, viewportW) {
    var w = startW + (startX - curX);
    var max = Math.max(280, Math.round((viewportW || 0) * 0.46));
    return Math.max(280, Math.min(max, Math.round(w)));
}

// 蓝牙页内嵌监视器的宽度拖拽：照 WSL 页 initWslMonResize 的做法，方向改为左右。
// 松手后把宽度转成 flex-basis，窗口缩小时仍受 max-width 约束自动收窄。
function initBleMonResize() {
    var handle = document.getElementById('ble-monResize');
    var area = document.getElementById('ble-monitorArea');
    if (!handle || !area || handle._bound) return;
    handle._bound = true;
    var startX = 0, startW = 0;
    function onMouseMove(e) {
        var w = clampBleMonWidth(startW, startX, e.clientX, window.innerWidth);
        area.style.flex = 'none';
        area.style.width = w + 'px';
    }
    function onMouseUp() {
        handle.classList.remove('dragging');
        var finalW = area.offsetWidth;
        area.style.width = '';
        area.style.flex = '0 0 ' + finalW + 'px';
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.body.style.cursor = '';
    }
    handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        startX = e.clientX;
        startW = area.offsetWidth;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });
}

// 蓝牙页内嵌监视器：在蓝牙页右侧开一个**串口**监视器，用来抓蓝牙设备的串口日志。
// 约束（用户要求）：蓝牙页最多一个 —— 已有则提示并高亮，不重复创建。
var _bleExtraMon = null;   // 内嵌监视器的 mid（'ble-mon'），未打开时为 null

function addBleMonitor() {
    var area = document.getElementById('ble-monitorArea');
    if (!area) return;
    // 上限 1：已有则只提示 + 高亮已有窗口，让用户知道"不是没反应"
    if (_bleExtraMon && monitors[_bleExtraMon]) {
        showToast('蓝牙页最多只能打开一个监视器', 'info');
        var exist = document.getElementById('pane-' + _bleExtraMon);
        if (exist) {
            exist.style.outline = '1px solid var(--accent-focus)';
            setTimeout(function() { exist.style.outline = ''; }, 900);
        }
        return;
    }
    var mid = 'ble-mon';
    // 复用通用监视器窗口（自带完整工具条、发送栏、快捷指令），建好后搬到蓝牙页右侧
    createMonitorPane(mid, '监视器 · 蓝牙日志', true);

        pane.style.minWidth = '0';

// 添加 WSL 额外串口监视器
function addWslMonitor() {

        {label:'指令4', value:''}, {label:'指令5', value:''}
    ], isWsl: true, workflows: [], _bufferStart: 0,
    _textData: new Uint8Array(1024 * 1024), _textDataLen: 0,

// 关闭 WSL 额外串口监视器
function closeWslMonitor(wmid) {
    stopReading(wmid);
    logCacheEnd(wmid); // 删除监视器：结束会话缓存
    var wasConnected = !!(monitors[wmid] && monitors[wmid].isConnected);
    var cleanup = function() {
        delete monitors[wmid];
        var pane = document.getElementById('pane-' + wmid);
        if (pane) pane.remove();
        renderWslDeviceList('main'); // 及时刷新 WSL 设备状态点
        scheduleConfigSave();
    };
    if (wasConnected) {
        // 等待连接释放完成（最多 3 秒），避免端口未释放（#15/#16）
        invokeTimeout('close_wsl_serial', { monitorId: wmid }, 3000)
            .catch(function() {})
            .finally(cleanup);
    } else {
        cleanup();
    }
}

function closeMonitor(mid) {
    stopReading(mid);
    logCacheEnd(mid); // 删除监视器：结束会话缓存
    var wasConnected = !!(monitors[mid] && monitors[mid].isConnected);
    var cleanup = function() {
        delete monitors[mid];
        delete _terminalBuffers[mid];
        var pane = document.getElementById('pane-' + mid);
        if (pane) pane.remove();
        // 蓝牙页内嵌监视器：关闭后必须清账，否则再点「+」会以为还有一个而不给开
        if (mid === _bleExtraMon) {
            _bleExtraMon = null;
            var bleArea = document.getElementById('ble-monitorArea');
            if (bleArea) bleArea.classList.remove('active');
        }
        renderWslDeviceList('main'); // 及时刷新 WSL 设备状态点
        scheduleConfigSave();
    };
    if (wasConnected) {
        // 等待端口释放完成（最多 3 秒），避免直接删除监视器导致端口句柄未释放（#15/#16）
        invokeTimeout('close_port', { monitorId: mid }, 3000)
            .catch(function() {})
            .finally(cleanup);
    } else {
        cleanup();
    }
}

/* ===== 发送数据 ===== */
async function sendData(mid) {
    if (!monitors[mid] || !monitors[mid].isConnected) return;
    var input = document.getElementById(mid + '-sendInput');
    var text = input.value;
    if (!text) return;
    var hexMode = document.getElementById(mid + '-sendAsText').textContent === 'HEX';
    var bytes;
    try {
        if (hexMode) { bytes = hexToBytes(text); }
        else { text = parseEscapes(text); text += leStr(mid); bytes = new TextEncoder().encode(text); }
    } catch (e) { appendOutput(mid, 'err', '格式错误: ' + e); return; }
    try {
        // 先显示 echo，再发送数据，避免回车后等待卡顿
        var echoBtn = document.getElementById(mid + '-btnEcho');
        if (echoBtn && echoBtn.classList.contains('on')) {
            appendOutput(mid, 'send', hexMode ? 'HEX: ' + bytesToHex(bytes) : decodeRaw(bytes));
        }
        await invokeTimeout('send_data', { monitorId: mid, data: Array.from(bytes) }, 5000);
        // 保存到发送历史（去重：不存连续重复）
        var hist = monitors[mid].sendHistory;
        if (hist.length === 0 || hist[0] !== text) {
            hist.unshift(text);
            if (hist.length > MAX_SEND_HISTORY) hist.pop();
        }
        monitors[mid].histNavIdx = -1;
        input.value = '';
        input.focus();
        scheduleConfigSave();
    } catch (e) { appendOutput(mid, 'err', '发送失败: ' + e); reportError(e, 'sendData'); }
}

/* ===== 发送历史下拉 ===== */
function showSendHistory(mid) {
    var hist = monitors[mid].sendHistory;
    var histEl = document.getElementById(mid + '-sendHist');
    if (hist.length === 0) return;
    histEl.innerHTML = '';
    hist.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'send-hist-item';
        div.textContent = item;
        div.addEventListener('click', function() {
            document.getElementById(mid + '-sendInput').value = item;
            histEl.classList.remove('open');
            document.getElementById(mid + '-sendInput').focus();
        });
        histEl.appendChild(div);
    });
    histEl.classList.add('open');
}

function leStr(mid) {
    var el = document.getElementById(mid + '-lineEnding');
    var v = el ? (el.getAttribute('data-val') || 'crlf') : 'crlf';
    return v==='crlf'?'\r\n': v==='lf'?'\n': v==='cr'?'\r':'';
}

        }
    } catch (e) { appendOutput(mid, 'err', '选择目录失败: ' + e); }
}
async function saveLogToFile(mid) {

    try {

        await invoke('save_log', { content: content, path: logDirPath });
        showToast('日志保存成功', 'info');

}
function copyOutput(mid) {
    var text = getOutputText(mid);
    if (!text) { appendOutput(mid, 'err', '没有可复制的内容。'); return; }
    // 优先使用 Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            appendOutput(mid, 'sys', '已复制。');
        }).catch(function() { fallbackCopy(mid, text); });
    } else {
        fallbackCopy(mid, text);
    }
}
function fallbackCopy(mid, text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        document.execCommand('copy') ? appendOutput(mid, 'sys', '已复制。') : appendOutput(mid, 'err', '复制失败。');
    } catch(e) { appendOutput(mid, 'err', '复制失败: ' + e); }
    document.body.removeChild(ta);
}
function getOutputText(mid) {
    // 优先从紧凑存储读取（保留完整日志，不受 DOM maxLines 限制）
    if (monitors[mid] && monitors[mid]._textCount > 0) {
        return bufferGetAllText(monitors[mid]);
    }
    // fallback：从 DOM 读取
    var output = document.getElementById(mid + '-output');
    if (!output) return '';
    return Array.from(output.querySelectorAll('.ol'))
        .map(function(l) {
            var lc = l.querySelector('.lc');
            return lc ? lc.textContent : '';
        }).join('\n');
}

/* ===== 输出区 ===== */
// 说明：原 decodeData() 包装函数已删除（零调用，功能由 decodeRaw 直接承担）。
function decodeRaw(bytes, mode) {
    mode = mode || 'text';
    var arr = new Uint8Array(bytes);
    if (mode === 'hex') return bytesToHex(arr);
    return _textDecoder.decode(arr);
}

var _scrollRaf = {}; // { elementId: rafId }
function requestScroll(el) {
    if (_scrollRaf[el.id]) return;
    _scrollRaf[el.id] = requestAnimationFrame(function() {
        _scrollRaf[el.id] = 0;
        el.scrollTop = el.scrollHeight;
    });
}

function appendOutput(mid, type, text, opts) {
    var el = document.getElementById(mid + '-output');
    if (!el) return;
    var tsEl = document.getElementById(mid + '-btnTs');
    var showTs = tsEl && tsEl.classList.contains('on');
    var now = new Date();
    var ts = showTs ? '[' + now.toTimeString().slice(0,8) + '.' + String(now.getMilliseconds()).padStart(3,'0') + '] ' : '';
    var div = document.createElement('div');
    div.className = 'ol ' + type;
    if (opts && opts.hex) div.classList.add('hex-view');
    var isEmpty = !text || text.trim() === '';
    var lnSpan = document.createElement('span');
    lnSpan.className = 'ln';
    lnSpan.setAttribute('contenteditable', 'false');
    if (!isEmpty) {
        if (!el._lineCount) el._lineCount = 0;
        el._lineCount++;
        lnSpan.textContent = String(el._lineCount);
    }
    div.appendChild(lnSpan);
    if (isEmpty) div.classList.add('empty-line');
    var contentSpan = document.createElement('span');
    contentSpan.className = 'lc';
    // 写入紧凑存储（保留完整日志，不受 maxLines 限制）
    if (monitors[mid] && !isEmpty) {
        bufferPush(mid, type, ts, text);
    }
    if (type === 'recv') {
        if (opts && opts.hex) {
            contentSpan.textContent = ts + text;
        } else if (text.indexOf('\x1b') === -1) {
            contentSpan.textContent = ts + text;
        } else {
            contentSpan.innerHTML = escapeHtml(ts) + parseAnsi(text);
        }
    } else if (type === 'send') {
        contentSpan.textContent = ts + text;
    } else {
        contentSpan.textContent = ts + text;
    }
    div.appendChild(contentSpan);
    var target = (opts && opts.fragment) ? opts.fragment : el;
    // 终端模式下，新行插到终端当前行之前（当前行保持在末尾），使设备输出显示在提示符上方
    var termCur = _terminalBuffers[mid] && _terminalBuffers[mid].lineEl;
    if (target === el && termCur && termCur.parentNode === el) {
        el.insertBefore(div, termCur);
    } else {
        target.appendChild(div);
    }
    // 维护“未结束的接收行”状态：opts.open 的 recv 行可接受后续数据合并，
    // 其余行（send/sys/hex/普通 recv）都会关闭当前打开行，避免跨输出合并
    var m = monitors[mid];
    if (m) {
        if (opts && opts.open && type === 'recv' && !(opts && opts.hex)) {
            m._recvPartialEl = div;
            m._recvPartial = text;
            m._recvPartialTs = ts;
            m._recvPartialOpen = true;
        } else {
            closeRecvPartial(m);
        }
    }
    if (!(opts && opts.fragment)) {
        var maxLines = 10000;
        var softLimit = 15000;
        // 用户在顶部查看历史或有选区时，跳过清理，保护已加载内容
        var isAtTop = el.scrollTop < 100;
        var hasSelection = (function() { var s = window.getSelection(); return s && s.toString().length > 0; })();
        if (el.children.length > softLimit && !isAtTop && !hasSelection) {
            var removeCount = el.children.length - maxLines;
            var removedNonEmpty = 0;
            for (var r = 0; r < removeCount; r++) {
                if (!el.firstChild.classList.contains('empty-line')) removedNonEmpty++;
                el.removeChild(el.firstChild);
            }
            if (el._lineCount > removedNonEmpty) el._lineCount -= removedNonEmpty; else el._lineCount = 0;
            if (monitors[mid]) monitors[mid]._bufferStart += removedNonEmpty;
        }
        var scrollBtn = document.getElementById(mid + '-btnScroll');
        if (scrollBtn && scrollBtn.classList.contains('on')) requestScroll(el);
    }
    return div;
}

function flushBatch(mid, fragment) {
    var el = document.getElementById(mid + '-output');
    if (!el || !fragment) return;
    // 终端模式下，批量数据插到终端当前行之前
    var termCur = _terminalBuffers[mid] && _terminalBuffers[mid].lineEl;
    if (termCur && termCur.parentNode === el) {
        el.insertBefore(fragment, termCur);
    } else {
        el.appendChild(fragment);
    }
    var maxLines = 10000;
    var softLimit = 15000;
    // 用户在顶部查看历史或有选区时，跳过清理
    var isAtTop = el.scrollTop < 100;
    var hasSelection = (function() { var s = window.getSelection(); return s && s.toString().length > 0; })();
    if (el.children.length > softLimit && !isAtTop && !hasSelection) {
        var removeCount = el.children.length - maxLines;
        var removedNonEmpty = 0;
        for (var r = 0; r < removeCount; r++) {
            if (!el.firstChild.classList.contains('empty-line')) removedNonEmpty++;
            el.removeChild(el.firstChild);
        }
        if (el._lineCount > removedNonEmpty) el._lineCount -= removedNonEmpty; else el._lineCount = 0;
        if (monitors[mid]) monitors[mid]._bufferStart += removedNonEmpty;
    }
    var scrollBtn = document.getElementById(mid + '-btnScroll');
    if (scrollBtn && scrollBtn.classList.contains('on')) requestScroll(el);
}

/* ===== 接收行缓冲（防止轮询分块造成“假换行”）=====
 * 串口数据按轮询间隔分块到达，若每块都独立拆行显示，块边界会凭空产生换行，
 * 即使设备端从未发送 \r\n。这里为每个监视器维护一条“未结束的接收行”
 * （_recvPartial*），后续数据无缝合并进同一行，只有真正收到 \r\n 才换行。 */
function closeRecvPartial(m) {
    if (!m) return;
    m._recvPartialEl = null;
    m._recvPartial = '';
    m._recvPartialTs = '';
    m._recvPartialOpen = false;
}

// 新建一行接收数据（处于未结束状态，后续数据会合并进来）
function openRecvRow(mid, text, frag) {
    if (!text) return null;
    return appendOutput(mid, 'recv', text, { fragment: frag, open: true });
}

// 将后续数据合并进当前未结束的接收行（DOM 与紧凑存储同步更新）
function updateOpenRowText(m, fullText, mid, frag) {
    if (!m) return;
    // 打开行已被清理（极端情况）→ 重新开一行
    if (!m._recvPartialEl || !m._recvPartialEl.parentNode) {
        closeRecvPartial(m);
        openRecvRow(mid, fullText, frag);
        return;
    }
    var contentSpan = m._recvPartialEl.querySelector('.lc');
    if (contentSpan) {
        if (fullText.indexOf('\x1b') === -1) {
            contentSpan.textContent = m._recvPartialTs + fullText;
        } else {
            contentSpan.innerHTML = escapeHtml(m._recvPartialTs) + parseAnsi(fullText);
        }
    }
    m._recvPartial = fullText;
    var idx = bufferFindLastRecvIndex(m);
    if (idx >= 0) bufferUpdateLineText(m, idx, fullText);
}

// 处理一段接收文本：合并“未结束行”，只有设备真正发送 \r\n 才产生换行
function appendRecvText(mid, decoded, frag) {
    var el = document.getElementById(mid + '-output');
    var m = monitors[mid];
    if (!el || !m || decoded === '') return;

    // 归一化换行：把 \r\n 与单独的 \r 统一为 \n，纯 \r 换行的设备（如 AT 固件）也能正确分行
    var combined = ((m._recvPartial || '') + decoded).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    var endsWithNl = /\n$/.test(combined);
    var body = endsWithNl ? combined.replace(/\n+$/, '') : combined;
    var parts = body === '' ? [] : body.split('\n');

    // 终端模式：未结束行作为"当前行提示符"，完整行作为设备输出（插到当前行之前）
    if (_terminalBuffers[mid] && _terminalBuffers[mid].lineEl) {
        m._recvPartial = (endsWithNl || parts.length === 0) ? '' : parts[parts.length - 1];
        var fullParts = endsWithNl ? parts : parts.slice(0, parts.length - 1);
        for (var k = 0; k < fullParts.length; k++) {
            appendOutput(mid, 'recv', fullParts[k] === '' ? '' : fullParts[k], { fragment: frag });
        }
        // 未结束行（提示符）→ 终端当前行提示符
        if (!endsWithNl && parts.length > 0 && parts[parts.length - 1] !== '') {
            setTermPrompt(mid, parts[parts.length - 1]);
        }
        return;
    }

    if (parts.length === 0) {
        // 纯换行：已有打开行则关闭，否则渲染一个空行
        if (m._recvPartialOpen) closeRecvPartial(m);
        else appendOutput(mid, 'recv', '', { fragment: frag });
        return;
    }

    // 第一段：若此前有打开行，则是它的延续或完成
    var first = parts[0];
    if (m._recvPartialOpen) {
        updateOpenRowText(m, first, mid, frag);
        if (endsWithNl || parts.length > 1) closeRecvPartial(m);
    } else if (first !== '') {
        if (parts.length === 1 && !endsWithNl) {
            openRecvRow(mid, first, frag);          // 未换行结尾 → 新打开行
        } else {
            appendOutput(mid, 'recv', first, { fragment: frag });
        }
    } else {
        // 以换行开头且无打开行 → 空行
        appendOutput(mid, 'recv', '', { fragment: frag });
    }

    // 其余部分：完整行直接输出；最后一段未以换行结尾则作为新的打开行
    for (var i = 1; i < parts.length; i++) {
        var isLast = (i === parts.length - 1);
        if (isLast && !endsWithNl) {
            if (parts[i] !== '') openRecvRow(mid, parts[i], frag);
        } else {
            appendOutput(mid, 'recv', parts[i], { fragment: frag });
        }
    }
}

// 流式解码：保持跨轮询分块的多字节 UTF-8 字符完整，避免块边界出现乱码
function decodeRecv(mid, data) {
    var m = monitors[mid];
    if (!m) return '';
    if (!m._recvDecoder) m._recvDecoder = new TextDecoder();
    return m._recvDecoder.decode(new Uint8Array(data), { stream: true });
}

// 串口（重新）连接时重置行缓冲与解码器：新数据流不应与旧流合并
function resetRecvStream(mid) {
    var m = monitors[mid];
    if (!m) return;
    closeRecvPartial(m);
    m._recvDecoder = null;
    if (_terminalBuffers[mid]) setTermPrompt(mid, ''); // 终端模式：清空提示符
    // 重连/切换后重置终端补全状态
    if (m) { m._termComp = null; if (m._termHintTimer) { clearTimeout(m._termHintTimer); m._termHintTimer = null; } }
    hideTermComp(mid);
}

function clearLog(mid) {
    var el = document.getElementById(mid + '-output');
    // 始终保留终端当前行（隐藏时也在 DOM 里），避免清理日志后终端模式丢行
    var termCur = document.getElementById(mid + '-termCurrent');
    if (termCur && termCur.parentNode === el) {
        Array.from(el.childNodes).forEach(function(n) { if (n !== termCur) n.remove(); });
        el.appendChild(termCur);
    } else {
        el.innerHTML = '';
    }
    el._lineCount = 0;
    // 同时清空紧凑存储
    if (monitors[mid]) {
        monitors[mid]._textDataLen = 0;
        monitors[mid]._textCount = 0;
        monitors[mid]._bufferStart = 0;
        closeRecvPartial(monitors[mid]);
    }
    if (_terminalBuffers[mid]) setTermPrompt(mid, '');
}

// ===== 日志隐形缓存 =====
// 每次打开串口并产生收发内容的会话，会自动把收发日志缓存到后端 log-cache 目录
// （一个会话一个文件，最多保留 10 个，新建文件时按 FIFO 删除最旧的）。
// 收发内容经 bufferPush 汇入，300ms 节流批量写入，会话断开/窗口关闭时 flush 并结束。
var _logCacheFlushMs = 300;
function logCacheScheduleFlush(mid) {
    var m = monitors[mid];
    if (!m || m._logCacheTimer || !m._logCachePending) return;
    m._logCacheTimer = setTimeout(function() {
        m._logCacheTimer = null;
        logCacheFlush(mid);
    }, _logCacheFlushMs);
}
function logCacheFlush(mid) {
    var m = monitors[mid];
    if (!m || !m._logCachePending) return;
    var content = m._logCachePending;
    m._logCachePending = '';
    try {
        invoke('append_log_cache', { monitorId: mid, content: content }).catch(function() {});
    } catch (e) {}
}
// 标记会话开始（幂等：自动重连时保留原缓存文件，日志连续）
function logCacheStart(mid, portName) {
    var m = monitors[mid];
    if (!m) return;
    m._logCachePending = m._logCachePending || '';
    m._logCacheStarted = true;
    try {
        invoke('start_log_cache', { monitorId: mid, portName: portName || '' }).catch(function() {});
    } catch (e) {}
}
// 结束会话：flush 剩余内容，结束缓存文件，清空会话状态
function logCacheEnd(mid) {
    var m = monitors[mid];
    if (!m) return;
    if (m._logCacheTimer) { clearTimeout(m._logCacheTimer); m._logCacheTimer = null; }
    if (!m._logCacheStarted) return;
    logCacheFlush(mid);
    try {
        invoke('end_log_cache', { monitorId: mid }).catch(function() {});
    } catch (e) {}
    m._logCacheStarted = false;
}

// ===== 紧凑存储辅助函数 =====
var _typeMap = {recv: 0, send: 1, sys: 2, err: 3};
var _typeNames = ['recv', 'send', 'sys', 'err'];

// 写入一行到紧凑存储
function bufferPush(mid, type, ts, text) {
    var m = monitors[mid];
    if (!m) return;

    // 编码为 UTF-8
    var tsBytes = new TextEncoder().encode(ts);
    var textBytes = new TextEncoder().encode(text);
    var totalLen = tsBytes.length + textBytes.length;

    // 扩容数据缓冲区
    if (m._textDataLen + totalLen > m._textData.length) {
        var newBuf = new Uint8Array(m._textData.length * 2);
        newBuf.set(m._textData);
        m._textData = newBuf;
    }
    // 扩容索引缓冲区
    if (m._textCount >= m._textOffsets.length) {
        var newSize = m._textOffsets.length * 2;
        m._textOffsets = new Uint32Array(newSize);
        m._textTypes = new Uint8Array(newSize);
        m._textTsLens = new Uint16Array(newSize);
    }

    // 写入数据
    m._textData.set(tsBytes, m._textDataLen);
    m._textDataLen += tsBytes.length;
    m._textData.set(textBytes, m._textDataLen);
    m._textDataLen += textBytes.length;

    // 写入索引
    m._textOffsets[m._textCount] = m._textDataLen;
    m._textTypes[m._textCount] = _typeMap[type] || 0;
    m._textTsLens[m._textCount] = tsBytes.length;
    m._textCount++;

    // 自动清理：超过 100 万行时移除最旧的 50 万行
    if (m._textCount > 1000000) {
        bufferTrimOld(m, 500000);
    }

    // 隐形日志缓存：会话活跃时把收发内容批量写入缓存文件（300ms 节流）
    if (m.isConnected && (type === 'recv' || type === 'send')) {
        if (m._logCachePending === undefined) m._logCachePending = '';
        m._logCachePending += ts + text + '\n';
        logCacheScheduleFlush(mid);
    }
}

// 移除最旧的 N 行
function bufferTrimOld(m, count) {
    count = Math.min(count, m._textCount);
    if (count <= 0) return;
    var newStart = m._textOffsets[count - 1]; // 第 N 行的结束位置 = 新数据的起始位置
    // 移动数据到开头
    var remaining = m._textDataLen - newStart;
    m._textData.copyWithin(0, newStart, m._textDataLen);
    m._textDataLen = remaining;
    // 移动索引
    for (var i = count; i < m._textCount; i++) {
        m._textOffsets[i - count] = m._textOffsets[i] - newStart;
        m._textTypes[i - count] = m._textTypes[i];
        m._textTsLens[i - count] = m._textTsLens[i];
    }
    m._textCount -= count;
    m._bufferStart = Math.max(0, m._bufferStart - count);
}

// 找到紧凑存储中最后一条 recv 记录（即“未结束的接收行”所在条目）
function bufferFindLastRecvIndex(m) {
    if (!m) return -1;
    for (var j = m._textCount - 1; j >= 0; j--) {
        if (m._textTypes[j] === 0) return j; // 0 = recv
    }
    return -1;
}

// 原地更新紧凑存储中某一行文本（保留时间戳），并修正后续行的偏移
function bufferUpdateLineText(m, idx, text) {
    if (!m || idx < 0 || idx >= m._textCount) return;
    var start = idx > 0 ? m._textOffsets[idx - 1] : 0;
    var oldEnd = m._textOffsets[idx];
    var tsLen = m._textTsLens[idx];
    var tsBytes = m._textData.slice(start, start + tsLen);
    var textBytes = new TextEncoder().encode(text);
    var newEnd = start + tsLen + textBytes.length;
    var delta = newEnd - oldEnd;
    if (m._textDataLen + delta > m._textData.length) {
        var newBuf = new Uint8Array(Math.max(m._textData.length * 2, m._textDataLen + delta));
        newBuf.set(m._textData);
        m._textData = newBuf;
    }
    if (delta !== 0) {
        m._textData.copyWithin(newEnd, oldEnd, m._textDataLen);
    }
    m._textData.set(tsBytes, start);
    m._textData.set(textBytes, start + tsLen);
    m._textDataLen += delta;
    m._textOffsets[idx] = newEnd;
    for (var j = idx + 1; j < m._textCount; j++) {
        m._textOffsets[j] += delta;
    }
}

// 读取一行
function bufferGetLine(m, index) {
    if (index < 0 || index >= m._textCount) return null;
    var end = m._textOffsets[index];
    var tsLen = m._textTsLens[index];
    var start = index > 0 ? m._textOffsets[index - 1] : 0;
    var tsBytes = m._textData.slice(start, start + tsLen);
    var textBytes = m._textData.slice(start + tsLen, end);
    return {
        type: _typeNames[m._textTypes[index]],
        ts: _textDecoder.decode(tsBytes),
        text: _textDecoder.decode(textBytes)
    };
}

// 读取范围
function bufferGetLines(m, startIdx, endIdx) {
    var result = [];
    for (var i = startIdx; i < endIdx && i < m._textCount; i++) {
        result.push(bufferGetLine(m, i));
    }
    return result;
}

// 获取全部文本（用于保存/复制）
function bufferGetAllText(m) {
    if (!m || m._textCount === 0) return '';
    var parts = [];
    for (var i = 0; i < m._textCount; i++) {
        var item = bufferGetLine(m, i);
        parts.push(item.ts + item.text.replace(/\x1b\[[0-9;]*m/g, ''));
    }
    return parts.join('\n');
}

// 从紧凑存储加载更多历史日志（滚动到顶部时触发）
function loadMoreHistory(mid, el, callback) {
    var m = monitors[mid];
    if (!m || m._bufferStart <= 0 || m._textCount === 0) { if (callback) callback(); return; }

    var loadCount = 1000;
    var startIdx = Math.max(0, m._bufferStart - loadCount);
    var endIdx = m._bufferStart;
    var items = bufferGetLines(m, startIdx, endIdx);
    if (items.length === 0) { if (callback) callback(); return; }

    // 记录当前滚动位置
    var prevScrollHeight = el.scrollHeight;

    // 用 DocumentFragment 批量创建
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var div = document.createElement('div');
        div.className = 'ol ' + item.type;
        var lnSpan = document.createElement('span');
        lnSpan.className = 'ln';
        lnSpan.setAttribute('contenteditable', 'false');
        div.appendChild(lnSpan);
        var contentSpan = document.createElement('span');
        contentSpan.className = 'lc';
        if (item.type === 'recv') {
            if (item.text.indexOf('\x1b') === -1) {
                contentSpan.textContent = item.ts + item.text;
            } else {
                contentSpan.innerHTML = escapeHtml(item.ts) + parseAnsi(item.text);
            }
        } else if (item.type === 'send') {
            // 安全：send 行不需要 ANSI 渲染，直接用 textContent，避免未转义文本注入 HTML（XSS）
            contentSpan.textContent = item.ts + item.text;
        } else {
            contentSpan.textContent = item.ts + item.text;
        }
        div.appendChild(contentSpan);
        fragment.appendChild(div);
    }

    // 插入到 DOM 开头
    el.prepend(fragment);

    // 重排行号：新插入的历史行 .ln 为空，且 _lineCount 需重算，避免行号错乱/重复（P1-15）
    updateLineNumbers(mid);

    // 调整滚动位置，让用户看到的内容不跳动
    var newScrollHeight = el.scrollHeight;
    el.scrollTop += (newScrollHeight - prevScrollHeight);

    // 更新 _bufferStart
    m._bufferStart = startIdx;

    if (callback) callback();
}

// 滚回底部时清理多余旧行
function cleanupExtraLines(mid, el) {
    var m = monitors[mid];
    if (!m) return;
    var maxLines = 10000;
    if (el.children.length <= maxLines) return;
    var removeCount = el.children.length - maxLines;
    var removedNonEmpty = 0;
    for (var r = 0; r < removeCount; r++) {
        if (!el.firstChild.classList.contains('empty-line')) removedNonEmpty++;
        el.removeChild(el.firstChild);
    }
    if (el._lineCount > removedNonEmpty) el._lineCount -= removedNonEmpty; else el._lineCount = 0;
    m._bufferStart += removedNonEmpty;
}

/* ===== 工具函数 ===== */
// 解析转义序列：\r\n -> CR+LF, \n -> LF, \r -> CR, \t -> TAB, \\ -> \
function parseEscapes(s) {
    return s.replace(/\\(r|n|t|\\)/g, function(m, ch) {
        if (ch === 'r') return '\r';
        if (ch === 'n') return '\n';
        if (ch === 't') return '\t';
        if (ch === '\\') return '\\';
        return m;
    });
}

function hexToBytes(s) {
    s = s.replace(/0[xX]/g,'').replace(/\s+/g,'');
    if (s.length%2!==0) throw new Error('Hex长度必须为偶数');
    var out = [];
    for (var i=0; i<s.length; i+=2) {
        var b = parseInt(s.substr(i,2),16);
        if (isNaN(b)) throw new Error('无效Hex: '+s.substr(i,2));
        out.push(b);
    }
    return new Uint8Array(out);
}
function bytesToHex(arr) {
    var u8 = arr instanceof Uint8Array ? arr : new Uint8Array(arr);
    var parts = new Array(u8.length);
    for (var i = 0; i < u8.length; i++) {
        parts[i] = (u8[i] < 16 ? '0' : '') + u8[i].toString(16).toUpperCase();
    }
    return parts.join(' ');
}

/* ===== 快速指令下拉 ===== */
function makeQcmdItem(mid, idx, label, value) {
    var item = document.createElement('div');
    item.className = 'qcmd-item';
    item.id = mid + '-qcmdi-' + idx;

    var labelInp = document.createElement('input');
    labelInp.className = 'qcmd-item-label';
    labelInp.type = 'text';
    labelInp.value = label;
    labelInp.placeholder = '名称';
    labelInp.title = '点击编辑名称';
    labelInp.addEventListener('click', function(e) { e.stopPropagation(); });
    labelInp.addEventListener('input', function() {
        monitors[mid].quickCmds[idx].label = this.value;
        scheduleConfigSave();
    });

    var valInp = document.createElement('input');
    valInp.className = 'qcmd-item-val';
    valInp.type = 'text';
    valInp.value = value;
    valInp.placeholder = '指令内容...';
    valInp.setAttribute('autocomplete', 'off');
    valInp.setAttribute('spellcheck', 'false');
    valInp.addEventListener('click', function(e) { e.stopPropagation(); });
    valInp.addEventListener('input', function() {
        monitors[mid].quickCmds[idx].value = this.value;
        scheduleConfigSave();
    });
    valInp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sendQcmdItem(mid, idx); }
    });

    var sendBtn = document.createElement('button');
    sendBtn.className = 'qcmd-item-send';
    sendBtn.innerHTML = ICONS.sendIcon;
    sendBtn.title = '发送';
    sendBtn.disabled = !monitors[mid].isConnected;
    sendBtn.setAttribute('data-qsend', '1');
    sendBtn.addEventListener('click', function(e) { e.stopPropagation(); sendQcmdItem(mid, idx); });

    var delBtn = document.createElement('button');
    delBtn.className = 'qcmd-item-del';
    delBtn.title = '删除';
    delBtn.innerHTML = '&#xd7;';
    delBtn.addEventListener('click', function(e) { e.stopPropagation(); removeQcmdItem(mid, idx); });

    item.appendChild(labelInp);
    item.appendChild(valInp);
    item.appendChild(sendBtn);
    item.appendChild(delBtn);
    return item;
}

function toggleQcmdDropdown(mid) {
    var drop = document.getElementById(mid + '-qcmdDrop');
    var btn = document.getElementById(mid + '-btnQcmd');
    var isOpen = drop.classList.contains('open');
    // 关闭所有其它下拉
    document.querySelectorAll('.qcmd-dropdown.open').forEach(function(d) {
        if (d !== drop) d.classList.remove('open');
    });
    document.querySelectorAll('.qcmd-trigger.on').forEach(function(b) {
        if (b !== btn) b.classList.remove('on');
    });
    if (isOpen) {
        drop.classList.remove('open');
        btn.classList.remove('on');
    } else {
        drop.classList.add('open');
        btn.classList.add('on');
    }
}

function addQcmdItem(mid) {
    var cmds = monitors[mid].quickCmds;
    var idx = cmds.length;
    cmds.push({label: '指令' + (idx + 1), value: ''});
    var qlist = document.getElementById(mid + '-qcmdList');
    var item = makeQcmdItem(mid, idx, cmds[idx].label, cmds[idx].value);
    qlist.appendChild(item);
    scheduleConfigSave();
}

function removeQcmdItem(mid, idx) {
    monitors[mid].quickCmds.splice(idx, 1);
    rebuildQcmdList(mid);
    scheduleConfigSave();
}

function rebuildQcmdList(mid) {
    var qlist = document.getElementById(mid + '-qcmdList');
    qlist.innerHTML = '';
    monitors[mid].quickCmds.forEach(function(cmd, i) {
        var item = makeQcmdItem(mid, i, cmd.label, cmd.value);
        qlist.appendChild(item);
    });
}

async function sendQcmdItem(mid, idx) {
    if (!monitors[mid] || !monitors[mid].isConnected) return;
    var item = document.getElementById(mid + '-qcmdi-' + idx);
    var valInp = item ? item.querySelector('.qcmd-item-val') : null;
    var text = '';
    if (valInp) { text = valInp.value; }
    else if (monitors[mid].quickCmds && monitors[mid].quickCmds[idx]) { text = monitors[mid].quickCmds[idx].value; }
    if (!text) return;
    var hexMode = document.getElementById(mid + '-sendAsText').textContent === 'HEX';
    var bytes;
    try {
        if (hexMode) { bytes = hexToBytes(text); }
        else { text = parseEscapes(text); text += leStr(mid); bytes = new TextEncoder().encode(text); }
    } catch (e) { appendOutput(mid, 'err', '格式错误: ' + e); return; }
    try {
        // 先显示 echo，再发送数据
        var echoBtn = document.getElementById(mid + '-btnEcho');
        if (echoBtn && echoBtn.classList.contains('on')) {
            appendOutput(mid, 'send', hexMode ? 'HEX: ' + bytesToHex(bytes) : decodeRaw(bytes));
        }
        var isWsl = monitors[mid].isWsl;
        if (isWsl) { await invokeTimeout('send_wsl_serial', { monitorId: mid, data: Array.from(bytes) }, 5000); }
        else { await invokeTimeout('send_data', { monitorId: mid, data: Array.from(bytes) }, 5000); }
        monitors[mid].histNavIdx = -1;
        scheduleConfigSave();
    } catch (e) { appendOutput(mid, 'err', '发送失败: ' + e); }
}

function updateQcmdSendBtns(mid, connected) {
    var qlist = document.getElementById(mid + '-qcmdList');
    if (!qlist) return;
    qlist.querySelectorAll('[data-qsend]').forEach(function(b) {
        b.disabled = !connected;
    });
}

/* ===== 自动化工作流 UI ===== */

function genWfId() { return 'wf_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4); }

function addWorkflowRule(mid) {
    if (!monitors[mid]) return;
    if (!monitors[mid].workflows) monitors[mid].workflows = [];
    monitors[mid].workflows.push({
        id: genWfId(), name: '新规则', enabled: true, running: false, collapsed: false,
        conditions: [{ type: 'string_contains', value: '' }],
        actions: [{ type: 'send_data', data: '', encoding: 'text', delayBefore: 0 }]
    });
    // 确保更多设置栏和工作流面板都展开
    var advRow = document.getElementById(mid + '-advRow');
    if (advRow && !advRow.classList.contains('vis')) {
        var advBtn = document.getElementById(mid + '-btnAdv');
        if (advBtn) advBtn.classList.add('on');
        advRow.classList.add('vis');
    }
    var wfWrap = document.getElementById(mid + '-advWf');
    if (wfWrap) wfWrap.classList.add('vis');
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function deleteWorkflowRule(mid, ruleId) {
    if (!monitors[mid] || !monitors[mid].workflows) return;
    monitors[mid].workflows = monitors[mid].workflows.filter(function(r) { return r.id !== ruleId; });
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function toggleWorkflowEnabled(mid, ruleId, enabled) {
    var rule = findWfRule(mid, ruleId);
    if (rule) { rule.enabled = enabled; saveWorkflowConfig(mid); }
}

function renameWorkflowRule(mid, ruleId, name) {
    var rule = findWfRule(mid, ruleId);
    if (rule) { rule.name = name; saveWorkflowConfig(mid); }
}

function toggleWfRuleCollapse(mid, ruleId) {
    var el = document.getElementById(mid + '-wfRule-' + ruleId);
    if (!el) return;
    el.classList.toggle('collapsed');
    var rule = findWfRule(mid, ruleId);
    if (rule) rule.collapsed = el.classList.contains('collapsed');
    var arrow = el.querySelector('.wf-rule-arrow');
    if (arrow) arrow.style.transform = el.classList.contains('collapsed') ? 'rotate(-90deg)' : '';
    scheduleConfigSave();
}

function findWfRule(mid, ruleId) {
    if (!monitors[mid] || !monitors[mid].workflows) return null;
    return monitors[mid].workflows.find(function(r) { return r.id === ruleId; });
}

function updateWfCondition(mid, ruleId, idx, field, value) {
    var rule = findWfRule(mid, ruleId);
    if (rule && rule.conditions[idx]) { rule.conditions[idx][field] = value; saveWorkflowConfig(mid); }
}

function addWfCondition(mid, ruleId) {
    var rule = findWfRule(mid, ruleId);
    if (!rule) return;
    rule.conditions.push({ type: 'string_contains', value: '' });
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function removeWfCondition(mid, ruleId, idx) {
    var rule = findWfRule(mid, ruleId);
    if (!rule || rule.conditions.length <= 1) return;
    rule.conditions.splice(idx, 1);
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function updateWfAction(mid, ruleId, idx, field, value) {
    var rule = findWfRule(mid, ruleId);
    if (rule && rule.actions[idx]) { rule.actions[idx][field] = value; saveWorkflowConfig(mid); }
}

function addWfAction(mid, ruleId) {
    var rule = findWfRule(mid, ruleId);
    if (!rule) return;
    rule.actions.push({ type: 'send_data', data: '', encoding: 'text', delayBefore: 0 });
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function removeWfAction(mid, ruleId, idx) {
    var rule = findWfRule(mid, ruleId);
    if (!rule || rule.actions.length <= 1) return;
    rule.actions.splice(idx, 1);
    renderWorkflowList(mid);
    saveWorkflowConfig(mid);
}

function saveWorkflowConfig(mid) {
    if (!monitors[mid]) return;
    var rules = monitors[mid].workflows || [];
    invoke('save_workflows', { monitorId: mid, workflowsJson: JSON.stringify(rules) }).catch(function(e) { console.warn('保存工作流失败:', e); reportError(e, 'saveWorkflowConfig'); });
    scheduleConfigSave();
}

function toggleWorkflowRun(mid, ruleId) {
    var rule = findWfRule(mid, ruleId);
    if (!rule) return;
    rule.running = !rule.running;
    // 同步到后端
    saveWorkflowConfig(mid);
    // 只更新按钮外观
    var card = document.getElementById(mid + '-wfRule-' + ruleId);
    if (card) {
        var runBtn = card.querySelector('.wf-run-btn');
        if (runBtn) {
            if (rule.running) {
                runBtn.classList.add('wf-running');
                runBtn.title = '停止';
                runBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 1024 1024" fill="currentColor"><path d="M256 128h170.666667v768H256zM597.333333 128H768v768H597.333333z"/></svg>';
                runBtn.style.cssText = 'background:var(--btn-p);color:#fff;border-color:var(--btn-p);';
            } else {
                runBtn.classList.remove('wf-running');
                runBtn.title = '运行';
                runBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 1024 1024" fill="currentColor"><path d="M725.333333 512L362.666667 256v512z"/></svg>';
                runBtn.style.cssText = '';
            }
        }
    }
}

function renderWorkflowList(mid) {
    var list = document.getElementById(mid + '-wfList');
    var wfContainer = document.getElementById(mid + '-advWf');
    var advRow = document.getElementById(mid + '-advRow');
    if (!list) return;
    var workflows = (monitors[mid] && monitors[mid].workflows) || [];
    // 切换 has-rules 类
    if (wfContainer) wfContainer.classList.toggle('has-rules', workflows.length > 0);
    // 如果更多设置栏可见且有规则，显示工作流面板；无规则则隐藏

        wfContainer.classList.toggle('vis', workflows.length > 0);
    }
    list.innerHTML = '';
    if (workflows.length === 0) return;
    workflows.forEach(function(rule) {
        var card = document.createElement('div');

        var isRunning = rule.running || false;

            : '<svg width="20" height="20" viewBox="0 0 1024 1024" fill="currentColor"><path d="M725.333333 512L362.666667 256v512z"/></svg>';

            '<button class="wf-rule-btn wf-run-btn' + (isRunning ? ' wf-running' : '') + '" onclick="toggleWorkflowRun(\'' + mid + '\',\'' + rule.id + '\')" title="' + (isRunning ? '停止' : '运行') + '" style="' + (isRunning ? 'background:var(--btn-p);color:#fff;border-color:var(--btn-p);' : '') + '">' + runIcon + '</button>' +
            '<button class="wf-rule-btn wf-rule-arrow" onclick="toggleWfRuleCollapse(\'' + mid + '\',\'' + rule.id + '\')" title="折叠/展开" style="transition:transform .2s ease;' + (isCollapsed ? 'transform:rotate(-90deg);' : '') + '">' + ICONS.chevronDown + '</button>' +
            '<button class="wf-rule-btn del" onclick="deleteWorkflowRule(\'' + mid + '\',\'' + rule.id + '\')" title="删除">&#xd7;</button>';
        card.appendChild(header);

        // Body

        body.className = 'wf-rule-body';

        condSection.className = 'wf-section';

function wfCondLabel(type) {
    return { string_contains: '字符串包含', regex: '正则表达式', exact_bytes: '精确字节' }[type] || type;
}
function wfCondPlaceholder(type) {
    return { string_contains: '输入匹配字符串...', regex: '输入正则表达式...', exact_bytes: '输入HEX如 FF 01 02' }[type] || '';
}
function wfActLabel(type) {
    return { send_data: '发送数据', toggle_dtr_rts: '切换信号', save_log: '保存日志' }[type] || type;
}
// Setter functions - only re-render when row structure changes
function setWfCondType(el, mid, ruleId, idx, val, e) {
    e.stopPropagation();
    setSel(el, val, e);
    updateWfCondition(mid, ruleId, idx, 'type', val);
    // 类型变了，placeholder 要更新
    var row = el.closest('.wf-row');
    var inp = row ? row.querySelector('input[type="text"]') : null;
    if (inp) inp.placeholder = wfCondPlaceholder(val);
    scheduleConfigSave();
}
function setWfActType(el, mid, ruleId, idx, val, e) {
    e.stopPropagation();
    setSel(el, val, e);
    var rule = findWfRule(mid, ruleId);
    if (rule && rule.actions[idx]) {
        rule.actions[idx].type = val;
        if (val === 'send_data') { rule.actions[idx].encoding = rule.actions[idx].encoding || 'text'; rule.actions[idx].data = rule.actions[idx].data || ''; }
        if (val === 'toggle_dtr_rts') { rule.actions[idx].signal = rule.actions[idx].signal || 'dtr'; rule.actions[idx].level = rule.actions[idx].level || false; }
    }
    // 行结构变了，只重渲染该行
    var row = el.closest('.wf-row');
    var actSection = row ? row.closest('.wf-section') : null;
    if (actSection) renderWfActRow(actSection, mid, ruleId, idx);
    saveWorkflowConfig(mid);
}
function setWfActEnc(el, mid, ruleId, idx, val, e) {
    e.stopPropagation();
    setSel(el, val, e);
    updateWfAction(mid, ruleId, idx, 'encoding', val);
    scheduleConfigSave();
}
function setWfActSig(el, mid, ruleId, idx, val, e) {
    e.stopPropagation();
    setSel(el, val, e);
    updateWfAction(mid, ruleId, idx, 'signal', val);
    scheduleConfigSave();
}
function setWfActLvl(el, mid, ruleId, idx, val, e) {
    e.stopPropagation();
    setSel(el, val ? 'true' : 'false', e);
    updateWfAction(mid, ruleId, idx, 'level', val);
    scheduleConfigSave();
}

/* ===== 自动更新 ===== */
var _updateInfo = null;

// 检查更新（启动时调用，之后每 30 分钟轮询）
async function checkForUpdate() {
    // 已经发现更新且按钮可见，无需重复检查
    if (_updateInfo && _updateInfo.has_update) return;
    try {
        var result = await invoke('check_update');
        if (result.has_update) {
            _updateInfo = result;
            var btn = document.getElementById('updateBtn');
            btn.textContent = '更新 ' + result.latest_version;
            btn.style.display = 'inline-flex';
        }
    } catch (e) {
        console.warn('检查更新失败:', e);
        reportError(e, 'checkForUpdate');
    }
}

// 下载并安装更新
async function downloadAndInstallUpdate() {
    if (!_updateInfo || !_updateInfo.download_url) return;
    var btn = document.getElementById('updateBtn');
    btn.classList.add('disabled');
    btn.textContent = '正在下载...';
    try {
        var filePath = await invoke('download_update', { downloadUrl: _updateInfo.download_url, sha256: _updateInfo.sha256 || null, size: _updateInfo.size || null });
        btn.textContent = '正在安装...';
        await invoke('install_update', { filePath: filePath });
    } catch (e) {
        showToast('更新失败: ' + e, 'error');
        btn.classList.remove('disabled');
        btn.textContent = '更新 ' + _updateInfo.latest_version;
    }
}

/* ===== 配置保存/恢复 ===== */
// 收集所有监视器的当前配置，返回 JSON 对象
function collectConfig() {
    var maxExtra = 0;
    Object.keys(monitors).forEach(function(mid) {
        var m = mid.match(/^extra-(\d+)$/);
        if (m) { var n = parseInt(m[1], 10); if (n > maxExtra) maxExtra = n; }
    });
    var cfg = { version: 2, extraCount: maxExtra, wslExtraCount: _wslExtraCount, monitors: {}, logDir: logDirPath, wslAutoMap: _wslAutoMap, theme: _currentTheme, themeStyle: _currentThemeStyle };
    if (_cachedWindowSize) {
        cfg.windowWidth = _cachedWindowSize[0];
        cfg.windowHeight = _cachedWindowSize[1];
    }
    Object.keys(monitors).forEach(function(mid) {
        var m = monitors[mid];
        // 蓝牙页内嵌监视器是临时助手（不持久化；恢复逻辑也只按 extra-N 重建）
        if (m && m.bleEmbedded) return;
        var portSel   = document.getElementById(mid + '-portSelect');
        var baudInp   = document.getElementById(mid + '-baudRate');
        var lineEnd   = document.getElementById(mid + '-lineEnding');
        var viewMode  = document.getElementById(mid + '-viewMode');
        var dataBits  = document.getElementById(mid + '-dataBits');
        var stopBits  = document.getElementById(mid + '-stopBits');
        var parity    = document.getElementById(mid + '-parity');
        var chkDTR    = document.getElementById(mid + '-chkDTR');
        var chkRTS    = document.getElementById(mid + '-chkRTS');
        var advRow    = document.getElementById(mid + '-advRow');
        var sendAsText = document.getElementById(mid + '-sendAsText');
        function btnOn(id) { var el = document.getElementById(id); return el ? el.classList.contains('on') : true; }
        // DOM 不存在时使用 monitors[mid] 中已保存的状态值
        var saved = m._savedSettings || {};
        cfg.monitors[mid] = {
            port:         portSel  ? (portSel.getAttribute('data-val') || '') : (saved.port || ''),
            baud:         baudInp  ? baudInp.value  : (saved.baud || '115200'),
            lineEnding:   lineEnd  ? (lineEnd.getAttribute('data-val') || 'crlf') : (saved.lineEnding || 'crlf'),
            viewMode:     viewMode ? (viewMode.getAttribute('data-val') || 'text') : (saved.viewMode || 'text'),
            sendAs:       sendAsText ? (sendAsText.textContent === 'HEX' ? 'hex' : 'text') : (saved.sendAs || 'text'),
            dataBits:     dataBits ? (dataBits.getAttribute('data-val') || '8') : (saved.dataBits || '8'),
            stopBits:     stopBits ? (stopBits.getAttribute('data-val') || '1') : (saved.stopBits || '1'),
            parity:       parity   ? (parity.getAttribute('data-val') || 'none')   : (saved.parity || 'none'),
            dtr:          chkDTR   ? chkDTR.checked : (saved.dtr !== undefined ? saved.dtr : false),
            rts:          chkRTS   ? chkRTS.checked : (saved.rts !== undefined ? saved.rts : true),
            advOpen:      advRow   ? advRow.classList.contains('vis') : false,
            btnScroll:    btnOn(mid + '-btnScroll'),
            btnAutoReconnect: btnOn(mid + '-btnAutoReconnect'),
            btnSendLE:    btnOn(mid + '-btnSendLE'),
            btnTs:        btnOn(mid + '-btnTs'),
            btnEcho:      btnOn(mid + '-btnEcho'),
            btnLineNum:   btnOn(mid + '-btnLineNum'),
            quickCmds:    m.quickCmds ? JSON.parse(JSON.stringify(m.quickCmds)) : [],
            sendHistory:  m.sendHistory ? m.sendHistory.slice(0, 20) : [],
            panelHeight:  saved.panelHeight || 0,
            workflows:    m.workflows ? JSON.parse(JSON.stringify(m.workflows)) : [],
        };
    });
    // WSL 面板为懒加载，未初始化时用缓存的配置，防止主监视器保存时丢失 WSL 快捷指令
    if (!monitors['wsl'] && _wslSavedConfig) {
        cfg.monitors['wsl'] = _wslSavedConfig;
    }
    return cfg;
}

// 复制源监视器的用户配置到目标监视器（深拷贝，两监视器配置互不干扰）
function copyMonitorConfig(srcMid, dstMid, opts) {
    if (!monitors[srcMid] || !monitors[dstMid]) return;
    var cfg = collectConfigForMonitor(srcMid);
    if (!cfg) return;
    // opts.skipPort：不继承端口（蓝牙页内嵌监视器用，避免与主监视器抢同一个串口）
    if (opts && opts.skipPort) { delete cfg.port; }
    // 终端模式需要额外的初始化状态，暂不复制；发送历史是运行时数据，不复制
    delete cfg.btnSendLE;
    delete cfg.sendHistory;
    applyMonitorConfig(dstMid, cfg);
    // 复制的工作流规则需要重新渲染列表
    if (cfg.workflows && cfg.workflows.length > 0 && monitors[dstMid]) {
        renderWorkflowList(dstMid);
    }
    // 触发端口列表刷新，应用复制的端口选择
    if (monitors[dstMid] && monitors[dstMid].isWsl) {
        refreshWslMonPorts(dstMid);
    } else {
        refreshPorts(dstMid);
    }
}

// 将配置应用到指定监视器
function applyMonitorConfig(mid, mc) {
    if (!mc) return;
    // 波特率
    var baudInp = document.getElementById(mid + '-baudRate');
    if (baudInp && mc.baud) {
        baudInp.value = mc.baud;
        var baudDrop = document.getElementById(mid + '-baudDropdown');
        if (baudDrop) {
            baudDrop.querySelectorAll('.baud-opt').forEach(function(o) {
                o.classList.toggle('active', o.textContent.trim() === String(mc.baud));
            });
        }
    }
    // 行尾
    if (mc.lineEnding) {
        var lineEnd = document.getElementById(mid + '-lineEnding');
        if (lineEnd) {
            lineEnd.setAttribute('data-val', mc.lineEnding);
            var lineEndOpt = lineEnd.querySelector('.sel-opt[data-val="' + mc.lineEnding + '"]');
            if (lineEndOpt) {
                lineEnd.querySelector('.sel-text').textContent = lineEndOpt.textContent;
                lineEnd.querySelectorAll('.sel-opt').forEach(function(o) { o.classList.remove('active'); });
                lineEndOpt.classList.add('active');
            }
        }
    }

}

function applyTheme(theme) {
    _currentTheme = theme;
    var el = document.documentElement;
    el.classList.add('transitioning');
    el.setAttribute('data-theme', getThemeDataAttr());
    syncThemeUI();
    var palette = _TITLE_BAR_COLORS[_currentThemeStyle] || _TITLE_BAR_COLORS['default'];
    animateTitleBar(palette[_currentTheme] || palette.dark, 300);
    clearTimeout(el._transTid);
    el._transTid = setTimeout(function() { el.classList.remove('transitioning'); }, 350);
}

var _titleBarCur = { r: 28, g: 30, b: 34 };

function easeOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function animateTitleBar(target, duration) {
    var start = { r: _titleBarCur.r, g: _titleBarCur.g, b: _titleBarCur.b };
    var startTime = Date.now();
    if (_titleBarAnim) clearInterval(_titleBarAnim);
    _titleBarAnim = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var t = Math.min(elapsed / duration, 1);
        var et = easeOut(t);
        var r = Math.round(start.r + (target.r - start.r) * et);
        var g = Math.round(start.g + (target.g - start.g) * et);
        var b = Math.round(start.b + (target.b - start.b) * et);
        try { invoke('set_title_bar_color', { r: r, g: g, b: b }).catch(function(_v) {}); } catch(_) {}
        if (t >= 1) { clearInterval(_titleBarAnim); _titleBarAnim = null; _titleBarCur = { r: target.r, g: target.g, b: target.b }; }
    }, 16);
}
var _titleBarAnim = null;

function syncTitleBarColor(theme) {
    var palette = _TITLE_BAR_COLORS[_currentThemeStyle] || _TITLE_BAR_COLORS['default'];
    animateTitleBar(palette[theme] || palette.dark, 300);
}

// 启动时加载配置
async function loadAndApplyConfig() {
    _loadingConfig = true;
    try {
        var raw = await invoke('load_config');
        if (!raw) { _loadingConfig = false; return; }
        var cfg = JSON.parse(raw);
        if (!cfg) { _loadingConfig = false; return; }
        // 旧配置可能没有 version 字段（或值不可识别）：一律按可迁移的旧版处理。
        // 原先这里直接 return 会让配置不生效，而退出时 collectConfig 又会用默认值覆盖，
        // 等于"升级后配置被清空"。现在先备份原文件，再补齐缺失字段并升级到当前 schema。
        if (cfg.version !== 1 && cfg.version !== 2) {
            try { await invoke('backup_config'); } catch (e) { console.warn('配置备份失败(跳过):', e); }
            // 按最老的 v1 结构补齐字段，再升到当前版本
            Object.keys(cfg.monitors || {}).forEach(function(mid) {
                if (cfg.monitors[mid] && !cfg.monitors[mid].workflows) cfg.monitors[mid].workflows = [];
            });
            cfg.version = 2;
            invoke('save_config', { configJson: JSON.stringify(cfg) }).catch(function(e) { console.warn('保存配置失败:', e); reportError(e, 'save-config-migrate'); });
        } else if (cfg.version === 1) {
            // V1 → V2 迁移：添加空 workflows
            Object.keys(cfg.monitors || {}).forEach(function(mid) {
                if (cfg.monitors[mid] && !cfg.monitors[mid].workflows) cfg.monitors[mid].workflows = [];
            });
            cfg.version = 2;
            invoke('save_config', { configJson: JSON.stringify(cfg) }).catch(function(e) { console.warn('保存配置失败:', e); reportError(e, 'save-config-v2'); });
        }
        // 恢复主题
        if (cfg.themeStyle) _currentThemeStyle = cfg.themeStyle;
        if (cfg.theme) applyTheme(cfg.theme);
        // 恢复日志目录
        if (cfg.logDir) logDirPath = cfg.logDir;
        // 恢复WSL自动映射
        if (cfg.wslAutoMap && typeof cfg.wslAutoMap === 'object') {
            // 迁移：清除旧的 busid 键（如 "1-3"），只保留 vidpid 键（如 "1A86:7523"）
            var migrated = {};
            Object.keys(cfg.wslAutoMap).forEach(function(k) {
                if (k.indexOf(':') !== -1) migrated[k] = cfg.wslAutoMap[k];
            });
            _wslAutoMap = migrated;
            updateAutoMapPolling();
        }
        // 恢复窗口大小
        if (cfg.windowWidth && cfg.windowHeight) {
            invoke('set_window_size', { width: cfg.windowWidth, height: cfg.windowHeight }).catch(function(e) {
                console.warn('恢复窗口大小失败:', e);
            });
        }
        // 恢复主监视器配置
        if (cfg.monitors && cfg.monitors['main']) {
            applyMonitorConfig('main', cfg.monitors['main']);
        }
        // 缓存 WSL 监视器配置（WSL 面板为懒加载，需在保存时合并回去）
        if (cfg.monitors && cfg.monitors['wsl']) {
            _wslSavedConfig = cfg.monitors['wsl'];
        }
        // 恢复额外监视器
        var savedExtra = cfg.extraCount || 0;
        for (var i = 1; i <= savedExtra; i++) {
            var emid = 'extra-' + i;
            addMonitor(); // 已经会递增 extraCount
            if (cfg.monitors && cfg.monitors[emid]) {
                applyMonitorConfig(emid, cfg.monitors[emid]);
            }
        }
        // 渲染所有监视器的工作流规则列表
        Object.keys(monitors).forEach(function(mid) {
            if (monitors[mid] && monitors[mid].workflows && monitors[mid].workflows.length > 0) {
                renderWorkflowList(mid);
            }
        });
        // 初始化 Rust 端工作流状态
        invoke('init_workflows', { configJson: JSON.stringify(cfg) }).catch(function() {});
    } catch (e) {
        console.warn('加载配置失败:', e);
    }
    _loadingConfig = false;
}
